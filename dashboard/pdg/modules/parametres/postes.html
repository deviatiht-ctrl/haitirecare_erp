<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postes - ERP Entreprise</title>
  <link rel="stylesheet" href="../../../../assets/css/variables.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/main.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/layout.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/components.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/dashboard.css?v=6">
  <style>
    .permissions-checkboxes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      max-height: 300px;
      overflow-y: auto;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .checkbox-label:hover {
      background: var(--bg-tertiary);
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    .checkbox-label span {
      font-size: 13px;
      color: var(--text-primary);
    }

    .modal {
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-body {
      max-height: calc(90vh - 150px);
      overflow-y: auto;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .table-actions {
      display: flex;
      gap: 8px;
    }

    .table-action-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .table-action-btn.primary {
      background: var(--primary-color);
      color: white;
    }

    .table-action-btn.primary:hover {
      background: var(--primary-dark);
    }

    .table-action-btn.danger {
      background: var(--danger-color);
      color: white;
    }

    .table-action-btn.danger:hover {
      background: #dc2626;
    }

    .permissions-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../../assets/js/supabase.js?v=7"></script>
  <script src="../../../../assets/js/auth.js?v=7"></script>
  <script src="../../../../assets/js/layout.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../../../assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Postes</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-primary" onclick="openAddPostModal()">
              <i data-lucide="plus"></i>
              Ajouter un poste
            </button>
          </div>
        </div>

        <div class="card">
          <div class="table-container">
            <table class="table" id="postes-table">
              <thead>
                <tr>
                  <th>Nom du poste</th>
                  <th>Rôle</th>
                  <th>Département</th>
                  <th>Tâches principales</th>
                  <th>Responsabilités</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="postes-table-body">
                <tr>
                  <td colspan="6" style="text-align: center; padding: var(--space-6);">
                    <div class="loading">
                      <div class="loading-spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Post Modal -->
  <div id="add-post-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Ajouter un poste</h3>
        <button class="modal-close" onclick="closeAddPostModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="add-post-form" class="modal-body">
        <div class="form-group">
          <label class="form-label">Nom du poste *</label>
          <input type="text" name="name" class="form-input" placeholder="Ex: Secrétaire, Comptable..." required>
        </div>
        <div class="form-group">
          <label class="form-label">Code du poste</label>
          <input type="text" name="code" class="form-input" placeholder="Ex: SECR, COMPT...">
        </div>
        <div class="form-group">
          <label class="form-label">Rôle *</label>
          <select name="role" class="form-input" required>
            <option value="">Sélectionner un rôle</option>
            <option value="pdg">PDG</option>
            <option value="secretaire">Secrétaire</option>
            <option value="comptable">Comptable</option>
            <option value="responsable_stock">Responsable Stock</option>
            <option value="commercial">Commercial</option>
            <option value="rh">RH</option>
            <option value="employe">Employé</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Département</label>
          <select name="department" class="form-input">
            <option value="">Sélectionner un département</option>
            <option value="Administration">Administration</option>
            <option value="Finance">Finance</option>
            <option value="Ressources Humaines">Ressources Humaines</option>
            <option value="Commercial">Commercial</option>
            <option value="Stock">Stock</option>
            <option value="IT">IT</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-input form-textarea" rows="3" placeholder="Description du poste..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Tâches principales</label>
          <textarea name="tasks" class="form-input form-textarea" rows="4" placeholder="Liste des tâches principales (une par ligne)&#10;Ex:&#10;- Gérer les communications&#10;- Organiser les rendez-vous&#10;- Gérer le courrier"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Responsabilités</label>
          <textarea name="responsibilities" class="form-input form-textarea" rows="4" placeholder="Liste des responsabilités (une par ligne)&#10;Ex:&#10;- Superviser l'équipe&#10;- Gérer le budget&#10;- Rapport mensuel"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Contre rendu (KPI/Objectifs)</label>
          <textarea name="kpi" class="form-input form-textarea" rows="3" placeholder="Objectifs et indicateurs de performance&#10;Ex:&#10;- 100 appels par jour&#10;- 5 nouveaux clients par mois"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Éléments gérés</label>
          <textarea name="managed_items" class="form-input form-textarea" rows="3" placeholder="Éléments que ce poste gère&#10;Ex:&#10;- Stock de produits&#10;- Équipe commerciale&#10;- Budget marketing"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Salaire de base</label>
          <input type="number" name="salary" class="form-input" placeholder="0.00" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">Statut</label>
          <select name="status" class="form-input">
            <option value="active">Actif</option>
            <option value="inactive">Inactif</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Permissions</label>
          <div class="permissions-checkboxes">
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="users.view">
              <span>Utilisateurs (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="users.edit">
              <span>Utilisateurs (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="stock.view">
              <span>Stock (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="stock.edit">
              <span>Stock (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="finances.view">
              <span>Finances (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="finances.edit">
              <span>Finances (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="rh.view">
              <span>RH (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="rh.edit">
              <span>RH (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="clients.view">
              <span>Clients (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="clients.edit">
              <span>Clients (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="rapports.view">
              <span>Rapports (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="rapports.export">
              <span>Rapports (Exporter)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="parametres.view">
              <span>Paramètres (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="parametres.edit">
              <span>Paramètres (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="all">
              <span>Tous les accès (Admin)</span>
            </label>
          </div>
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddPostModal()">Annuler</button>
        <button class="btn btn-primary" onclick="submitAddPost()">Ajouter</button>
      </div>
    </div>
  </div>

  <script>
    let allPostes = [];

    async function loadPostes() {
      try {
        const { data: postes } = await db.from('erp_postes').select('*').eq('is_active', true).order('name');
        allPostes = postes || [];
        renderPostesTable(allPostes);
      } catch (error) {
        console.error('Load postes error:', error);
      }
    }

    function renderPostesTable(postes) {
      const tbody = document.getElementById('postes-table-body');
      
      if (!postes.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; padding: 40px;">
              <div class="empty-state">
                <i data-lucide="briefcase" style="width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
                <p style="color: var(--text-secondary);">Aucun poste trouvé</p>
                <button class="btn btn-primary" onclick="openAddPostModal()" style="margin-top: 16px;">
                  <i data-lucide="plus"></i>
                  Ajouter un poste
                </button>
              </div>
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = postes.map(post => `
        <tr>
          <td>
            <div style="font-weight: 500;">${post.name}</div>
            ${post.code ? `<div style="font-size: 12px; color: var(--text-secondary);">${post.code}</div>` : ''}
          </td>
          <td>
            <span class="badge badge-secondary">${formatRole(post.role)}</span>
          </td>
          <td>
            <span class="badge badge-primary">${post.department || '-'}</span>
          </td>
          <td>
            <div style="font-size: 13px; color: var(--text-secondary); max-width: 200px; white-space: pre-wrap;">
              ${post.tasks ? post.tasks.substring(0, 100) + (post.tasks.length > 100 ? '...' : '') : '-'}
            </div>
          </td>
          <td>
            <div style="font-size: 13px; color: var(--text-secondary); max-width: 200px; white-space: pre-wrap;">
              ${post.responsibilities ? post.responsibilities.substring(0, 100) + (post.responsibilities.length > 100 ? '...' : '') : '-'}
            </div>
          </td>
          <td>
            <div class="table-actions">
              <button class="table-action-btn primary" onclick="editPost('${post.id}')" title="Modifier" style="background: #3b82f6; color: white;">
                <i data-lucide="edit-2"></i>
              </button>
              <button class="table-action-btn danger" onclick="deletePost('${post.id}')" title="Supprimer" style="background: #ef4444; color: white;">
                <i data-lucide="trash-2"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
      
      lucide.createIcons();
    }

    function openAddPostModal() {
      document.getElementById('add-post-modal').classList.remove('hidden');
    }

    function closeAddPostModal() {
      document.getElementById('add-post-modal').classList.add('hidden');
      document.getElementById('add-post-form').reset();
      editingPostId = null;
      document.querySelector('#add-post-modal .modal-title').textContent = 'Ajouter un poste';
      document.getElementById('submit-post-btn').textContent = 'Ajouter';
    }

    let editingPostId = null;

    async function submitAddPost() {
      const form = document.getElementById('add-post-form');
      
      // Get all checked permissions
      const permissionCheckboxes = form.querySelectorAll('input[name="permissions"]:checked');
      const permissionsArray = Array.from(permissionCheckboxes).map(cb => cb.value);
      
      // Build permissions object
      const permissionsObj = {};
      permissionsArray.forEach(perm => {
        permissionsObj[perm] = true;
      });

      const postData = {
        name: form.name.value,
        code: form.code.value,
        role: form.role.value,
        department: form.department.value,
        description: form.description.value,
        tasks: form.tasks.value,
        responsibilities: form.responsibilities.value,
        kpi: form.kpi.value,
        managed_items: form.managed_items.value,
        salary: form.salary.value ? parseFloat(form.salary.value) : null,
        status: form.status.value,
        permissions: permissionsObj
      };

      if (!postData.name) {
        alert('Veuillez entrer le nom du poste');
        return;
      }

      try {
        if (editingPostId) {
          // Update existing post
          await db.from('erp_postes').update(postData).eq('id', editingPostId);
          logActivity('Modification poste', 'Paramètres', `Poste ${postData.name} modifié`);
        } else {
          // Insert new post
          await db.from('erp_postes').insert(postData);
          logActivity('Création poste', 'Paramètres', `Poste ${postData.name} créé`);
        }
        closeAddPostModal();
        editingPostId = null;
        await loadPostes();
      } catch (error) {
        console.error('Add post error:', error);
        alert('Erreur lors de l\'ajout: ' + error.message);
      }
    }

    async function deletePost(postId) {
      if (!confirm('Êtes-vous sûr de vouloir supprimer ce poste ?')) return;
      
      try {
        await db.from('erp_postes').update({ is_active: false }).eq('id', postId);
        await loadPostes();
        logActivity('Suppression poste', 'Paramètres', `Poste supprimé`);
      } catch (error) {
        console.error('Delete post error:', error);
        alert('Erreur lors de la suppression');
      }
    }

    async function editPost(postId) {
      const post = allPostes.find(p => p.id === postId);
      if (!post) return;

      editingPostId = postId;
      document.querySelector('#add-post-modal .modal-title').textContent = 'Modifier le poste';
      document.getElementById('submit-post-btn').textContent = 'Modifier';

      const form = document.getElementById('add-post-form');
      form.name.value = post.name || '';
      form.code.value = post.code || '';
      form.role.value = post.role || '';
      form.department.value = post.department || '';
      form.description.value = post.description || '';
      form.tasks.value = post.tasks || '';
      form.responsibilities.value = post.responsibilities || '';
      form.kpi.value = post.kpi || '';
      form.managed_items.value = post.managed_items || '';
      form.salary.value = post.salary || '';
      form.status.value = post.status || 'active';

      // Reset all checkboxes
      const checkboxes = form.querySelectorAll('input[name="permissions"]');
      checkboxes.forEach(cb => cb.checked = false);

      // Check permissions based on object or string
      if (post.permissions) {
        if (typeof post.permissions === 'object') {
          Object.keys(post.permissions).forEach(perm => {
            if (post.permissions[perm]) {
              const checkbox = form.querySelector(`input[name="permissions"][value="${perm}"]`);
              if (checkbox) checkbox.checked = true;
            }
          });
        } else {
          post.permissions.split(',').forEach(perm => {
            const checkbox = form.querySelector(`input[name="permissions"][value="${perm.trim()}"]`);
            if (checkbox) checkbox.checked = true;
          });
        }
      }

      openAddPostModal();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadPostes();
      });
    });
  </script>
</body>
</html>
