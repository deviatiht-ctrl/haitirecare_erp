<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rôles - ERP Entreprise</title>
  <link rel="stylesheet" href="../../../../assets/css/variables.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/main.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/layout.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/components.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/dashboard.css?v=6">
  <style>
    .permissions-checkboxes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      max-height: 300px;
      overflow-y: auto;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .checkbox-label:hover {
      background: var(--bg-tertiary);
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    .checkbox-label span {
      font-size: 13px;
      color: var(--text-primary);
    }

    .modal {
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-body {
      max-height: calc(90vh - 150px);
      overflow-y: auto;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .table-actions {
      display: flex;
      gap: 8px;
    }

    .table-action-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .table-action-btn.primary {
      background: var(--primary-color);
      color: white;
    }

    .table-action-btn.primary:hover {
      background: var(--primary-dark);
    }

    .table-action-btn.danger {
      background: var(--danger-color);
      color: white;
    }

    .table-action-btn.danger:hover {
      background: #dc2626;
    }

    .permissions-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../../assets/js/supabase.js?v=7"></script>
  <script src="../../../../assets/js/auth.js?v=7"></script>
  <script src="../../../../assets/js/layout.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../../../assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Rôles</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-primary" onclick="openAddRoleModal()">
              <i data-lucide="plus"></i>
              Ajouter un rôle
            </button>
          </div>
        </div>

        <div class="card">
          <div class="table-container">
            <table class="table" id="roles-table">
              <thead>
                <tr>
                  <th>Nom du rôle</th>
                  <th>Code</th>
                  <th>Description</th>
                  <th>Permissions</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="roles-table-body">
                <tr>
                  <td colspan="5" style="text-align: center; padding: var(--space-6);">
                    <div class="loading">
                      <div class="loading-spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Role Modal -->
  <div id="add-role-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Ajouter un rôle</h3>
        <button class="modal-close" onclick="closeAddRoleModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="add-role-form" class="modal-body">
        <div class="form-group">
          <label class="form-label">Nom du rôle *</label>
          <input type="text" name="name" class="form-input" placeholder="Ex: PDG, Secrétaire, Comptable..." required>
        </div>
        <div class="form-group">
          <label class="form-label">Code du rôle *</label>
          <input type="text" name="code" class="form-input" placeholder="Ex: pdg, secretaire, comptable..." required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-input form-textarea" rows="3" placeholder="Description du rôle..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Permissions</label>
          <div class="permissions-checkboxes">
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="users.view">
              <span>Utilisateurs (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="users.edit">
              <span>Utilisateurs (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="users.delete">
              <span>Utilisateurs (Supprimer)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="stock.view">
              <span>Stock (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="stock.edit">
              <span>Stock (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="stock.delete">
              <span>Stock (Supprimer)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="finances.view">
              <span>Finances (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="finances.edit">
              <span>Finances (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="rh.view">
              <span>RH (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="rh.edit">
              <span>RH (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="clients.view">
              <span>Clients (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="clients.edit">
              <span>Clients (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="clients.delete">
              <span>Clients (Supprimer)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="rapports.view">
              <span>Rapports (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="rapports.export">
              <span>Rapports (Exporter)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="parametres.view">
              <span>Paramètres (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="parametres.edit">
              <span>Paramètres (Modifier)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="messages.view">
              <span>Messages (Voir)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="messages.send">
              <span>Messages (Envoyer)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="permissions" value="all">
              <span>Tous les accès (Admin)</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Statut</label>
          <select name="status" class="form-input">
            <option value="active">Actif</option>
            <option value="inactive">Inactif</option>
          </select>
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddRoleModal()">Annuler</button>
        <button class="btn btn-primary" onclick="submitAddRole()" id="submit-role-btn">Ajouter</button>
      </div>
    </div>
  </div>

  <script>
    let allRoles = [];
    let editingRoleId = null;

    async function loadRoles() {
      try {
        const { data: roles } = await db.from('erp_roles').select('*').eq('is_active', true).order('name');
        allRoles = roles || [];
        renderRolesTable(allRoles);
      } catch (error) {
        console.error('Load roles error:', error);
      }
    }

    function renderRolesTable(roles) {
      const tbody = document.getElementById('roles-table-body');
      
      if (!roles.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; padding: 40px;">
              <div class="empty-state">
                <i data-lucide="shield" style="width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
                <p style="color: var(--text-secondary);">Aucun rôle trouvé</p>
                <button class="btn btn-primary" onclick="openAddRoleModal()" style="margin-top: 16px;">
                  <i data-lucide="plus"></i>
                  Ajouter un rôle
                </button>
              </div>
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = roles.map(role => `
        <tr>
          <td>
            <div style="font-weight: 500;">${role.name}</div>
          </td>
          <td>
            <span class="badge badge-secondary" style="font-family: monospace;">${role.code}</span>
          </td>
          <td>
            <div style="font-size: 13px; color: var(--text-secondary); max-width: 200px;">
              ${role.description || '-'}
            </div>
          </td>
          <td>
            <div class="permissions-list">
              ${role.permissions && typeof role.permissions === 'object' 
                ? Object.entries(role.permissions).filter(([k, v]) => v).map(([k]) => `<span class="badge badge-secondary" style="font-size: 11px;">${k}</span>`).join(' ')
                : role.permissions 
                  ? role.permissions.split(',').map(p => `<span class="badge badge-secondary" style="font-size: 11px;">${p.trim()}</span>`).join(' ')
                  : '<span style="color: var(--text-secondary);">-</span>'}
            </div>
          </td>
          <td>
            <div class="table-actions">
              <button class="table-action-btn primary" onclick="editRole('${role.id}')" title="Modifier" style="background: #3b82f6; color: white;">
                <i data-lucide="edit-2"></i>
              </button>
              <button class="table-action-btn danger" onclick="deleteRole('${role.id}')" title="Supprimer" style="background: #ef4444; color: white;">
                <i data-lucide="trash-2"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
      
      lucide.createIcons();
    }

    function openAddRoleModal() {
      document.getElementById('add-role-modal').classList.remove('hidden');
    }

    function closeAddRoleModal() {
      document.getElementById('add-role-modal').classList.add('hidden');
      document.getElementById('add-role-form').reset();
      editingRoleId = null;
      document.querySelector('#add-role-modal .modal-title').textContent = 'Ajouter un rôle';
      document.getElementById('submit-role-btn').textContent = 'Ajouter';
    }

    async function submitAddRole() {
      const form = document.getElementById('add-role-form');
      
      // Get all checked permissions
      const permissionCheckboxes = form.querySelectorAll('input[name="permissions"]:checked');
      const permissionsArray = Array.from(permissionCheckboxes).map(cb => cb.value);
      
      // Build permissions object
      const permissionsObj = {};
      permissionsArray.forEach(perm => {
        permissionsObj[perm] = true;
      });

      const roleData = {
        name: form.name.value,
        code: form.code.value,
        description: form.description.value,
        permissions: permissionsObj,
        status: form.status.value
      };

      if (!roleData.name || !roleData.code) {
        alert('Veuillez entrer le nom et le code du rôle');
        return;
      }

      try {
        if (editingRoleId) {
          // Update existing role
          await db.from('erp_roles').update(roleData).eq('id', editingRoleId);
          logActivity('Modification rôle', 'Paramètres', `Rôle ${roleData.name} modifié`);
        } else {
          // Insert new role
          await db.from('erp_roles').insert(roleData);
          logActivity('Création rôle', 'Paramètres', `Rôle ${roleData.name} créé`);
        }
        closeAddRoleModal();
        await loadRoles();
      } catch (error) {
        console.error('Add role error:', error);
        alert('Erreur lors de l\'ajout: ' + error.message);
      }
    }

    async function deleteRole(roleId) {
      if (!confirm('Êtes-vous sûr de vouloir supprimer ce rôle ?')) return;
      
      try {
        await db.from('erp_roles').update({ is_active: false }).eq('id', roleId);
        await loadRoles();
        logActivity('Suppression rôle', 'Paramètres', `Rôle supprimé`);
      } catch (error) {
        console.error('Delete role error:', error);
        alert('Erreur lors de la suppression');
      }
    }

    async function editRole(roleId) {
      const role = allRoles.find(r => r.id === roleId);
      if (!role) return;

      editingRoleId = roleId;
      document.querySelector('#add-role-modal .modal-title').textContent = 'Modifier le rôle';
      document.getElementById('submit-role-btn').textContent = 'Modifier';

      const form = document.getElementById('add-role-form');
      form.name.value = role.name || '';
      form.code.value = role.code || '';
      form.description.value = role.description || '';
      form.status.value = role.status || 'active';

      // Reset all checkboxes
      const checkboxes = form.querySelectorAll('input[name="permissions"]');
      checkboxes.forEach(cb => cb.checked = false);

      // Check permissions based on object or string
      if (role.permissions) {
        if (typeof role.permissions === 'object') {
          Object.keys(role.permissions).forEach(perm => {
            if (role.permissions[perm]) {
              const checkbox = form.querySelector(`input[name="permissions"][value="${perm}"]`);
              if (checkbox) checkbox.checked = true;
            }
          });
        } else {
          role.permissions.split(',').forEach(perm => {
            const checkbox = form.querySelector(`input[name="permissions"][value="${perm.trim()}"]`);
            if (checkbox) checkbox.checked = true;
          });
        }
      }

      openAddRoleModal();
    }

    async function logActivity(action, module, details) {
      try {
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (currentUser && currentUser.id) {
          await db.from('erp_activites').insert({
            user_id: currentUser.id,
            action: action,
            module: module,
            details: details
          });
        }
      } catch (error) {
        console.error('Log activity error:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadRoles();
      });
    });
  </script>
</body>
</html>
