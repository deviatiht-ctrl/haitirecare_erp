<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventaire - ERP Entreprise</title>
  <link rel="stylesheet" href="../../../../assets/css/variables.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/main.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/layout.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/components.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/dashboard.css?v=6">
  <style>
    /* Premium Modals styling */
    .modal-overlay {
      background-color: rgba(15, 23, 42, 0.6) !important;
      backdrop-filter: blur(8px) !important;
      transition: all 0.3s ease;
    }

    .modal {
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border-radius: 20px !important;
      overflow: hidden;
      transform: scale(1);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-header {
      background: linear-gradient(135deg, var(--clr-bg-soft) 0%, var(--clr-card) 100%);
      border-bottom: 1px solid var(--clr-border) !important;
      padding: var(--space-5) var(--space-6) !important;
    }

    .modal-title {
      font-weight: var(--font-weight-bold);
      color: var(--clr-text);
      font-size: var(--font-size-xl);
    }

    .modal-body {
      padding: var(--space-6) !important;
    }

    .modal-footer {
      background: var(--clr-bg-soft);
      border-top: 1px solid var(--clr-border) !important;
      padding: var(--space-4) var(--space-6) !important;
    }

    .form-input {
      border-radius: var(--radius-md) !important;
      padding: var(--space-3) var(--space-4) !important;
      border: 1.5px solid var(--clr-border) !important;
      transition: all 0.2s ease !important;
    }

    .form-input:focus {
      border-color: var(--clr-primary) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15) !important;
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="../../../../assets/js/supabase.js?v=7"></script>
  <script src="../../../../assets/js/auth.js?v=7"></script>
  <script src="../../../../assets/js/layout.js?v=7"></script>
  <script src="../../../../assets/js/excel.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../../../assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Inventaire</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" id="search-input" placeholder="Rechercher un article...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-secondary" onclick="exportInventory()">
              <i data-lucide="download"></i>
              Exporter
            </button>
            <button class="btn btn-primary" id="add-product-btn" onclick="openAddProductModal()">
              <i data-lucide="plus"></i>
              Ajouter un article
            </button>
          </div>
        </div>

        <div class="filters-bar">
          <input type="text" id="filter-category" class="form-input" placeholder="Catégorie">
          <input type="text" id="filter-supplier" class="form-input" placeholder="Fournisseur">
          <select id="filter-status" class="form-select form-input">
            <option value="">Tous les statuts</option>
            <option value="in-stock">En stock</option>
            <option value="low-stock">Stock faible</option>
            <option value="out-of-stock">Rupture</option>
          </select>
          <button class="btn btn-secondary" onclick="applyFilters()">Filtrer</button>
          <button class="btn btn-ghost" onclick="resetFilters()">Réinitialiser</button>
        </div>

        <div class="card">
          <div class="table-container">
            <table class="table" id="products-table">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Désignation</th>
                  <th>Catégorie</th>
                  <th>Qté en stock</th>
                  <th>Qté min</th>
                  <th>Prix unitaire</th>
                  <th>Valeur totale</th>
                  <th>Statut</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-table-body">
                <tr>
                  <td colspan="9" style="text-align: center; padding: var(--space-6);">
                    <div class="loading">
                      <div class="loading-spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Product Modal -->
  <div id="add-product-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="product-modal-title">Ajouter un article</h3>
        <button class="modal-close" onclick="closeAddProductModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="add-product-form" class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Code article</label>
            <input type="text" name="code" id="product-code" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Désignation</label>
            <input type="text" name="designation" id="product-designation" class="form-input" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Catégorie</label>
            <input type="text" name="categorie" id="product-categorie" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Fournisseur</label>
            <input type="text" name="fournisseur" id="product-fournisseur" class="form-input">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Quantité en stock</label>
            <input type="number" name="quantite" id="product-quantite" class="form-input" value="0" min="0" required>
          </div>
          <div class="form-group">
            <label class="form-label">Quantité minimum</label>
            <input type="number" name="quantite_min" id="product-quantite-min" class="form-input" value="0" min="0" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Prix d'achat</label>
            <input type="number" name="prix_achat" id="product-prix-achat" class="form-input" value="0" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label class="form-label">Prix de vente</label>
            <input type="number" name="prix_vente" id="product-prix-vente" class="form-input" value="0" min="0" step="0.01">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Unité</label>
            <select name="unite" id="product-unite" class="form-select form-input">
              <option value="pièce">Pièce</option>
              <option value="kg">Kg</option>
              <option value="litre">Litre</option>
              <option value="carton">Carton</option>
              <option value="ramette">Ramette</option>
              <option value="boîte">Boîte</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <input type="text" name="description" id="product-description" class="form-input">
          </div>
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddProductModal()">Annuler</button>
        <button class="btn btn-primary" id="product-modal-submit-btn" onclick="submitAddProduct()">Ajouter</button>
      </div>
    </div>
  </div>

  <!-- View Product Modal -->
  <div id="view-product-modal" class="modal-overlay hidden">
    <div class="modal" style="max-width: 550px;">
      <div class="modal-header">
        <h3 class="modal-title" id="view-product-title">Détails de l'article</h3>
        <button class="modal-close" onclick="closeViewProductModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" id="view-product-body" style="display: flex; flex-direction: column; gap: var(--space-4);">
        <!-- Loaded dynamically -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeViewProductModal()">Fermer</button>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];
    let editingProductId = null;
    const canEdit = hasPermission('stock');

    async function loadProducts() {
      try {
        const { data: products } = await db
          .from('erp_produits')
          .select('*')
          .eq('is_active', true)
          .order('code');
        
        allProducts = products || [];
        renderProductsTable(allProducts);
        
        if (!canEdit) {
          document.getElementById('add-product-btn').classList.add('hidden');
        }
      } catch (error) {
        console.error('Load products error:', error);
      }
    }

    function renderProductsTable(products) {
      const tbody = document.getElementById('products-table-body');
      
      if (!products.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Aucun article</td></tr>';
        return;
      }

      tbody.innerHTML = products.map(product => {
        const status = getStockStatus(product.quantite, product.quantite_min);
        const totalValue = product.quantite * product.prix_vente;
        
        return `
          <tr>
            <td>${product.code || '-'}</td>
            <td>${product.designation}</td>
            <td>${product.categorie || '-'}</td>
            <td>${product.quantite} <span class="text-muted text-xs">${product.unite || 'pièce(s)'}</span></td>
            <td>${product.quantite_min}</td>
            <td>${formatCurrency(product.prix_vente)}</td>
            <td>${formatCurrency(totalValue)}</td>
            <td><span class="badge badge-${status.class}">${status.label}</span></td>
            <td>
              <div class="table-actions">
                ${canEdit ? `
                  <button class="table-action-btn" onclick="editProduct('${product.id}')" title="Modifier">
                    <i data-lucide="edit"></i>
                  </button>
                  <button class="table-action-btn danger" onclick="deleteProduct('${product.id}')" title="Supprimer">
                    <i data-lucide="trash-2"></i>
                  </button>
                ` : `
                  <button class="table-action-btn" onclick="viewProduct('${product.id}')" title="Voir détails">
                    <i data-lucide="eye"></i>
                  </button>
                `}
                <button class="table-action-btn" onclick="viewProduct('${product.id}')" title="Fiche technique">
                  <i data-lucide="eye"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
      
      lucide.createIcons();
    }

    function getStockStatus(quantity, min) {
      if (quantity === 0) return { label: 'Rupture', class: 'danger' };
      if (quantity <= min) return { label: 'Stock faible', class: 'warning' };
      return { label: 'En stock', class: 'success' };
    }

    function openAddProductModal() {
      editingProductId = null;
      document.getElementById('product-modal-title').textContent = "Ajouter un article";
      document.getElementById('product-modal-submit-btn').textContent = "Ajouter";
      document.getElementById('add-product-modal').classList.remove('hidden');
    }

    function closeAddProductModal() {
      document.getElementById('add-product-modal').classList.add('hidden');
      document.getElementById('add-product-form').reset();
      editingProductId = null;
    }

    function editProduct(productId) {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;

      editingProductId = productId;
      
      document.getElementById('product-modal-title').textContent = "Modifier l'article";
      document.getElementById('product-modal-submit-btn').textContent = "Enregistrer";
      
      document.getElementById('product-code').value = product.code || '';
      document.getElementById('product-designation').value = product.designation || '';
      document.getElementById('product-categorie').value = product.categorie || '';
      document.getElementById('product-fournisseur').value = product.fournisseur || '';
      document.getElementById('product-quantite').value = product.quantite || 0;
      document.getElementById('product-quantite-min').value = product.quantite_min || 0;
      document.getElementById('product-prix-achat').value = product.prix_achat || 0;
      document.getElementById('product-prix-vente').value = product.prix_vente || 0;
      document.getElementById('product-unite').value = product.unite || 'pièce';
      document.getElementById('product-description').value = product.description || '';

      document.getElementById('add-product-modal').classList.remove('hidden');
    }

    function viewProduct(productId) {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;
      
      const title = document.getElementById('view-product-title');
      title.innerHTML = `<span style="color: var(--clr-primary); font-weight: var(--font-weight-bold);">${product.code || 'Article'}</span> - ${product.designation}`;
      
      const body = document.getElementById('view-product-body');
      const status = getStockStatus(product.quantite, product.quantite_min);
      const totalValue = product.quantite * product.prix_vente;
      
      body.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); background: var(--clr-bg-soft); padding: var(--space-4); border-radius: 12px; border: 1px solid var(--clr-border);">
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Code</span>
            <div style="font-weight: var(--font-weight-medium); margin-top: var(--space-1);">${product.code || '-'}</div>
          </div>
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Désignation</span>
            <div style="font-weight: var(--font-weight-medium); margin-top: var(--space-1);">${product.designation}</div>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4);">
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Catégorie</span>
            <div style="font-weight: var(--font-weight-medium); margin-top: var(--space-1);">${product.categorie || '-'}</div>
          </div>
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Fournisseur</span>
            <div style="font-weight: var(--font-weight-medium); margin-top: var(--space-1);">${product.fournisseur || '-'}</div>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); background: var(--clr-bg-soft); padding: var(--space-4); border-radius: 12px; border: 1px solid var(--clr-border);">
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">En Stock</span>
            <div style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--clr-text); margin-top: var(--space-1);">${product.quantite} <span style="font-size: var(--font-size-sm); font-weight: normal; color: var(--clr-text-muted);">${product.unite || 'pièce(s)'}</span></div>
          </div>
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Minimum</span>
            <div style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--clr-text); margin-top: var(--space-1);">${product.quantite_min}</div>
          </div>
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Statut</span>
            <div style="margin-top: var(--space-1);"><span class="badge badge-${status.class}">${status.label}</span></div>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3);">
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Prix Achat</span>
            <div style="font-weight: var(--font-weight-semibold); color: var(--clr-text); margin-top: var(--space-1);">${formatCurrency(product.prix_achat)}</div>
          </div>
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Prix Vente</span>
            <div style="font-weight: var(--font-weight-semibold); color: var(--clr-text); margin-top: var(--space-1);">${formatCurrency(product.prix_vente)}</div>
          </div>
          <div>
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Valeur Totale</span>
            <div style="font-weight: var(--font-weight-bold); color: var(--clr-success); margin-top: var(--space-1);">${formatCurrency(totalValue)}</div>
          </div>
        </div>
        ${product.description ? `
        <div style="border-top: 1px solid var(--clr-border); padding-top: var(--space-3);">
          <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Description</span>
          <div style="font-size: var(--font-size-sm); color: var(--clr-text-muted); margin-top: var(--space-1); line-height: 1.5;">${product.description}</div>
        </div>
        ` : ''}
      `;
      
      document.getElementById('view-product-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeViewProductModal() {
      document.getElementById('view-product-modal').classList.add('hidden');
    }

    async function submitAddProduct() {
      const form = document.getElementById('add-product-form');
      const formData = new FormData(form);
      
      const productData = {
        code: formData.get('code'),
        designation: formData.get('designation'),
        categorie: formData.get('categorie'),
        fournisseur: formData.get('fournisseur'),
        quantite: parseFloat(formData.get('quantite')) || 0,
        quantite_min: parseFloat(formData.get('quantite_min')) || 0,
        prix_achat: parseFloat(formData.get('prix_achat')) || 0,
        prix_vente: parseFloat(formData.get('prix_vente')) || 0,
        unite: formData.get('unite'),
        description: formData.get('description'),
        created_by: window.currentUser?.id
      };

      try {
        if (editingProductId) {
          // Edit Mode
          await db.from('erp_produits').update(productData).eq('id', editingProductId);
          logActivity('Modification produit', 'Stock', `Produit ${productData.code} modifié`);
        } else {
          // Add Mode
          await db.from('erp_produits').insert(productData);
          logActivity('Création produit', 'Stock', `Produit ${productData.code} créé`);
        }
        
        closeAddProductModal();
        await loadProducts();
      } catch (error) {
        console.error('Submit product error:', error);
        alert('Erreur lors de l\'enregistrement');
      }
    }

    async function deleteProduct(productId) {
      if (!confirm('Êtes-vous sûr de vouloir supprimer cet article ?')) return;
      
      try {
        await db.from('erp_produits').update({ is_active: false }).eq('id', productId);
        await loadProducts();
        logActivity('Suppression produit', 'Stock', `Produit ${productId} supprimé`);
      } catch (error) {
        console.error('Delete product error:', error);
        alert('Erreur lors de la suppression');
      }
    }

    function applyFilters() {
      const category = document.getElementById('filter-category').value.toLowerCase();
      const supplier = document.getElementById('filter-supplier').value.toLowerCase();
      const status = document.getElementById('filter-status').value;

      let filtered = allProducts;

      if (category) {
        filtered = filtered.filter(p => p.categorie?.toLowerCase().includes(category));
      }

      if (supplier) {
        filtered = filtered.filter(p => p.fournisseur?.toLowerCase().includes(supplier));
      }

      if (status) {
        filtered = filtered.filter(p => {
          const stockStatus = getStockStatus(p.quantite, p.quantite_min);
          if (status === 'in-stock') return stockStatus.label === 'En stock';
          if (status === 'low-stock') return stockStatus.label === 'Stock faible';
          if (status === 'out-of-stock') return stockStatus.label === 'Rupture';
          return true;
        });
      }

      renderProductsTable(filtered);
    }

    function resetFilters() {
      document.getElementById('filter-category').value = '';
      document.getElementById('filter-supplier').value = '';
      document.getElementById('filter-status').value = '';
      renderProductsTable(allProducts);
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allProducts.filter(p => 
        p.designation?.toLowerCase().includes(query) ||
        p.code?.toLowerCase().includes(query) ||
        p.categorie?.toLowerCase().includes(query)
      );
      renderProductsTable(filtered);
    });

    function exportInventory() {
      const data = allProducts.map(p => ({
        Code: p.code || '',
        Désignation: p.designation,
        Catégorie: p.categorie || '',
        'Qté en stock': p.quantite,
        'Qté min': p.quantite_min,
        'Prix achat': p.prix_achat,
        'Prix vente': p.prix_vente,
        Unité: p.unite,
        Fournisseur: p.fournisseur || '',
        'Valeur totale': p.quantite * p.prix_vente
      }));
      
      exportWithConfig(data, 'inventory');
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('fr-HT', { style: 'currency', currency: 'HTG' }).format(amount);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadProducts();
      });
    });
  </script>
</body>
