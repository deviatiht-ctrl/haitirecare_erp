<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs - ERP Entreprise</title>
  <link rel="stylesheet" href="../../../../assets/css/variables.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/main.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/layout.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/components.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/dashboard.css?v=6">
  <style>
    #users-table-body {
      display: table-row-group !important;
    }
    #users-table {
      display: table !important;
      width: 100% !important;
    }
    .table-container {
      display: block !important;
    }

    /* Premium Modals styling */
    .modal-overlay {
      background-color: rgba(15, 23, 42, 0.6) !important;
      backdrop-filter: blur(8px) !important;
      transition: all 0.3s ease;
    }

    .modal {
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border-radius: 20px !important;
      overflow: hidden;
      transform: scale(1);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-header {
      background: linear-gradient(135deg, var(--clr-bg-soft) 0%, var(--clr-card) 100%);
      border-bottom: 1px solid var(--clr-border) !important;
      padding: var(--space-5) var(--space-6) !important;
    }

    .modal-title {
      font-weight: var(--font-weight-bold);
      color: var(--clr-text);
      font-size: var(--font-size-xl);
    }

    .modal-body {
      padding: var(--space-6) !important;
    }

    .modal-footer {
      background: var(--clr-bg-soft);
      border-top: 1px solid var(--clr-border) !important;
      padding: var(--space-4) var(--space-6) !important;
    }

    .form-input {
      border-radius: var(--radius-md) !important;
      padding: var(--space-3) var(--space-4) !important;
      border: 1.5px solid var(--clr-border) !important;
      transition: all 0.2s ease !important;
    }

    .form-input:focus {
      border-color: var(--clr-primary) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15) !important;
    }

    .chat-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: var(--font-weight-bold);
      border-radius: 50%;
      text-transform: uppercase;
      box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.25);
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="../../../../assets/js/supabase.js?v=7"></script>
  <script src="../../../../assets/js/auth.js?v=7"></script>
  <script src="../../../../assets/js/layout.js?v=7"></script>
  <script src="../../../../assets/js/excel.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../../../assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Utilisateurs</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" id="search-input" placeholder="Rechercher un utilisateur...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-secondary" onclick="exportUsers()">
              <i data-lucide="download"></i>
              Exporter
            </button>
            <button class="btn btn-primary" onclick="openAddUserModal()">
              <i data-lucide="plus"></i>
              Ajouter un utilisateur
            </button>
          </div>
        </div>

        <div class="card">
          <div style="padding: 16px; background: var(--clr-bg-soft); margin-bottom: 16px; border-radius: 8px;">
            <strong>Total utilisateurs:</strong> <span id="user-count">0</span>
          </div>
          <div class="table-container">
            <table class="table" id="users-table">
              <thead>
                <tr>
                  <th>Nom</th>
                  <th>Email</th>
                  <th>Rôle</th>
                  <th>Poste</th>
                  <th>Dernier accès</th>
                  <th>Statut</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <tr>
                  <td colspan="7" style="text-align: center; padding: var(--space-6);">
                    <div class="loading">
                      <div class="loading-spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add User Modal -->
  <div id="add-user-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Ajouter un utilisateur</h3>
        <button class="modal-close" onclick="closeAddUserModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="add-user-form" class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Prénom</label>
            <input type="text" name="first_name" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Nom</label>
            <input type="text" name="last_name" class="form-input" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe temporaire</label>
          <input type="password" name="password" class="form-input" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Rôle</label>
            <select name="role" class="form-select form-input" id="role-select" required>
              <option value="">Chargement...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Poste</label>
            <select name="poste_id" class="form-select form-input" id="poste-select">
              <option value="">Sélectionner un poste</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Téléphone</label>
          <input type="tel" name="phone" class="form-input">
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddUserModal()">Annuler</button>
        <button class="btn btn-primary" onclick="submitAddUser()">Créer l'utilisateur</button>
      </div>
    </div>
  </div>

  <!-- View User Modal -->
  <div id="view-user-modal" class="modal-overlay hidden">
    <div class="modal" style="max-width: 550px;">
      <div class="modal-header">
        <h3 class="modal-title">Profil Utilisateur</h3>
        <button class="modal-close" onclick="closeViewUserModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" id="view-user-body" style="display: flex; flex-direction: column; gap: var(--space-4);">
        <!-- Dynamically populated -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeViewUserModal()">Fermer</button>
      </div>
    </div>
  </div>

  <script>
    let allUsers = [];
    let allPostes = [];
    let allRoles = [];

    function getAvatarColor(name) {
      const colors = [
        'linear-gradient(135deg, #6366f1 0%, #4f46e5 100%)', // indigo
        'linear-gradient(135deg, #ec4899 0%, #db2777 100%)', // pink
        'linear-gradient(135deg, #10b981 0%, #059669 100%)', // emerald
        'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)', // amber
        'linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)', // blue
        'linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%)', // violet
        'linear-gradient(135deg, #06b6d4 0%, #0891b2 100%)', // cyan
      ];
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % colors.length;
      return colors[index];
    }

    async function loadUsers() {
      try {
        const { data: users } = await db
          .from('erp_users')
          .select('*, erp_postes(*)')
          .order('created_at', { ascending: false });
        
        allUsers = users || [];
        console.log('Loaded users:', allUsers.length, allUsers);
        renderUsersTable(allUsers);
      } catch (error) {
        console.error('Load users error:', error);
      }
    }

    async function loadRoles() {
      try {
        const { data: roles } = await db.from('erp_roles').select('*').eq('is_active', true).eq('status', 'active').order('name');
        allRoles = roles || [];
        
        const select = document.getElementById('role-select');
        select.innerHTML = '<option value="">Sélectionner un rôle</option>';
        allRoles.forEach(r => {
          select.innerHTML += `<option value="${r.code}">${r.name}</option>`;
        });
        console.log('Loaded roles:', allRoles.length, allRoles);
      } catch (error) {
        console.error('Load roles error:', error);
        // Fallback to hardcoded roles if table doesn't exist
        const select = document.getElementById('role-select');
        select.innerHTML = '<option value="">Sélectionner un rôle</option>';
        const fallbackRoles = [
          { code: 'employe', name: 'Employé' },
          { code: 'secretaire', name: 'Secrétaire' },
          { code: 'comptable', name: 'Comptable' },
          { code: 'responsable_stock', name: 'Responsable Stock' },
          { code: 'commercial', name: 'Commercial' },
          { code: 'rh', name: 'RH' },
          { code: 'pdg', name: 'PDG' }
        ];
        fallbackRoles.forEach(r => {
          select.innerHTML += `<option value="${r.code}">${r.name}</option>`;
        });
      }
    }

    async function loadPostes() {
      try {
        const { data: postes } = await db.from('erp_postes').select('*').eq('is_active', true).order('name');
        allPostes = postes || [];
        
        const select = document.getElementById('poste-select');
        select.innerHTML = '<option value="">Sélectionner un poste</option>';
        allPostes.forEach(p => {
          select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
        });
      } catch (error) {
        console.error('Load postes error:', error);
      }
    }

    function renderUsersTable(users) {
      const tbody = document.getElementById('users-table-body');
      const userCount = document.getElementById('user-count');
      
      console.log('Rendering table with users:', users);
      userCount.textContent = users.length;
      
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Aucun utilisateur</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(user => `
        <tr>
          <td>${user.first_name} ${user.last_name}</td>
          <td>${user.email}</td>
          <td><span class="badge badge-secondary">${formatRole(user.role)}</span></td>
          <td>${user.erp_postes?.name || '-'}</td>
          <td>${user.last_login ? formatDate(user.last_login) : 'Jamais'}</td>
          <td>
            <span class="status-badge ${user.is_active ? 'active' : 'inactive'}">
              ${user.is_active ? 'Actif' : 'Inactif'}
            </span>
          </td>
          <td>
            <div class="table-actions">
              <button class="table-action-btn" onclick="viewUser('${user.id}')">
                <i data-lucide="eye"></i> Voir
              </button>
              <button class="table-action-btn danger" onclick="toggleUserStatus('${user.id}', ${user.is_active})">
                <i data-lucide="${user.is_active ? 'ban' : 'check'}"></i>
                ${user.is_active ? 'Désactiver' : 'Activer'}
              </button>
            </div>
          </td>
        </tr>
      `).join('');
      
      console.log('Table HTML set, tbody length:', tbody.children.length);
      
      lucide.createIcons();
    }

    function viewUser(userId) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;
      
      const name = `${user.first_name || ''} ${user.last_name || ''}`.trim();
      const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2);
      
      const body = document.getElementById('view-user-body');
      
      body.innerHTML = `
        <div style="display: flex; align-items: center; gap: var(--space-4); background: var(--clr-bg-soft); padding: var(--space-4); border-radius: 16px; border: 1px solid var(--clr-border);">
          <div class="chat-avatar" style="width: 54px; height: 54px; font-size: var(--font-size-lg); background: ${getAvatarColor(name)}">${initials}</div>
          <div>
            <h4 style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--clr-text); margin: 0 0 var(--space-1) 0;">${name}</h4>
            <span class="badge badge-primary">${formatRole(user.role)}</span>
          </div>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); margin-top: var(--space-2);">
          <div style="background: var(--clr-bg-soft); padding: var(--space-4); border-radius: 12px; border: 1px solid var(--clr-border);">
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Adresse Email</span>
            <div style="font-weight: var(--font-weight-medium); margin-top: var(--space-1); word-break: break-all;">${user.email}</div>
          </div>
          <div style="background: var(--clr-bg-soft); padding: var(--space-4); border-radius: 12px; border: 1px solid var(--clr-border);">
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Téléphone</span>
            <div style="font-weight: var(--font-weight-medium); margin-top: var(--space-1);">${user.phone || '-'}</div>
          </div>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4);">
          <div style="background: var(--clr-bg-soft); padding: var(--space-4); border-radius: 12px; border: 1px solid var(--clr-border);">
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Poste / Département</span>
            <div style="font-weight: var(--font-weight-medium); margin-top: var(--space-1);">${user.erp_postes?.name || '-'}</div>
          </div>
          <div style="background: var(--clr-bg-soft); padding: var(--space-4); border-radius: 12px; border: 1px solid var(--clr-border);">
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Statut du compte</span>
            <div style="margin-top: var(--space-2);">
              <span class="status-badge ${user.is_active ? 'active' : 'inactive'}">
                ${user.is_active ? 'Compte Actif' : 'Compte Inactif'}
              </span>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4);">
          <div style="background: var(--clr-bg-soft); padding: var(--space-4); border-radius: 12px; border: 1px solid var(--clr-border);">
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Créé le</span>
            <div style="font-weight: var(--font-weight-medium); margin-top: var(--space-1);">${formatDate(user.created_at)}</div>
          </div>
          <div style="background: var(--clr-bg-soft); padding: var(--space-4); border-radius: 12px; border: 1px solid var(--clr-border);">
            <span style="font-size: var(--font-size-xs); color: var(--clr-text-muted); text-transform: uppercase; font-weight: var(--font-weight-semibold);">Dernier Accès</span>
            <div style="font-weight: var(--font-weight-medium); margin-top: var(--space-1);">${user.last_login ? formatDate(user.last_login) : 'Jamais'}</div>
          </div>
        </div>
      `;
      
      document.getElementById('view-user-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeViewUserModal() {
      document.getElementById('view-user-modal').classList.add('hidden');
    }

    async function toggleUserStatus(userId, currentStatus) {
      try {
        await db.from('erp_users').update({ is_active: !currentStatus }).eq('id', userId);
        await loadUsers();
      } catch (error) {
        console.error('Toggle status error:', error);
        alert('Erreur lors de la modification du statut');
      }
    }

    function openAddUserModal() {
      document.getElementById('add-user-modal').classList.remove('hidden');
    }

    function closeAddUserModal() {
      document.getElementById('add-user-modal').classList.add('hidden');
      document.getElementById('add-user-form').reset();
    }

    async function submitAddUser() {
      const form = document.getElementById('add-user-form');
      const formData = new FormData(form);
      
      const email = formData.get('email');
      const role = formData.get('role');
      
      try {
        // First check if user already exists in erp_users table
        const { data: existingUser } = await db
          .from('erp_users')
          .select('*')
          .eq('email', email)
          .maybeSingle();
        
        if (existingUser) {
          alert('Cet utilisateur existe déjà dans le système');
          return;
        }

        let userId;
        
        // Only create Supabase auth for admin (pdg role)
        if (role === 'pdg') {
          const userData = {
            email: email,
            password: formData.get('password'),
            options: {
              data: {
                first_name: formData.get('first_name'),
                last_name: formData.get('last_name')
              }
            }
          };

          const { data: authData, error: authError } = await db.auth.signUp(userData);
          
          if (authError) {
            if (authError.message.includes('User already registered')) {
              try {
                const { data: { user } } = await db.auth.signInWithPassword({
                  email: email,
                  password: formData.get('password')
                });
                userId = user.id;
                await db.auth.signOut();
              } catch (signInError) {
                alert('Cet email existe déjà mais le mot de passe est incorrect.');
                return;
              }
            } else {
              throw authError;
            }
          } else {
            userId = authData.user.id;
          }
        } else {
          // For non-admin users, generate a UUID without Supabase auth
          userId = crypto.randomUUID();
        }

        const profileData = {
          id: userId,
          first_name: formData.get('first_name'),
          last_name: formData.get('last_name'),
          email: formData.get('email'),
          phone: formData.get('phone'),
          role: role,
          poste_id: formData.get('poste_id') || null,
          password: formData.get('password')
        };

        const { error: insertError } = await db.from('erp_users').insert(profileData);
        
        if (insertError) {
          console.error('Insert error:', insertError);
          alert('Erreur lors de l\'insertion: ' + insertError.message);
          return;
        }
        
        console.log('User inserted successfully:', profileData);
        alert('Utilisateur créé avec succès!');
        
        closeAddUserModal();
        await loadUsers();
        
        logActivity('Création utilisateur', 'Users', `Utilisateur ${profileData.email} créé`);
        
      } catch (error) {
        console.error('Add user error:', error);
        alert('Erreur lors de la création: ' + error.message);
      }
    }

    function exportUsers() {
      const data = allUsers.map(u => ({
        Nom: `${u.first_name} ${u.last_name}`,
        Email: u.email,
        Rôle: formatRole(u.role),
        Poste: u.erp_postes?.name || '',
        Téléphone: u.phone || '',
        Statut: u.is_active ? 'Actif' : 'Inactif',
        'Dernier accès': u.last_login ? formatDate(u.last_login) : 'Jamais'
      }));
      
      exportToExcel(data, 'utilisateurs', 'Utilisateurs');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allUsers.filter(u => 
        `${u.first_name} ${u.last_name}`.toLowerCase().includes(query) ||
        u.email.toLowerCase().includes(query)
      );
      renderUsersTable(filtered);
    });

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    function formatRole(role) {
      const roles = {
        'pdg': 'PDG',
        'secretaire': 'Secrétaire',
        'comptable': 'Comptable',
        'responsable_stock': 'Responsable Stock',
        'commercial': 'Commercial',
        'rh': 'RH',
        'employe': 'Employé'
      };
      return roles[role] || role;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadUsers();
        loadPostes();
        loadRoles();
      });
    });
  </script>
</body>
</html>
