<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord RH - ERP Entreprise</title>
  <link rel="stylesheet" href="../../assets/css/variables.css?v=6">
  <link rel="stylesheet" href="../../assets/css/main.css?v=6">
  <link rel="stylesheet" href="../../assets/css/layout.css?v=6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=6">
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=6">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/supabase.js?v=7"></script>
  <script src="../../assets/js/auth.js?v=7"></script>
  <script src="../../assets/js/layout.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Tableau de bord</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="kpi-grid">
          <div class="kpi-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="users"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Total employés</div>
              <div class="kpi-value" id="employees-count" style="color: white;">0</div>
            </div>
          </div>
          <div class="kpi-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="user-check"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Présents aujourd'hui</div>
              <div class="kpi-value" id="present-count" style="color: white;">0</div>
            </div>
          </div>
          <div class="kpi-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="calendar"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Congés en attente</div>
              <div class="kpi-value" id="pending-leave" style="color: white;">0</div>
            </div>
          </div>
          <div class="kpi-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="check-square"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Tâches RH</div>
              <div class="kpi-value" id="tasks-count" style="color: white;">0</div>
            </div>
          </div>
        </div>

        <div class="dashboard-grid-2">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Demandes de congé en attente</h3>
              <button class="btn btn-ghost btn-sm" onclick="window.location.href='/modules/rh/conges.html'">Voir tout</button>
            </div>
            <div id="leave-requests" class="loading">
              <div class="loading-spinner"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Présences du jour</h3>
              <button class="btn btn-ghost btn-sm" onclick="window.location.href='/modules/rh/presences.html'">Voir tout</button>
            </div>
            <div id="today-presences" class="loading">
              <div class="loading-spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function loadDashboardData() {
      try {
        const { count: employeesCount } = await db.from('erp_users').select('*', { count: 'exact', head: true }).eq('is_active', true);
        document.getElementById('employees-count').textContent = employeesCount || 0;

        const today = new Date().toISOString().split('T')[0];
        const { count: presentCount } = await db.from('erp_presences').select('*', { count: 'exact', head: true }).eq('date_presence', today).eq('statut', 'present');
        document.getElementById('present-count').textContent = presentCount || 0;

        const { count: pendingLeave } = await db.from('erp_conges').select('*', { count: 'exact', head: true }).eq('statut', 'en_attente');
        document.getElementById('pending-leave').textContent = pendingLeave || 0;

        const { count: tasksCount } = await db.from('erp_taches').select('*', { count: 'exact', head: true }).eq('assigne_a', window.currentUser?.id).eq('statut', 'en_cours');
        document.getElementById('tasks-count').textContent = tasksCount || 0;

        await loadLeaveRequests();
        await loadTodayPresences();
      } catch (error) {
        console.error('Dashboard load error:', error);
      }
    }

    async function loadLeaveRequests() {
      try {
        const { data: leaves } = await db.from('erp_conges').select('*, erp_users(first_name, last_name)').eq('statut', 'en_attente').order('created_at', { ascending: false }).limit(5);
        const container = document.getElementById('leave-requests');
        
        if (!leaves?.length) {
          container.innerHTML = '<div class="empty-state"><p class="text-muted">Aucune demande en attente</p></div>';
          return;
        }

        container.innerHTML = leaves.map(l => `
          <div style="padding: var(--space-3); border-bottom: 1px solid var(--clr-border);">
            <div style="font-weight: var(--font-weight-medium);">${l.erp_users?.first_name} ${l.erp_users?.last_name}</div>
            <div style="font-size: var(--font-size-sm); color: var(--clr-text-muted);">${l.type_conge} • ${formatDate(l.date_debut)} - ${formatDate(l.date_fin)}</div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Leave requests load error:', error);
      }
    }

    async function loadTodayPresences() {
      try {
        const today = new Date().toISOString().split('T')[0];
        const { data: presences } = await db.from('erp_presences').select('*, erp_users(first_name, last_name)').eq('date_presence', today).order('heure_arrivee', { ascending: false }).limit(5);
        const container = document.getElementById('today-presences');
        
        if (!presences?.length) {
          container.innerHTML = '<div class="empty-state"><p class="text-muted">Aucune présence enregistrée</p></div>';
          return;
        }

        container.innerHTML = presences.map(p => `
          <div style="padding: var(--space-3); border-bottom: 1px solid var(--clr-border);">
            <div style="font-weight: var(--font-weight-medium);">${p.erp_users?.first_name} ${p.erp_users?.last_name}</div>
            <div style="font-size: var(--font-size-sm); color: var(--clr-text-muted);">${p.heure_arrivee || 'Non pointé'} • ${p.statut}</div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Presences load error:', error);
      }
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadDashboardData();
      });
    });
  </script>
</body>
</html>
