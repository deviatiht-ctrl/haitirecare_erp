<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord Responsable Stock - ERP Entreprise</title>
  <link rel="stylesheet" href="../../assets/css/variables.css?v=6">
  <link rel="stylesheet" href="../../assets/css/main.css?v=6">
  <link rel="stylesheet" href="../../assets/css/layout.css?v=6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=6">
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=6">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/supabase.js?v=7"></script>
  <script src="../../assets/js/auth.js?v=7"></script>
  <script src="../../assets/js/layout.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Tableau de bord</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="kpi-grid">
          <div class="kpi-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="package"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Total articles</div>
              <div class="kpi-value" id="total-items" style="color: white;">0</div>
            </div>
          </div>
          <div class="kpi-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="check-circle"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">En stock</div>
              <div class="kpi-value" id="in-stock" style="color: white;">0</div>
            </div>
          </div>
          <div class="kpi-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="alert-triangle"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Stock faible</div>
              <div class="kpi-value" id="low-stock" style="color: white;">0</div>
            </div>
          </div>
          <div class="kpi-card" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="x-circle"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Rupture de stock</div>
              <div class="kpi-value" id="out-of-stock" style="color: white;">0</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Alertes de stock</h3>
            <button class="btn btn-primary" onclick="window.location.href='/modules/stock/alertes.html'">
              <i data-lucide="eye"></i>
              Voir toutes
            </button>
          </div>
          <div id="alerts-list" class="loading">
            <div class="loading-spinner"></div>
          </div>
        </div>

        <div class="dashboard-grid-2" style="margin-top: var(--space-6);">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Dernières entrées</h3>
              <button class="btn btn-ghost btn-sm" onclick="window.location.href='/modules/stock/entrees.html'">Voir tout</button>
            </div>
            <div id="entries-list" class="loading">
              <div class="loading-spinner"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Dernières sorties</h3>
              <button class="btn btn-ghost btn-sm" onclick="window.location.href='/modules/stock/sorties.html'">Voir tout</button>
            </div>
            <div id="exits-list" class="loading">
              <div class="loading-spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function loadDashboardData() {
      try {
        const { data: products } = await db.from('erp_produits').select('*').eq('is_active', true);
        
        const totalItems = products?.length || 0;
        const inStock = products?.filter(p => p.quantite > p.quantite_min).length || 0;
        const lowStock = products?.filter(p => p.quantite > 0 && p.quantite <= p.quantite_min).length || 0;
        const outOfStock = products?.filter(p => p.quantite === 0).length || 0;

        document.getElementById('total-items').textContent = totalItems;
        document.getElementById('in-stock').textContent = inStock;
        document.getElementById('low-stock').textContent = lowStock;
        document.getElementById('out-of-stock').textContent = outOfStock;

        await loadAlerts(products || []);
        await loadRecentEntries();
        await loadRecentExits();
      } catch (error) {
        console.error('Dashboard load error:', error);
      }
    }

    async function loadAlerts(products) {
      const alerts = products.filter(p => p.quantite <= p.quantite_min);
      const container = document.getElementById('alerts-list');
      
      if (!alerts.length) {
        container.innerHTML = '<div class="empty-state"><p class="text-muted">Aucune alerte</p></div>';
        return;
      }

      container.innerHTML = alerts.map(p => `
        <div style="padding: var(--space-3); border-bottom: 1px solid var(--clr-border); display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-weight: var(--font-weight-medium);">${p.designation}</div>
            <div style="font-size: var(--font-size-sm); color: var(--clr-text-muted);">Stock: ${p.quantite} / Min: ${p.quantite_min}</div>
          </div>
          <span class="badge ${p.quantite === 0 ? 'badge-danger' : 'badge-warning'}">${p.quantite === 0 ? 'Rupture' : 'Faible'}</span>
        </div>
      `).join('');
    }

    async function loadRecentEntries() {
      try {
        const { data: entries } = await db.from('erp_stock_movements').select('*, erp_produits(designation)').eq('type', 'entree').order('created_at', { ascending: false }).limit(5);
        const container = document.getElementById('entries-list');
        
        if (!entries?.length) {
          container.innerHTML = '<div class="empty-state"><p class="text-muted">Aucune entrée</p></div>';
          return;
        }

        container.innerHTML = entries.map(e => `
          <div style="padding: var(--space-3); border-bottom: 1px solid var(--clr-border);">
            <div style="font-weight: var(--font-weight-medium);">${e.erp_produits?.designation || 'N/A'}</div>
            <div style="font-size: var(--font-size-sm); color: var(--clr-text-muted);">+${e.quantite} • ${formatDate(e.created_at)}</div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Entries load error:', error);
      }
    }

    async function loadRecentExits() {
      try {
        const { data: exits } = await db.from('erp_stock_movements').select('*, erp_produits(designation)').eq('type', 'sortie').order('created_at', { ascending: false }).limit(5);
        const container = document.getElementById('exits-list');
        
        if (!exits?.length) {
          container.innerHTML = '<div class="empty-state"><p class="text-muted">Aucune sortie</p></div>';
          return;
        }

        container.innerHTML = exits.map(e => `
          <div style="padding: var(--space-3); border-bottom: 1px solid var(--clr-border);">
            <div style="font-weight: var(--font-weight-medium);">${e.erp_produits?.designation || 'N/A'}</div>
            <div style="font-size: var(--font-size-sm); color: var(--clr-text-muted);">-${e.quantite} • ${formatDate(e.created_at)}</div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Exits load error:', error);
      }
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadDashboardData();
      });
    });
  </script>
</body>
</html>
