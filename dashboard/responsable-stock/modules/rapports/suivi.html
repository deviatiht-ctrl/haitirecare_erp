<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi d'Activité - ERP Entreprise</title>
  <link rel="stylesheet" href="../../../../assets/css/variables.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/main.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/layout.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/components.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/dashboard.css?v=6">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../../assets/js/supabase.js?v=7"></script>
  <script src="../../../../assets/js/auth.js?v=7"></script>
  <script src="../../../../assets/js/layout.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../../../assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Suivi d'Activité</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="filters-bar">
          <input type="date" id="date-start" class="form-input">
          <input type="date" id="date-end" class="form-input">
          <select id="filter-module" class="form-select form-input">
            <option value="">Tous les modules</option>
            <option value="Users">Users</option>
            <option value="Stock">Stock</option>
            <option value="Finances">Finances</option>
            <option value="Clients">Clients</option>
            <option value="RH">RH</option>
            <option value="Tâches">Tâches</option>
          </select>
          <button class="btn btn-secondary" onclick="loadActivities()">Filtrer</button>
          <button class="btn btn-ghost" onclick="setThisWeek()">Cette semaine</button>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Journal d'activité</h3>
          </div>
          <div id="activities-list" class="activity-feed">
            <div class="loading">
              <div class="loading-spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    function setThisWeek() {
      const now = new Date();
      const firstDay = new Date(now);
      firstDay.setDate(now.getDate() - now.getDay());
      const lastDay = new Date(firstDay);
      lastDay.setDate(firstDay.getDate() + 6);
      
      document.getElementById('date-start').valueAsDate = firstDay;
      document.getElementById('date-end').valueAsDate = lastDay;
      loadActivities();
    }

    async function loadActivities() {
      const dateStart = document.getElementById('date-start').value;
      const dateEnd = document.getElementById('date-end').value;
      const module = document.getElementById('filter-module').value;

      try {
        let query = db.from('erp_activites').select('*, erp_users(first_name, last_name)').order('created_at', { ascending: false }).limit(50);
        
        if (dateStart) {
          query = query.gte('created_at', dateStart);
        }
        if (dateEnd) {
          query = query.lte('created_at', dateEnd + 'T23:59:59');
        }
        if (module) {
          query = query.eq('module', module);
        }

        const { data: activities } = await query;
        renderActivities(activities || []);
      } catch (error) {
        console.error('Load activities error:', error);
      }
    }

    function renderActivities(activities) {
      const container = document.getElementById('activities-list');
      
      if (!activities.length) {
        container.innerHTML = '<div class="empty-state"><p class="text-muted">Aucune activité trouvée</p></div>';
        return;
      }

      container.innerHTML = activities.map(activity => `
        <div class="activity-item">
          <div class="activity-icon">
            <i data-lucide="activity"></i>
          </div>
          <div class="activity-content">
            <div class="activity-text">
              <strong>${activity.erp_users?.first_name} ${activity.erp_users?.last_name || ''}</strong> ${activity.action}
            </div>
            <div class="activity-meta">
              <span class="activity-time">${formatTimeAgo(activity.created_at)}</span>
              <span class="activity-module">${activity.module || 'Système'}</span>
            </div>
          </div>
        </div>
      `).join('');
      
      lucide.createIcons();
    }

    function formatTimeAgo(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const seconds = Math.floor((now - date) / 1000);
      
      if (seconds < 60) return 'À l\'instant';
      if (seconds < 3600) return `Il y a ${Math.floor(seconds / 60)} min`;
      if (seconds < 86400) return `Il y a ${Math.floor(seconds / 3600)} h`;
      if (seconds < 604800) return `Il y a ${Math.floor(seconds / 86400)} j`;
      
      return formatDate(dateStr);
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        setThisWeek();
      });
    });
  </script>
</body>
</html>
