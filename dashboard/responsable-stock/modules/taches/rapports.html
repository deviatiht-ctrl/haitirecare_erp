<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapports Tâches - ERP Entreprise</title>
  <link rel="stylesheet" href="../../../../assets/css/variables.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/main.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/layout.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/components.css?v=6">
  <link rel="stylesheet" href="../../../../assets/css/dashboard.css?v=6">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="../../../../assets/js/supabase.js?v=7"></script>
  <script src="../../../../assets/js/auth.js?v=7"></script>
  <script src="../../../../assets/js/layout.js?v=7"></script>
  <script src="../../../../assets/js/excel.js?v=7"></script>
  <script src="../../../../assets/js/charts.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../../../assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Rapports Tâches</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-secondary" onclick="exportReport()">
              <i data-lucide="download"></i>
              Exporter
            </button>
          </div>
        </div>

        <div class="filters-bar">
          <input type="date" id="date-start" class="form-input">
          <input type="date" id="date-end" class="form-input">
          <button class="btn btn-secondary" onclick="generateReport()">Générer</button>
          <button class="btn btn-ghost" onclick="setThisMonth()">Ce mois</button>
        </div>

        <div class="kpi-grid" style="margin-bottom: var(--space-6);">
          <div class="kpi-card">
            <div class="kpi-icon primary">
              <i data-lucide="check-square"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label">Total tâches</div>
              <div class="kpi-value" id="total-tasks">0</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon success">
              <i data-lucide="check-circle"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label">Terminées</div>
              <div class="kpi-value" id="completed-tasks">0</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon warning">
              <i data-lucide="clock"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label">En cours</div>
              <div class="kpi-value" id="in-progress-tasks">0</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon danger">
              <i data-lucide="alert-triangle"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label">En retard</div>
              <div class="kpi-value" id="overdue-tasks">0</div>
            </div>
          </div>
        </div>

        <div class="chart-container" style="margin-bottom: var(--space-6);">
          <div class="chart-header">
            <h3 class="chart-title">Répartition par statut</h3>
          </div>
          <div class="chart-canvas">
            <canvas id="status-chart"></canvas>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Tâches par employé</h3>
          </div>
          <div class="table-container">
            <table class="table" id="tasks-by-user">
              <thead>
                <tr>
                  <th>Employé</th>
                  <th>Assignées</th>
                  <th>Terminées</th>
                  <th>En cours</th>
                  <th>Taux de complétion</th>
                </tr>
              </thead>
              <tbody id="tasks-by-user-body">
                <tr><td colspan="5" style="text-align: center;">-</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let reportTasks = [];

    function setThisMonth() {
      const now = new Date();
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      
      document.getElementById('date-start').valueAsDate = firstDay;
      document.getElementById('date-end').valueAsDate = lastDay;
      generateReport();
    }

    async function generateReport() {
      const dateStart = document.getElementById('date-start').value;
      const dateEnd = document.getElementById('date-end').value;

      if (!dateStart || !dateEnd) {
        alert('Veuillez sélectionner une période');
        return;
      }

      try {
        const { data: tasks } = await db
          .from('erp_taches')
          .select('*, assigne:erp_users(first_name, last_name)')
          .gte('created_at', dateStart)
          .lte('created_at', dateEnd);
        
        reportTasks = tasks || [];
        updateKPIs(reportTasks);
        updateChart(reportTasks);
        updateTasksByUser(reportTasks);
        
      } catch (error) {
        console.error('Generate report error:', error);
      }
    }

    function updateKPIs(tasks) {
      const total = tasks.length;
      const completed = tasks.filter(t => t.statut === 'termine').length;
      const inProgress = tasks.filter(t => t.statut === 'en_cours').length;
      const overdue = tasks.filter(t => t.echeance && new Date(t.echeance) < new Date() && t.statut !== 'termine').length;

      document.getElementById('total-tasks').textContent = total;
      document.getElementById('completed-tasks').textContent = completed;
      document.getElementById('in-progress-tasks').textContent = inProgress;
      document.getElementById('overdue-tasks').textContent = overdue;
    }

    function updateChart(tasks) {
      const chartData = prepareTaskStatusChart(tasks);
      
      const existingChart = Chart.getChart('status-chart');
      if (existingChart) {
        existingChart.destroy();
      }
      
      createDoughnutChart('status-chart', chartData);
    }

    function updateTasksByUser(tasks) {
      const userStats = {};
      
      tasks.forEach(task => {
        if (!task.assigne) return;
        const key = task.assigne.id;
        if (!userStats[key]) {
          userStats[key] = { name: `${task.assigne.first_name} ${task.assigne.last_name}`, total: 0, completed: 0, inProgress: 0 };
        }
        userStats[key].total++;
        if (task.statut === 'termine') userStats[key].completed++;
        if (task.statut === 'en_cours') userStats[key].inProgress++;
      });

      const tbody = document.getElementById('tasks-by-user-body');
      tbody.innerHTML = Object.values(userStats).map(stat => {
        const completionRate = stat.total > 0 ? ((stat.completed / stat.total) * 100).toFixed(1) : 0;
        
        return `
          <tr>
            <td>${stat.name}</td>
            <td>${stat.total}</td>
            <td>${stat.completed}</td>
            <td>${stat.inProgress}</td>
            <td>
              <div style="display: flex; align-items: center; gap: var(--space-2);">
                <div class="progress" style="width: 80px;">
                  <div class="progress-bar ${completionRate >= 80 ? 'success' : completionRate >= 50 ? 'warning' : 'danger'}" style="width: ${completionRate}%"></div>
                </div>
                <span>${completionRate}%</span>
              </div>
            </td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="5" style="text-align: center;">Aucune donnée</td></tr>';
    }

    function exportReport() {
      const data = reportTasks.map(t => ({
        Titre: t.titre,
        Assigné: t.assigne ? `${t.assigne.first_name} ${t.assigne.last_name}` : '',
        Statut: t.statut.replace('_', ' '),
        Priorité: t.priorite,
        Échéance: t.echeance ? formatDate(t.echeance) : '',
        Module: t.module_tag || '',
        'Créé le': formatDate(t.created_at)
      }));
      
      exportToExcel(data, 'rapport-taches', 'Rapport Tâches');
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        setThisMonth();
      });
    });
  </script>
</body>
</html>
