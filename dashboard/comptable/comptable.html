<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord Comptable - ERP Entreprise</title>
  <link rel="stylesheet" href="../../assets/css/variables.css?v=6">
  <link rel="stylesheet" href="../../assets/css/main.css?v=6">
  <link rel="stylesheet" href="../../assets/css/layout.css?v=6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=6">
  <link rel="stylesheet" href="../../assets/css/dashboard.css?v=6">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../../assets/js/supabase.js?v=7"></script>
  <script src="../../assets/js/auth.js?v=7"></script>
  <script src="../../assets/js/layout.js?v=7"></script>
  <script src="/assets/js/charts.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Tableau de bord</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="kpi-grid">
          <div class="kpi-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="trending-up"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Revenus du mois</div>
              <div class="kpi-value" id="revenues-month" style="color: white;">0 HTG</div>
            </div>
          </div>
          <div class="kpi-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="trending-down"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Dépenses du mois</div>
              <div class="kpi-value" id="expenses-month" style="color: white;">0 HTG</div>
            </div>
          </div>
          <div class="kpi-card" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="wallet"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Solde caisse</div>
              <div class="kpi-value" id="cash-balance" style="color: white;">0 HTG</div>
            </div>
          </div>
          <div class="kpi-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); border: none;">
            <div class="kpi-icon" style="background: rgba(255,255,255,0.2); color: white;">
              <i data-lucide="dollar-sign"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label" style="color: rgba(255,255,255,0.9);">Résultat net</div>
              <div class="kpi-value" id="net-result" style="color: white;">0 HTG</div>
            </div>
          </div>
        </div>

        <div class="chart-container" style="margin-bottom: var(--space-6);">
          <div class="chart-header">
            <h3 class="chart-title">Revenus vs Dépenses (6 derniers mois)</h3>
          </div>
          <div class="chart-canvas">
            <canvas id="finance-chart"></canvas>
          </div>
        </div>

        <div class="dashboard-grid-2">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Derniers revenus</h3>
              <button class="btn btn-ghost btn-sm" onclick="window.location.href='/modules/finances/revenus.html'">Voir tout</button>
            </div>
            <div id="revenues-list" class="loading">
              <div class="loading-spinner"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Dernières dépenses</h3>
              <button class="btn btn-ghost btn-sm" onclick="window.location.href='/modules/finances/depenses.html'">Voir tout</button>
            </div>
            <div id="expenses-list" class="loading">
              <div class="loading-spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function loadDashboardData() {
      try {
        const now = new Date();
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);

        const { data: revenues } = await db.from('erp_revenus').select('montant').gte('date_transaction', firstDay.toISOString());
        const totalRevenues = revenues?.reduce((sum, r) => sum + parseFloat(r.montant), 0) || 0;
        document.getElementById('revenues-month').textContent = formatCurrency(totalRevenues);

        const { data: expenses } = await db.from('erp_depenses').select('montant').gte('date_transaction', firstDay.toISOString());
        const totalExpenses = expenses?.reduce((sum, e) => sum + parseFloat(e.montant), 0) || 0;
        document.getElementById('expenses-month').textContent = formatCurrency(totalExpenses);

        const netResult = totalRevenues - totalExpenses;
        document.getElementById('net-result').textContent = formatCurrency(netResult);

        const today = new Date().toISOString().split('T')[0];
        const { data: caisse } = await db.from('erp_caisse').select('*').eq('date_caisse', today).single();
        document.getElementById('cash-balance').textContent = formatCurrency(caisse?.solde_fermeture || caisse?.solde_ouverture || 0);

        await loadChart();
        await loadRecentRevenues();
        await loadRecentExpenses();
      } catch (error) {
        console.error('Dashboard load error:', error);
      }
    }

    async function loadChart() {
      try {
        const { data: allRevenues } = await db.from('erp_revenus').select('date_transaction, montant').order('date_transaction', { ascending: true });
        const { data: allExpenses } = await db.from('erp_depenses').select('date_transaction, montant').order('date_transaction', { ascending: true });
        const chartData = prepareRevenueExpenseChart(allRevenues || [], allExpenses || [], 6);
        createBarChart('finance-chart', chartData);
      } catch (error) {
        console.error('Chart load error:', error);
      }
    }

    async function loadRecentRevenues() {
      try {
        const { data: revenues } = await db.from('erp_revenus').select('*').order('date_transaction', { ascending: false }).limit(5);
        const container = document.getElementById('revenues-list');
        
        if (!revenues?.length) {
          container.innerHTML = '<div class="empty-state"><p class="text-muted">Aucun revenu</p></div>';
          return;
        }

        container.innerHTML = revenues.map(r => `
          <div style="padding: var(--space-3); border-bottom: 1px solid var(--clr-border);">
            <div style="font-weight: var(--font-weight-medium);">${r.description}</div>
            <div style="font-size: var(--font-size-sm); color: var(--clr-text-muted);">${formatDate(r.date_transaction)} • ${formatCurrency(r.montant)}</div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Revenues load error:', error);
      }
    }

    async function loadRecentExpenses() {
      try {
        const { data: expenses } = await db.from('erp_depenses').select('*').order('date_transaction', { ascending: false }).limit(5);
        const container = document.getElementById('expenses-list');
        
        if (!expenses?.length) {
          container.innerHTML = '<div class="empty-state"><p class="text-muted">Aucune dépense</p></div>';
          return;
        }

        container.innerHTML = expenses.map(e => `
          <div style="padding: var(--space-3); border-bottom: 1px solid var(--clr-border);">
            <div style="font-weight: var(--font-weight-medium);">${e.description}</div>
            <div style="font-size: var(--font-size-sm); color: var(--clr-text-muted);">${formatDate(e.date_transaction)} • ${formatCurrency(e.montant)}</div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Expenses load error:', error);
      }
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('fr-HT', { style: 'currency', currency: 'HTG' }).format(amount);
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadDashboardData();
      });
    });
  </script>
</body>
</html>
