<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Compte — HAITI REH-CARE</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/site.js"></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <!-- ============ AUTH (non connecté) ============ -->
  <section class="section" id="auth-section">
    <div class="container" style="max-width: 480px;">
      <div class="form-card">
        <div class="tabs">
          <button id="tab-login" class="active" onclick="switchTab('login')">Connexion</button>
          <button id="tab-register" onclick="switchTab('register')">Créer un compte</button>
        </div>

        <div id="auth-alert"></div>

        <!-- Login -->
        <form id="login-form">
          <div class="field" style="margin-bottom:16px;">
            <label>Email</label>
            <input type="email" name="email" required>
          </div>
          <div class="field" style="margin-bottom:20px;">
            <label>Mot de passe</label>
            <input type="password" name="password" required>
          </div>
          <button type="submit" class="btn btn-teal" style="width:100%; justify-content:center;">
            <i data-lucide="log-in"></i> Se connecter
          </button>
          <p class="hint" style="text-align:center; margin-top:14px; font-size:13px; color:var(--rc-text-3);">
            Le compte se crée aussi automatiquement lors d'un rendez-vous en ligne.
          </p>
        </form>

        <!-- Register -->
        <form id="register-form" class="hidden">
          <div class="form-grid" style="margin-bottom:16px;">
            <div class="field"><label>Prénom <span class="req">*</span></label><input type="text" name="prenom" required></div>
            <div class="field"><label>Nom <span class="req">*</span></label><input type="text" name="nom" required></div>
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label>Téléphone</label><input type="tel" name="phone" placeholder="+509 …">
          </div>
          <div class="field" style="margin-bottom:16px;">
            <label>Email <span class="req">*</span></label><input type="email" name="email" required>
          </div>
          <div class="form-grid" style="margin-bottom:20px;">
            <div class="field"><label>Mot de passe <span class="req">*</span></label><input type="password" name="password" minlength="6" required></div>
            <div class="field"><label>Confirmer <span class="req">*</span></label><input type="password" name="password2" minlength="6" required></div>
          </div>
          <button type="submit" class="btn btn-teal" style="width:100%; justify-content:center;">
            <i data-lucide="user-plus"></i> Créer mon compte patient
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ ESPACE PATIENT (connecté) ============ -->
  <section class="section hidden" id="portal-section">
    <div class="container" style="max-width: 960px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:32px;">
        <div>
          <h1 style="font-size:26px; font-weight:800;">Bonjour, <span id="patient-name"></span></h1>
          <p style="color:var(--rc-text-2); font-size:14px;" id="patient-email"></p>
        </div>
        <div style="display:flex; gap:10px;">
          <a href="rendez-vous.html" class="btn btn-teal"><i data-lucide="calendar-plus"></i> Nouveau rendez-vous</a>
          <button class="btn btn-ghost" onclick="signOut()"><i data-lucide="log-out"></i> Déconnexion</button>
        </div>
      </div>

      <div class="tabs" style="max-width:560px;">
        <button id="tab-rdv" class="active" onclick="switchPortalTab('rdv')">Mes rendez-vous</button>
        <button id="tab-msg" onclick="switchPortalTab('msg')">Messages</button>
        <button id="tab-annonce" onclick="switchPortalTab('annonce')">Publier une annonce</button>
      </div>

      <!-- RDV -->
      <div id="pane-rdv">
        <div id="rdv-list"><div class="spinner"></div></div>
      </div>

      <!-- Messages -->
      <div id="pane-msg" class="hidden">
        <div class="grid msg-layout" id="msg-layout">
          <div>
            <h3 style="font-size:15px; margin-bottom:12px;">Équipe soignante</h3>
            <div id="staff-list"><div class="spinner"></div></div>
          </div>
          <div class="chat-box" id="chat-box">
            <div class="chat-messages" id="chat-messages">
              <div class="empty-state" style="margin:auto;"><i data-lucide="message-circle"></i><p>Choisissez un membre de l'équipe pour discuter.</p></div>
            </div>
            <div class="chat-input">
              <input type="text" id="chat-text" placeholder="Votre message…" disabled>
              <button class="btn btn-teal" id="chat-send" disabled><i data-lucide="send"></i></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Annonce -->
      <div id="pane-annonce" class="hidden">
        <div class="form-card">
          <h3 style="font-size:18px; margin-bottom:6px;">Publier une annonce</h3>
          <p style="color:var(--rc-text-2); font-size:13.5px; margin-bottom:20px;">
            Votre annonce sera visible après validation par le centre.
          </p>
          <div id="annonce-alert"></div>
          <form id="annonce-form">
            <div class="form-grid">
              <div class="field">
                <label>Type <span class="req">*</span></label>
                <select name="type" required>
                  <option value="vente">Je vends</option>
                  <option value="achat">Je recherche</option>
                  <option value="don">Je donne</option>
                </select>
              </div>
              <div class="field">
                <label>État</label>
                <select name="etat">
                  <option value="neuf">Neuf</option>
                  <option value="tres_bon">Très bon état</option>
                  <option value="bon" selected>Bon état</option>
                  <option value="usage">Usagé</option>
                </select>
              </div>
              <div class="field full">
                <label>Titre <span class="req">*</span></label>
                <input type="text" name="titre" required placeholder="Ex: Fauteuil roulant pliable">
              </div>
              <div class="field full">
                <label>Description</label>
                <textarea name="description" placeholder="Détails, dimensions, usage…"></textarea>
              </div>
              <div class="field">
                <label>Prix (HTG)</label>
                <input type="number" name="prix" min="0" step="1" value="0">
              </div>
              <div class="field">
                <label>Téléphone de contact <span class="req">*</span></label>
                <input type="tel" name="contact_phone" required>
              </div>
            </div>
            <button type="submit" class="btn btn-teal" style="margin-top:20px;"><i data-lucide="send"></i> Soumettre l'annonce</button>
          </form>
          <div id="my-annonces" style="margin-top:28px;"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script>
    let _session = null, _patient = null, _staff = [], _chatWith = null;

    function authAlert(type, msg) {
      document.getElementById('auth-alert').innerHTML =
        `<div class="alert alert-${type}"><i data-lucide="${type === 'error' ? 'alert-circle' : 'info'}"></i><span>${Site.esc(msg)}</span></div>`;
      lucide.createIcons();
    }
    function switchTab(t) {
      document.getElementById('tab-login').classList.toggle('active', t === 'login');
      document.getElementById('tab-register').classList.toggle('active', t === 'register');
      document.getElementById('login-form').classList.toggle('hidden', t !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', t !== 'register');
    }
    function switchPortalTab(t) {
      ['rdv', 'msg', 'annonce'].forEach(k => {
        document.getElementById('tab-' + k).classList.toggle('active', k === t);
        document.getElementById('pane-' + k).classList.toggle('hidden', k !== t);
      });
      if (t === 'annonce') loadMyAnnonces();
    }

    // ---------- Auth ----------
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const { error } = await db.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
      if (error) { authAlert('error', error.message); return; }
      location.reload();
    });

    document.getElementById('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      if (f.get('password') !== f.get('password2')) { authAlert('error', 'Les mots de passe ne correspondent pas.'); return; }
      const { data, error } = await db.auth.signUp({
        email: f.get('email'), password: f.get('password'),
        options: { data: { first_name: f.get('prenom'), last_name: f.get('nom') } }
      });
      if (error) { authAlert('error', error.message); return; }
      if (data.user?.identities?.length === 0) { authAlert('error', 'Un compte existe déjà avec cet email.'); return; }
      // Créer / lier le dossier patient
      await db.rpc('erp_portal_register_patient', {
        p_nom: f.get('nom'), p_prenom: f.get('prenom'), p_phone: f.get('phone')
      });
      location.reload();
    });

    async function signOut() {
      await db.auth.signOut();
      location.reload();
    }

    // ---------- Portail ----------
    async function loadPortal() {
      const uid = _session.user.id;
      document.getElementById('patient-email').textContent = _session.user.email;

      // Dossier patient
      const { data: patients } = await db.from('erp_patients')
        .select('*').eq('user_id', uid).limit(1);
      _patient = patients?.[0] || null;
      if (!_patient) {
        // Essaye par email (dossier créé par le staff)
        const { data: byEmail } = await db.from('erp_patients')
          .select('*').eq('email', _session.user.email).limit(1);
        _patient = byEmail?.[0] || null;
      }
      document.getElementById('patient-name').textContent = _patient
        ? `${_patient.prenom || ''} ${_patient.nom}`.trim()
        : _session.user.email;

      loadRdv();
      loadStaff();
    }

    async function loadRdv() {
      const { data } = await db.from('erp_rdv')
        .select('*, erp_services(name)')
        .order('date_rdv', { ascending: false })
        .limit(30);
      // RLS filtre déjà (rdv du patient); on affiche
      const el = document.getElementById('rdv-list');
      if (!data?.length) {
        el.innerHTML = '<div class="empty-state"><i data-lucide="calendar-x"></i><p>Aucun rendez-vous pour le moment.</p><a href="rendez-vous.html" class="btn btn-teal" style="margin-top:12px;">Prendre rendez-vous</a></div>';
        lucide.createIcons();
        return;
      }
      el.innerHTML = data.map(r => `
        <div class="list-item">
          <div class="icon-box teal"><i data-lucide="calendar-check"></i></div>
          <div class="grow">
            <strong>${Site.esc(r.erp_services?.name || 'Consultation')}</strong>
            <span>${Site.date(r.date_rdv)}${r.heure_rdv ? ' à ' + String(r.heure_rdv).slice(0,5) : ''}${r.motif ? ' — ' + Site.esc(r.motif) : ''}</span>
          </div>
          ${Site.rdvBadge(r.statut)}
        </div>`).join('');
      lucide.createIcons();
    }

    async function loadStaff() {
      const { data } = await db.rpc('erp_portal_staff');
      _staff = data || [];
      const el = document.getElementById('staff-list');
      el.innerHTML = _staff.length ? _staff.map(s => `
        <button class="list-item" style="width:100%; text-align:left; cursor:pointer; border:1px solid var(--rc-border); background:#fff; font-family:var(--rc-font);"
                onclick="openChat('${s.id}', '${Site.esc(s.nom).replace(/'/g, "\\'")}', '${Site.esc(s.poste).replace(/'/g, "\\'")}')">
          <div class="icon-box blue" style="width:36px; height:36px;"><i data-lucide="stethoscope" style="width:18px;height:18px;"></i></div>
          <div class="grow"><strong style="font-size:13.5px;">${Site.esc(s.nom)}</strong><span style="font-size:12px;">${Site.esc(s.poste)}</span></div>
        </button>`).join('') :
        '<p style="color:var(--rc-text-3); font-size:13px;">Aucun membre disponible.</p>';
      lucide.createIcons();
    }

    async function openChat(staffId, nom, poste) {
      _chatWith = staffId;
      const input = document.getElementById('chat-text');
      const btn = document.getElementById('chat-send');
      input.disabled = false; btn.disabled = false;
      input.placeholder = `Message à ${nom}…`;
      await loadChat();
    }

    async function loadChat() {
      if (!_chatWith) return;
      const uid = _session.user.id;
      const { data } = await db.from('erp_messages')
        .select('*')
        .or(`and(sender_id.eq.${uid},recipient_id.eq.${_chatWith}),and(sender_id.eq.${_chatWith},recipient_id.eq.${uid})`)
        .order('created_at');
      const box = document.getElementById('chat-messages');
      box.innerHTML = (data || []).map(m => `
        <div class="chat-msg ${m.sender_id === uid ? 'mine' : 'theirs'}">
          ${Site.esc(m.content)}
          <small>${Site.date(m.created_at, true)}</small>
        </div>`).join('') ||
        '<div class="empty-state" style="margin:auto;"><i data-lucide="message-circle"></i><p>Démarrez la conversation.</p></div>';
      box.scrollTop = box.scrollHeight;
      lucide.createIcons();
      // Marquer lu
      await db.from('erp_messages').update({ is_read: true })
        .eq('sender_id', _chatWith).eq('recipient_id', uid).eq('is_read', false);
    }

    document.getElementById('chat-send').addEventListener('click', sendChat);
    document.getElementById('chat-text').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

    async function sendChat() {
      const input = document.getElementById('chat-text');
      const text = input.value.trim();
      if (!text || !_chatWith) return;
      input.value = '';
      const { error } = await db.from('erp_messages').insert({
        sender_id: _session.user.id,
        recipient_id: _chatWith,
        content: text
      });
      if (error) { input.value = text; alert('Erreur: ' + error.message); return; }
      loadChat();
    }

    // ---------- Annonces ----------
    document.getElementById('annonce-form').addEventListener('submit', async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const ent = await Site.loadEnterprise();
      const { error } = await db.from('erp_annonces').insert({
        enterprise_id: ent.id || null,
        titre: f.get('titre'),
        description: f.get('description'),
        type: f.get('type'),
        etat: f.get('etat'),
        prix: parseFloat(f.get('prix')) || 0,
        contact_nom: document.getElementById('patient-name').textContent,
        contact_phone: f.get('contact_phone'),
        contact_email: _session.user.email,
        created_by: _session.user.id,
        statut: 'en_attente'
      });
      const el = document.getElementById('annonce-alert');
      if (error) {
        el.innerHTML = `<div class="alert alert-error"><i data-lucide="alert-circle"></i><span>${Site.esc(error.message)}</span></div>`;
      } else {
        el.innerHTML = '<div class="alert alert-success"><i data-lucide="check-circle-2"></i><span>Annonce soumise — elle sera publiée après validation.</span></div>';
        e.target.reset();
        loadMyAnnonces();
      }
      lucide.createIcons();
    });

    async function loadMyAnnonces() {
      const { data } = await db.from('erp_annonces')
        .select('*').eq('created_by', _session.user.id)
        .order('created_at', { ascending: false });
      const el = document.getElementById('my-annonces');
      if (!data?.length) { el.innerHTML = ''; return; }
      const badge = { en_attente: 'badge-amber', publie: 'badge-green', rejete: 'badge-red', vendu: 'badge-gray' };
      el.innerHTML = '<h4 style="margin-bottom:12px;">Mes annonces</h4>' + data.map(a => `
        <div class="list-item">
          <div class="grow"><strong>${Site.esc(a.titre)}</strong><span>${Site.money(a.prix, a.devise)} — ${Site.date(a.created_at)}</span></div>
          <span class="badge ${badge[a.statut] || 'badge-gray'}">${a.statut.replace('_', ' ')}</span>
          ${a.statut === 'publie' ? `<button class="btn btn-ghost btn-sm" onclick="markVendu('${a.id}')"><i data-lucide="check"></i> Vendu</button>` : ''}
        </div>`).join('');
      lucide.createIcons();
    }

    async function markVendu(id) {
      await db.from('erp_annonces').update({ statut: 'vendu' }).eq('id', id);
      loadMyAnnonces();
    }

    // ---------- Init ----------
    document.addEventListener('DOMContentLoaded', async () => {
      await initSite('compte');
      _session = await Site.session();
      if (_session) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('portal-section').classList.remove('hidden');
        if (location.hash === '#annonce') switchPortalTab('annonce');
        await loadPortal();
      } else if (new URLSearchParams(location.search).get('next')) {
        authAlert('info', 'Connectez-vous ou créez un compte pour continuer.');
      }
    });
  </script>
</body>
</html>
