<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue - HAITI REH-CARE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0d9488;
      --teal-dark: #0f766e;
      --teal-soft: #ccfbf1;
      --navy: #0f172a;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --amber: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Topbar ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--teal), #0ea5e9);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(13, 148, 136, 0.35);
    }

    .brand-name {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-tag {
      font-size: 11px;
      color: var(--muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--navy);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--teal-dark);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .btn-outline:hover {
      border-color: var(--teal);
      color: var(--teal-dark);
    }

    .btn svg {
      width: 15px;
      height: 15px;
    }

    /* ===== Hero ===== */
    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(600px 300px at 85% 10%, rgba(13, 148, 136, 0.12), transparent 60%),
        radial-gradient(500px 260px at 10% 90%, rgba(14, 165, 233, 0.10), transparent 60%),
        var(--card);
      border-bottom: 1px solid var(--line);
    }

    .hero-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 24px 56px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--teal-soft);
      color: var(--teal-dark);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .hero-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      animation: pulse-dot 2s ease infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .hero h1 {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -1.5px;
      line-height: 1.1;
      max-width: 640px;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--teal);
    }

    .hero-desc {
      margin-top: 16px;
      font-size: 16px;
      color: var(--muted);
      max-width: 560px;
    }

    .hero-meta {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 13px;
      color: var(--ink);
      font-weight: 500;
      text-decoration: none;
    }

    .hero-chip svg {
      width: 15px;
      height: 15px;
      color: var(--teal);
    }

    .hero-actions {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ===== Sections ===== */
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 8px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .section-title {
      font-family: 'Manrope', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .section-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .cat-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--teal-dark);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 28px 0 16px;
    }

    .cat-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .cat-label svg {
      width: 17px;
      height: 17px;
    }

    /* ===== Services ===== */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .service-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }

    .service-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
      border-color: rgba(13, 148, 136, 0.4);
    }

    .service-name {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .service-desc {
      font-size: 13px;
      color: var(--muted);
      flex: 1;
      margin-bottom: 18px;
    }

    .service-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .service-price {
      font-family: 'Manrope', sans-serif;
      font-size: 19px;
      font-weight: 800;
      color: var(--navy);
    }

    .service-price small {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .service-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .service-duration {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .service-duration svg {
      width: 13px;
      height: 13px;
    }

    .service-book {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      background: var(--teal-soft);
      color: var(--teal-dark);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .service-book:hover {
      background: var(--teal);
      color: #fff;
    }

    .service-book svg {
      width: 14px;
      height: 14px;
    }

    /* ===== Produits ===== */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      transition: all 0.2s ease;
    }

    .product-card:hover {
      border-color: rgba(13, 148, 136, 0.4);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    .product-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #f0fdfa;
      color: var(--teal);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .product-icon svg {
      width: 20px;
      height: 20px;
    }

    .product-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .product-desc {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      min-height: 32px;
    }

    .product-price {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--teal-dark);
    }

    /* ===== Contact / Footer ===== */
    .cta-band {
      margin: 56px 24px 0;
      max-width: 1052px;
      margin-left: auto;
      margin-right: auto;
      background: linear-gradient(135deg, var(--navy), #134e4a);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .cta-band::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(13, 148, 136, 0.25);
      top: -150px;
      right: -80px;
    }

    .cta-band h2 {
      font-family: 'Manrope', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      position: relative;
    }

    .cta-band p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 26px;
      position: relative;
    }

    .cta-band .btn-light {
      background: #fff;
      color: var(--navy);
      position: relative;
    }

    .cta-band .btn-light:hover {
      background: var(--teal-soft);
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 48px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
    }

    /* ===== States ===== */
    .state {
      max-width: 480px;
      margin: 80px auto;
      padding: 40px;
      text-align: center;
    }

    .state-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: var(--teal-soft);
      color: var(--teal);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 25%, var(--teal) 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      animation: spin 0.8s cubic-bezier(0.5, 0.15, 0.5, 0.85) infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      .hero-inner { padding: 44px 20px 40px; }
      .cta-band { padding: 36px 22px; margin-left: 16px; margin-right: 16px; }
      .topbar-inner { padding: 12px 16px; }
      .btn-topbar-text { display: none; }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js?v=7"></script>
</head>
<body>
  <!-- Barre superieure -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" id="brand-mark">--</div>
        <div>
          <div class="brand-name" id="brand-name">Catalogue</div>
          <div class="brand-tag" id="brand-tag">Soins &amp; Services</div>
        </div>
      </div>
      <a class="btn btn-primary" id="top-cta" href="#">
        <i data-lucide="calendar-plus"></i>
        <span class="btn-topbar-text">Prendre rendez-vous</span>
      </a>
    </div>
  </header>

  <main id="catalog-root">
    <!-- Chargement -->
    <div class="state" id="state-loading">
      <div class="loader-ring"></div>
      <div style="font-size: 14px; color: var(--muted); font-weight: 500;">Chargement du catalogue...</div>
    </div>
  </main>

  <script>
    const ICONS = {
      'Physiothérapie': 'activity',
      'Massothérapie': 'hand-heart',
      'Orthèses & Prothèses': 'bone',
      'Forfaits': 'package',
      default: 'sparkles'
    };

    const params = new URLSearchParams(location.search);
    const enterpriseId = params.get('e');

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function money(v, devise) {
      const n = Number(v || 0);
      return `${n.toLocaleString('fr-FR')} <small>${esc(devise || 'HTG')}</small>`;
    }

    function renderError(title, msg) {
      document.getElementById('catalog-root').innerHTML = `
        <div class="state">
          <div class="state-icon"><i data-lucide="alert-circle" style="width:26px;height:26px;"></i></div>
          <h2 style="font-family:'Manrope';color:var(--navy);margin-bottom:8px;">${esc(title)}</h2>
          <p style="color:var(--muted);font-size:14px;">${esc(msg)}</p>
        </div>`;
      lucide.createIcons();
    }

    async function init() {
      if (!enterpriseId) {
        renderError('Lien incomplet', 'Ce lien de catalogue est incomplet. Demandez au centre de vous envoyer le lien complet.');
        return;
      }

      const { data, error } = await db.rpc('erp_public_catalog', { p_enterprise_id: enterpriseId });

      if (error || !data) {
        console.error(error);
        renderError('Catalogue indisponible', 'Impossible de charger le catalogue pour le moment. Réessayez plus tard.');
        return;
      }

      render(data);
    }

    function render(catalog) {
      const c = catalog.company || {};
      const services = catalog.services || [];
      const products = catalog.products || [];

      document.title = `${c.name || 'Catalogue'} — Soins & Services`;
      document.getElementById('brand-mark').textContent = (c.name || 'C').slice(0, 2).toUpperCase();
      document.getElementById('brand-name').textContent = c.name || 'Catalogue';
      document.getElementById('brand-tag').textContent = c.type || 'Soins & Services';
      document.getElementById('top-cta').href = `rendez-vous.html?e=${enterpriseId}`;

      // Grouper les services par catégorie
      const groups = {};
      services.forEach(s => {
        const cat = s.category || 'Services';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(s);
      });

      const servicesHtml = Object.entries(groups).map(([cat, items]) => `
        <div class="cat-label"><i data-lucide="${ICONS[cat] || ICONS.default}"></i>${esc(cat)}</div>
        <div class="service-grid">
          ${items.map(s => `
            <div class="service-card">
              <div class="service-name">${esc(s.name)}</div>
              <div class="service-desc">${esc(s.description || '')}</div>
              <div class="service-foot">
                <div>
                  <div class="service-price">${money(s.price, s.devise)}</div>
                  ${s.duration_min ? `<div class="service-duration"><i data-lucide="clock"></i>${s.duration_min} min</div>` : ''}
                </div>
                <a class="service-book" href="rendez-vous.html?e=${enterpriseId}&s=${s.id}">
                  Réserver <i data-lucide="arrow-right"></i>
                </a>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');

      const productsHtml = products.length ? `
        <div class="section">
          <div class="section-head">
            <div>
              <h2 class="section-title">Matériel orthopédique</h2>
              <div class="section-sub">Équipements disponibles à la vente au centre</div>
            </div>
          </div>
          <div class="product-grid">
            ${products.map(p => `
              <div class="product-card">
                <div class="product-icon"><i data-lucide="package"></i></div>
                <div class="product-name">${esc(p.designation)}</div>
                <div class="product-desc">${esc(p.description || '')}</div>
                <div class="product-price">${money(p.prix_vente, 'HTG')}</div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : '';

      const chips = [
        c.phone ? `<a class="hero-chip" href="tel:${esc(c.phone)}"><i data-lucide="phone"></i>${esc(c.phone)}</a>` : '',
        c.email ? `<a class="hero-chip" href="mailto:${esc(c.email)}"><i data-lucide="mail"></i>${esc(c.email)}</a>` : '',
        c.city ? `<span class="hero-chip"><i data-lucide="map-pin"></i>${esc(c.address ? c.address + ', ' : '')}${esc(c.city)}</span>` : ''
      ].join('');

      document.getElementById('catalog-root').innerHTML = `
        <section class="hero">
          <div class="hero-inner">
            <span class="hero-badge"><span class="dot"></span>${esc(c.type || 'Centre de soins')}</span>
            <h1>${esc(c.name || 'Catalogue')} — <em>vos soins, notre expertise</em></h1>
            <p class="hero-desc">${esc(c.description || 'Découvrez nos services et réservez votre séance en ligne.')}</p>
            <div class="hero-meta">${chips}</div>
            <div class="hero-actions">
              <a class="btn btn-primary" href="rendez-vous.html?e=${enterpriseId}">
                <i data-lucide="calendar-plus"></i> Prendre rendez-vous
              </a>
              <button class="btn btn-outline" onclick="shareCatalog()">
                <i data-lucide="share-2"></i> Partager le catalogue
              </button>
            </div>
          </div>
        </section>

        <div class="section">
          <div class="section-head">
            <div>
              <h2 class="section-title">Nos services</h2>
              <div class="section-sub">${services.length} prestation${services.length > 1 ? 's' : ''} disponible${services.length > 1 ? 's' : ''} — réservation en ligne</div>
            </div>
          </div>
          ${servicesHtml || '<p style="color:var(--muted);font-size:14px;">Aucun service publié pour le moment.</p>'}
        </div>

        ${productsHtml}

        <div class="cta-band">
          <h2>Besoin d'un rendez-vous ?</h2>
          <p>Réservez en ligne en moins d'une minute — notre équipe vous confirme rapidement.</p>
          <a class="btn btn-light" href="rendez-vous.html?e=${enterpriseId}">
            <i data-lucide="calendar-plus"></i> Réserver maintenant
          </a>
        </div>

        <footer class="footer">
          <div class="footer-inner">
            <span>© ${new Date().getFullYear()} ${esc(c.name || '')} — Tous droits réservés.</span>
            <span>${esc(c.city || '')}${c.country ? ', ' + esc(c.country) : ''}</span>
          </div>
        </footer>
      `;

      lucide.createIcons();
    }

    function shareCatalog() {
      const url = location.href;
      if (navigator.share) {
        navigator.share({ title: document.title, url }).catch(() => {});
      } else {
        navigator.clipboard?.writeText(url).then(() => {
          alert('Lien du catalogue copié !');
        });
      }
    }

    init();
  </script>
</body>
</html>
