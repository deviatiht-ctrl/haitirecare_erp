<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapport Global - ERP Entreprise</title>
  <link rel="stylesheet" href="/assets/css/variables.css?v=6">
  <link rel="stylesheet" href="/assets/css/main.css?v=6">
  <link rel="stylesheet" href="/assets/css/layout.css?v=6">
  <link rel="stylesheet" href="/assets/css/components.css?v=6">
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=6">
  <link rel="stylesheet" href="/assets/css/print.css?v=6">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/assets/js/supabase.js?v=7"></script>
  <script src="/assets/js/auth.js?v=7"></script>
  <script src="/assets/js/layout.js?v=7"></script>
  <script src="/assets/js/charts.js?v=7"></script>
  <script src="/assets/js/excel.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Rapport Global</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-secondary" onclick="window.print()">
              <i data-lucide="printer"></i>
              Imprimer
            </button>
            <button class="btn btn-primary" onclick="exportGlobalReport()">
              <i data-lucide="download"></i>
              Exporter Excel
            </button>
          </div>
        </div>

        <div class="filters-bar">
          <input type="date" id="date-start" class="form-input">
          <input type="date" id="date-end" class="form-input">
          <button class="btn btn-secondary" onclick="generateReport()">Générer</button>
          <button class="btn btn-ghost" onclick="setThisMonth()">Ce mois</button>
          <button class="btn btn-ghost" onclick="setThisQuarter()">Ce trimestre</button>
          <button class="btn btn-ghost" onclick="setThisYear()">Cette année</button>
        </div>

        <div class="print-header hidden" id="print-header">
          <h1>Rapport Global</h1>
          <p id="print-period"></p>
        </div>

        <div class="kpi-grid" style="margin-bottom: var(--space-6);">
          <div class="kpi-card">
            <div class="kpi-icon success">
              <i data-lucide="trending-up"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label">Revenus totaux</div>
              <div class="kpi-value" id="total-revenues">0 HTG</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon danger">
              <i data-lucide="trending-down"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label">Dépenses totales</div>
              <div class="kpi-value" id="total-expenses">0 HTG</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon primary">
              <i data-lucide="dollar-sign"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label">Bénéfice net</div>
              <div class="kpi-value" id="net-profit">0 HTG</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon warning">
              <i data-lucide="package"></i>
            </div>
            <div class="kpi-content">
              <div class="kpi-label">Stock total</div>
              <div class="kpi-value" id="stock-value">0 HTG</div>
            </div>
          </div>
        </div>

        <div class="dashboard-grid-2" style="margin-bottom: var(--space-6);">
          <div class="chart-container">
            <div class="chart-header">
              <h3 class="chart-title">Revenus vs Dépenses</h3>
            </div>
            <div class="chart-canvas">
              <canvas id="finance-chart"></canvas>
            </div>
          </div>
          <div class="chart-container">
            <div class="chart-header">
              <h3 class="chart-title">Répartition des tâches</h3>
            </div>
            <div class="chart-canvas">
              <canvas id="tasks-chart"></canvas>
            </div>
          </div>
        </div>

        <div class="dashboard-grid-3">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Clients</h3>
            </div>
            <div class="kpi-value text-center" id="clients-count" style="font-size: var(--font-size-2xl);">0</div>
            <div class="text-center text-muted">Total clients actifs</div>
          </div>
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Employés</h3>
            </div>
            <div class="kpi-value text-center" id="employees-count" style="font-size: var(--font-size-2xl);">0</div>
            <div class="text-center text-muted">Total employés actifs</div>
          </div>
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Articles en stock</h3>
            </div>
            <div class="kpi-value text-center" id="products-count" style="font-size: var(--font-size-2xl);">0</div>
            <div class="text-center text-muted">Total articles</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let reportData = {};

    function setThisMonth() {
      const now = new Date();
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      
      document.getElementById('date-start').valueAsDate = firstDay;
      document.getElementById('date-end').valueAsDate = lastDay;
      generateReport();
    }

    function setThisQuarter() {
      const now = new Date();
      const quarter = Math.floor(now.getMonth() / 3);
      const firstDay = new Date(now.getFullYear(), quarter * 3, 1);
      const lastDay = new Date(now.getFullYear(), quarter * 3 + 3, 0);
      
      document.getElementById('date-start').valueAsDate = firstDay;
      document.getElementById('date-end').valueAsDate = lastDay;
      generateReport();
    }

    function setThisYear() {
      const now = new Date();
      const firstDay = new Date(now.getFullYear(), 0, 1);
      const lastDay = new Date(now.getFullYear(), 11, 31);
      
      document.getElementById('date-start').valueAsDate = firstDay;
      document.getElementById('date-end').valueAsDate = lastDay;
      generateReport();
    }

    async function generateReport() {
      const dateStart = document.getElementById('date-start').value;
      const dateEnd = document.getElementById('date-end').value;

      if (!dateStart || !dateEnd) {
        alert('Veuillez sélectionner une période');
        return;
      }

      try {
        const [revenuesResult, expensesResult, clientsResult, employeesResult, productsResult, tasksResult] = await Promise.all([
          db.from('erp_revenus').select('*').gte('date_transaction', dateStart).lte('date_transaction', dateEnd),
          db.from('erp_depenses').select('*').gte('date_transaction', dateStart).lte('date_transaction', dateEnd),
          db.from('erp_clients').select('*', { count: 'exact', head: true }).eq('is_active', true),
          db.from('erp_users').select('*', { count: 'exact', head: true }).eq('is_active', true),
          db.from('erp_produits').select('*').eq('is_active', true),
          db.from('erp_taches').select('*')
        ]);

        reportData = {
          revenues: revenuesResult.data || [],
          expenses: expensesResult.data || [],
          clients: clientsResult.count || 0,
          employees: employeesResult.count || 0,
          products: productsResult.data || [],
          tasks: tasksResult.data || []
        };

        updateKPIs();
        updateCharts();
        
        document.getElementById('print-period').textContent = `Du ${formatDate(dateStart)} au ${formatDate(dateEnd)}`;
        
      } catch (error) {
        console.error('Generate report error:', error);
      }
    }

    function updateKPIs() {
      const totalRevenues = reportData.revenues.reduce((sum, r) => sum + parseFloat(r.montant), 0);
      const totalExpenses = reportData.expenses.reduce((sum, e) => sum + parseFloat(e.montant), 0);
      const netProfit = totalRevenues - totalExpenses;
      const stockValue = reportData.products.reduce((sum, p) => sum + (p.quantite * p.prix_vente), 0);

      document.getElementById('total-revenues').textContent = formatCurrency(totalRevenues);
      document.getElementById('total-expenses').textContent = formatCurrency(totalExpenses);
      document.getElementById('net-profit').textContent = formatCurrency(netProfit);
      document.getElementById('stock-value').textContent = formatCurrency(stockValue);
      document.getElementById('clients-count').textContent = reportData.clients;
      document.getElementById('employees-count').textContent = reportData.employees;
      document.getElementById('products-count').textContent = reportData.products.length;
    }

    function updateCharts() {
      const financeChart = prepareRevenueExpenseChart(reportData.revenues, reportData.expenses, 6);
      const tasksChart = prepareTaskStatusChart(reportData.tasks);
      
      const existingFinanceChart = Chart.getChart('finance-chart');
      if (existingFinanceChart) existingFinanceChart.destroy();
      createBarChart('finance-chart', financeChart);
      
      const existingTasksChart = Chart.getChart('tasks-chart');
      if (existingTasksChart) existingTasksChart.destroy();
      createDoughnutChart('tasks-chart', tasksChart);
    }

    function exportGlobalReport() {
      const totalRevenues = reportData.revenues.reduce((sum, r) => sum + parseFloat(r.montant), 0);
      const totalExpenses = reportData.expenses.reduce((sum, e) => sum + parseFloat(e.montant), 0);
      
      const data = [
        { Section: 'Résumé Global', '': '' },
        { 'Revenus totaux': totalRevenues, '': '' },
        { 'Dépenses totales': totalExpenses, '': '' },
        { 'Bénéfice net': totalRevenues - totalExpenses, '': '' },
        { 'Clients actifs': reportData.clients, '': '' },
        { 'Employés actifs': reportData.employees, '': '' },
        { 'Articles en stock': reportData.products.length, '': '' },
        { Section: 'Revenus', '': '' },
        ...reportData.revenues.map(r => ({ Date: r.date_transaction, Description: r.description, Montant: r.montant })),
        { Section: 'Dépenses', '': '' },
        ...reportData.expenses.map(e => ({ Date: e.date_transaction, Description: e.description, Montant: e.montant }))
      ];
      
      exportToExcel(data, 'rapport-global', 'Rapport Global');
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('fr-HT', { style: 'currency', currency: 'HTG' }).format(amount);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        setThisMonth();
      });
    });
  </script>
</body>
</html>
