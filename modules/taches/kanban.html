<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban - HAITI REH-CARE ERP</title>
  <link rel="stylesheet" href="/assets/css/variables.css?v=8">
  <link rel="stylesheet" href="/assets/css/main.css?v=8">
  <link rel="stylesheet" href="/assets/css/layout.css?v=8">
  <link rel="stylesheet" href="/assets/css/components.css?v=8">
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=8">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js?v=9"></script>
  <script src="/assets/js/auth.js?v=9"></script>
  <script src="/assets/js/layout.js?v=9"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/img/logohaitirecare.png" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Kanban</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-secondary" onclick="window.location.href='/modules/taches/liste.html'">
              <i data-lucide="list"></i>
              Vue liste
            </button>
            <button class="btn btn-primary" onclick="openAddTaskModal()">
              <i data-lucide="plus"></i>
              Nouvelle tâche
            </button>
          </div>
        </div>

        <div class="kanban-board" id="kanban-board">
          <div class="kanban-column">
            <div class="kanban-column-header">
              <span class="kanban-column-title">À faire</span>
              <span class="kanban-column-count" id="count-a-faire">0</span>
            </div>
            <div class="kanban-tasks" id="column-a-faire">
              <div class="loading">
                <div class="loading-spinner"></div>
              </div>
            </div>
          </div>
          <div class="kanban-column">
            <div class="kanban-column-header">
              <span class="kanban-column-title">En cours</span>
              <span class="kanban-column-count" id="count-en_cours">0</span>
            </div>
            <div class="kanban-tasks" id="column-en_cours"></div>
          </div>
          <div class="kanban-column">
            <div class="kanban-column-header">
              <span class="kanban-column-title">En révision</span>
              <span class="kanban-column-count" id="count-en_revision">0</span>
            </div>
            <div class="kanban-tasks" id="column-en_revision"></div>
          </div>
          <div class="kanban-column">
            <div class="kanban-column-header">
              <span class="kanban-column-title">Terminé</span>
              <span class="kanban-column-count" id="count-termine">0</span>
            </div>
            <div class="kanban-tasks" id="column-termine"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Task Modal -->
  <div id="add-task-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Nouvelle tâche</h3>
        <button class="modal-close" onclick="closeAddTaskModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="add-task-form" class="modal-body">
        <div class="form-group">
          <label class="form-label">Titre</label>
          <input type="text" name="titre" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-input form-textarea"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Assigné à</label>
            <select name="assigne_a" class="form-select form-input" id="assignee-select">
              <option value="">Sélectionner</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Priorité</label>
            <select name="priorite" class="form-select form-input">
              <option value="moyenne">Moyenne</option>
              <option value="haute">Haute</option>
              <option value="basse">Basse</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Échéance</label>
            <input type="date" name="echeance" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Module</label>
            <input type="text" name="module_tag" class="form-input">
          </div>
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddTaskModal()">Annuler</button>
        <button class="btn btn-primary" onclick="submitAddTask()">Créer</button>
      </div>
    </div>
  </div>

  <script>
    let allTasks = [];
    let allUsers = [];

    async function loadUsers() {
      try {
        const { data: users } = await db.from('erp_users').select('*').eq('is_active', true).order('last_name');
        allUsers = users || [];
        
        const select = document.getElementById('assignee-select');
        select.innerHTML = '<option value="">Sélectionner</option>';
        allUsers.forEach(u => {
          select.innerHTML += `<option value="${u.id}">${u.first_name} ${u.last_name}</option>`;
        });
      } catch (error) {
        console.error('Load users error:', error);
      }
    }

    async function loadTasks() {
      try {
        // assigne_a refere auth.users (pa erp_users) → join pa mache;
        // 2 requete separe + fusion pa id.
        const { data: tasks } = await db
          .from('erp_taches')
          .select('*')
          .order('created_at', { ascending: false });

        const { data: users } = await db.from('erp_users').select('id, first_name, last_name');
        const userMap = {};
        (users || []).forEach(u => { userMap[u.id] = u; });

        allTasks = (tasks || []).map(t => ({ ...t, assigne: userMap[t.assigne_a] || null }));
        renderKanbanBoard(allTasks);
      } catch (error) {
        console.error('Load tasks error:', error);
      }
    }

    function renderKanbanBoard(tasks) {
      const columns = {
        'a_faire': [],
        'en_cours': [],
        'en_revision': [],
        'termine': []
      };

      tasks.forEach(task => {
        if (columns[task.statut]) {
          columns[task.statut].push(task);
        }
      });

      Object.keys(columns).forEach(status => {
        const container = document.getElementById(`column-${status}`);
        const countEl = document.getElementById(`count-${status}`);
        
        countEl.textContent = columns[status].length;
        
        if (!columns[status].length) {
          container.innerHTML = '<div class="empty-state" style="padding: var(--space-4);"><p class="text-muted text-sm">Aucune tâche</p></div>';
          return;
        }

        container.innerHTML = columns[status].map(task => {
          const assigneeInitials = task.assigne ? 
            `${task.assigne.first_name?.[0] || ''}${task.assigne.last_name?.[0] || ''}`.toUpperCase() : '?';
          const isOverdue = task.echeance && new Date(task.echeance) < new Date();
          
          return `
            <div class="kanban-task" draggable="true" ondragstart="dragStart(event, '${task.id}', '${status}')" ondragend="dragEnd(event)">
              <div class="kanban-task-header">
                <span class="kanban-task-title">${task.titre}</span>
                <span class="kanban-task-priority">
                  <span class="badge badge-${task.priorite === 'haute' ? 'danger' : 'secondary'}" style="font-size: 10px;">${task.priorite[0].toUpperCase()}</span>
                </span>
              </div>
              <div class="kanban-task-meta">
                <div class="kanban-task-assignee">
                  <div class="kanban-task-assignee-avatar">${assigneeInitials}</div>
                  <span>${task.assigne ? `${task.assigne.first_name} ${task.assigne.last_name}` : 'Non assigné'}</span>
                </div>
              </div>
              <div class="kanban-task-footer">
                <span class="kanban-task-module">${task.module_tag || 'Général'}</span>
                <span class="kanban-task-due ${isOverdue ? 'overdue' : ''}">
                  ${task.echeance ? formatDate(task.echeance) : ''}
                </span>
              </div>
            </div>
          `;
        }).join('');
      });

      lucide.createIcons();
    }

    function dragStart(event, taskId, fromStatus) {
      event.dataTransfer.setData('taskId', taskId);
      event.dataTransfer.setData('fromStatus', fromStatus);
      event.target.classList.add('dragging');
    }

    function dragEnd(event) {
      event.target.classList.remove('dragging');
    }

    function setupDropZones() {
      const columns = document.querySelectorAll('.kanban-column');
      columns.forEach(column => {
        column.addEventListener('dragover', (e) => {
          e.preventDefault();
        });

        column.addEventListener('drop', async (e) => {
          e.preventDefault();
          const taskId = e.dataTransfer.getData('taskId');
          const toStatus = column.querySelector('.kanban-tasks').id.replace('column-', '');
          
          if (taskId && toStatus) {
            await moveTask(taskId, toStatus);
          }
        });
      });
    }

    async function moveTask(taskId, newStatus) {
      try {
        await db.from('erp_taches').update({ statut: newStatus }).eq('id', taskId);
        await loadTasks();
        logActivity('Déplacement tâche', 'Tâches', `Tâche ${taskId} déplacée à ${newStatus}`);
      } catch (error) {
        console.error('Move task error:', error);
      }
    }

    function openAddTaskModal() {
      document.getElementById('add-task-modal').classList.remove('hidden');
    }

    function closeAddTaskModal() {
      document.getElementById('add-task-modal').classList.add('hidden');
      document.getElementById('add-task-form').reset();
    }

    async function submitAddTask() {
      const form = document.getElementById('add-task-form');
      const formData = new FormData(form);
      
      const taskData = {
        titre: formData.get('titre'),
        description: formData.get('description'),
        assigne_a: formData.get('assigne_a') || null,
        assigne_par: window.currentUser?.id,
        priorite: formData.get('priorite'),
        echeance: formData.get('echeance') || null,
        module_tag: formData.get('module_tag'),
        statut: 'a_faire'
      };

      try {
        await db.from('erp_taches').insert(taskData);
        closeAddTaskModal();
        await loadTasks();
        logActivity('Création tâche', 'Tâches', `Tâche ${taskData.titre} créée`);
      } catch (error) {
        console.error('Add task error:', error);
        alert('Erreur lors de la création');
      }
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadUsers();
        loadTasks();
        setupDropZones();
      });
    });
  </script>
</body>
</html>
