<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres Entreprise - HAITI REH-CARE ERP</title>
  <link rel="stylesheet" href="/assets/css/variables.css?v=8">
  <link rel="stylesheet" href="/assets/css/main.css?v=8">
  <link rel="stylesheet" href="/assets/css/layout.css?v=8">
  <link rel="stylesheet" href="/assets/css/components.css?v=8">
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=8">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js?v=8"></script>
  <script src="/assets/js/auth.js?v=8"></script>
  <script src="/assets/js/layout.js?v=8"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/img/logohaitirecare.png" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Paramètres Entreprise</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Informations de l'entreprise</h3>
          </div>
          <form id="company-form">
            <div class="form-group">
              <label class="form-label">Logo du centre (ERP + site public)</label>
              <div style="display: flex; align-items: center; gap: var(--space-4, 16px);">
                <img id="logo-preview" src="/assets/img/logohaitirecare.png" alt="Logo"
                     style="width: 64px; height: 64px; border-radius: 12px; object-fit: cover; border: 1px solid var(--clr-border, #E2E8F0); background: #fff;">
                <div>
                  <input type="file" id="logo-input" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="display: none;">
                  <button type="button" class="btn btn-secondary" onclick="document.getElementById('logo-input').click()">
                    <i data-lucide="upload"></i> Choisir un logo
                  </button>
                  <p style="margin: 6px 0 0; font-size: 12px; color: var(--clr-text-muted, #94A3B8);">PNG, JPG, SVG ou WebP — 2 Mo max</p>
                </div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Nom de l'entreprise</label>
                <input type="text" id="company-name" class="form-input">
              </div>
              <div class="form-group">
                <label class="form-label">Email de contact</label>
                <input type="email" id="company-email" class="form-input">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Téléphone</label>
                <input type="tel" id="company-phone" class="form-input">
              </div>
              <div class="form-group">
                <label class="form-label">Site web</label>
                <input type="url" id="company-website" class="form-input">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Adresse</label>
              <input type="text" id="company-address" class="form-input">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Ville</label>
                <input type="text" id="company-city" class="form-input">
              </div>
              <div class="form-group">
                <label class="form-label">Pays</label>
                <input type="text" id="company-country" class="form-input">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">N° RC</label>
                <input type="text" id="company-rc" class="form-input">
              </div>
              <div class="form-group">
                <label class="form-label">N° IFU</label>
                <input type="text" id="company-ifu" class="form-input">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Devise par défaut</label>
              <select id="company-currency" class="form-select form-input">
                <option value="HTG">HTG - Gourde haïtienne</option>
                <option value="USD">USD - Dollar américain</option>
                <option value="EUR">EUR - Euro</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary" onclick="saveCompanySettings()">Enregistrer</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function loadCompanySettings() {
      try {
        const { data: settings } = await db.from('erp_settings').select('*').maybeSingle();
        
        if (settings) {
          document.getElementById('company-name').value = settings.company_name || '';
          document.getElementById('company-email').value = settings.company_email || '';
          document.getElementById('company-phone').value = settings.company_phone || '';
          document.getElementById('company-website').value = settings.company_website || '';
          document.getElementById('company-address').value = settings.company_address || '';
          document.getElementById('company-city').value = settings.company_city || '';
          document.getElementById('company-country').value = settings.company_country || '';
          document.getElementById('company-rc').value = settings.company_rc || '';
          document.getElementById('company-ifu').value = settings.company_ifu || '';
          document.getElementById('company-currency').value = settings.default_currency || 'HTG';
          if (settings.logo_url) {
            document.getElementById('logo-preview').src = settings.logo_url;
          }
        }
      } catch (error) {
        console.error('Load settings error:', error);
      }
    }

    let _pendingLogoUrl = null;

    document.getElementById('logo-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        alert('Le logo ne doit pas dépasser 2 Mo');
        e.target.value = '';
        return;
      }

      try {
        const ext = file.name.split('.').pop().toLowerCase() || 'png';
        const path = `logo-${Date.now()}.${ext}`;
        const { error: upErr } = await db.storage
          .from('erp-settings')
          .upload(path, file, { upsert: true, contentType: file.type });
        if (upErr) throw upErr;

        const { data } = db.storage.from('erp-settings').getPublicUrl(path);
        _pendingLogoUrl = data.publicUrl;
        document.getElementById('logo-preview').src = data.publicUrl;
      } catch (err) {
        console.error('Logo upload error:', err);
        alert('Erreur lors du téléversement du logo: ' + err.message);
      }
    });

    async function saveCompanySettings() {
      const settings = {
        company_name: document.getElementById('company-name').value,
        company_email: document.getElementById('company-email').value,
        company_phone: document.getElementById('company-phone').value,
        company_website: document.getElementById('company-website').value,
        company_address: document.getElementById('company-address').value,
        company_city: document.getElementById('company-city').value,
        company_country: document.getElementById('company-country').value,
        company_rc: document.getElementById('company-rc').value,
        company_ifu: document.getElementById('company-ifu').value,
        default_currency: document.getElementById('company-currency').value
      };
      if (_pendingLogoUrl) {
        settings.logo_url = _pendingLogoUrl;
      }

      try {
        const { data: existing } = await db.from('erp_settings').select('id').maybeSingle();
        
        if (existing) {
          await db.from('erp_settings').update(settings).eq('id', existing.id);
        } else {
          await db.from('erp_settings').insert(settings);
        }
        
        alert('Paramètres enregistrés avec succès');
        logActivity('Modification paramètres', 'Paramètres', 'Paramètres entreprise modifiés');
      } catch (error) {
        console.error('Save settings error:', error);
        alert('Erreur lors de l\'enregistrement');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadCompanySettings();
      });
    });
  </script>
</body>
</html>
