<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permissions - ERP Entreprise</title>
  <link rel="stylesheet" href="/assets/css/variables.css?v=7">
  <link rel="stylesheet" href="/assets/css/main.css?v=7">
  <link rel="stylesheet" href="/assets/css/layout.css?v=7">
  <link rel="stylesheet" href="/assets/css/components.css?v=7">
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=7">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js?v=7"></script>
  <script src="/assets/js/auth.js?v=7"></script>
  <script src="/assets/js/layout.js?v=7"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/img/logo-placeholder.svg" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Gestion des Permissions</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Matrice des permissions par rôle</h3>
          </div>
          <div class="table-container">
            <table class="table" id="permissions-table">
              <thead>
                <tr>
                  <th>Module / Action</th>
                  <th>PDG</th>
                  <th>Secrétaire</th>
                  <th>Comptable</th>
                  <th>Resp. Stock</th>
                  <th>Commercial</th>
                  <th>RH</th>
                  <th>Employé</th>
                </tr>
              </thead>
              <tbody id="permissions-table-body">
                <tr>
                  <td colspan="7" style="text-align: center; padding: var(--space-6);">
                    <div class="loading">
                      <div class="loading-spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card" style="margin-top: var(--space-6);">
          <div class="card-header">
            <h3 class="card-title">Légende des permissions</h3>
          </div>
          <div style="padding: var(--space-4);">
            <div class="permissions-legend">
              <div class="permissions-legend-item">
                <span class="badge badge-success">Lecture</span>
                <span class="text-muted">Accès en lecture seule</span>
              </div>
              <div class="permissions-legend-item">
                <span class="badge badge-primary">Écriture</span>
                <span class="text-muted">Accès complet (lecture/écriture)</span>
              </div>
              <div class="permissions-legend-item">
                <span class="badge badge-secondary">Aucun</span>
                <span class="text-muted">Pas d'accès</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const permissionMatrix = {
      'Users': {
        pdg: 'full',
        secretaire: 'read',
        comptable: 'none',
        responsable_stock: 'none',
        commercial: 'none',
        rh: 'read',
        employe: 'none'
      },
      'Stock': {
        pdg: 'full',
        secretaire: 'read',
        comptable: 'read',
        responsable_stock: 'full',
        commercial: 'read',
        rh: 'none',
        employe: 'read'
      },
      'Finances': {
        pdg: 'full',
        secretaire: 'read',
        comptable: 'full',
        responsable_stock: 'none',
        commercial: 'none',
        rh: 'none',
        employe: 'none'
      },
      'Clients': {
        pdg: 'full',
        secretaire: 'full',
        comptable: 'read',
        responsable_stock: 'none',
        commercial: 'full',
        rh: 'read',
        employe: 'none'
      },
      'RH': {
        pdg: 'full',
        secretaire: 'read',
        comptable: 'none',
        responsable_stock: 'none',
        commercial: 'none',
        rh: 'full',
        employe: 'read'
      },
      'Tâches': {
        pdg: 'full',
        secretaire: 'read',
        comptable: 'read',
        responsable_stock: 'read',
        commercial: 'read',
        rh: 'read',
        employe: 'read'
      },
      'Rapports': {
        pdg: 'full',
        secretaire: 'read',
        comptable: 'full',
        responsable_stock: 'read',
        commercial: 'read',
        rh: 'read',
        employe: 'none'
      },
      'Paramètres': {
        pdg: 'full',
        secretaire: 'none',
        comptable: 'none',
        responsable_stock: 'none',
        commercial: 'none',
        rh: 'none',
        employe: 'none'
      }
    };

    function renderPermissionsTable() {
      const tbody = document.getElementById('permissions-table-body');
      
      tbody.innerHTML = Object.entries(permissionMatrix).map(([module, permissions]) => `
        <tr>
          <td><strong>${module}</strong></td>
          ${Object.entries(permissions).map(([role, level]) => `
            <td>
              <span class="badge badge-${level === 'full' ? 'primary' : level === 'read' ? 'success' : 'secondary'}">
                ${level === 'full' ? 'Écriture' : level === 'read' ? 'Lecture' : 'Aucun'}
              </span>
            </td>
          `).join('')}
        </tr>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        renderPermissionsTable();
      });
    });
  </script>
</body>
</html>
