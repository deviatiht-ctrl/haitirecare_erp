<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorties Stock - HAITI REH-CARE ERP</title>
  <link rel="stylesheet" href="/assets/css/variables.css?v=8">
  <link rel="stylesheet" href="/assets/css/main.css?v=8">
  <link rel="stylesheet" href="/assets/css/layout.css?v=8">
  <link rel="stylesheet" href="/assets/css/components.css?v=8">
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=8">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/assets/js/supabase.js?v=9"></script>
  <script src="/assets/js/auth.js?v=9"></script>
  <script src="/assets/js/layout.js?v=9"></script>
  <script src="/assets/js/excel.js?v=9"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/img/logohaitirecare.png" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Sorties de Stock</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-secondary" onclick="exportExits()">
              <i data-lucide="download"></i>
              Exporter
            </button>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--space-6);">
          <div class="card-header">
            <h3 class="card-title">Nouvelle sortie</h3>
          </div>
          <form id="exit-form">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-input" required>
              </div>
              <div class="form-group">
                <label class="form-label">Article</label>
                <select name="produit_id" class="form-select form-input" id="product-select" required>
                  <option value="">Sélectionner un article</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Quantité</label>
                <input type="number" name="quantite" class="form-input" min="1" required>
              </div>
              <div class="form-group">
                <label class="form-label">Motif</label>
                <select name="motif" class="form-select form-input" required>
                  <option value="vente">Vente</option>
                  <option value="usage_interne">Usage interne</option>
                  <option value="perte">Perte</option>
                  <option value="retour">Retour</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Notes</label>
              <textarea name="notes" class="form-input form-textarea"></textarea>
            </div>
            <button type="button" class="btn btn-primary" onclick="submitExit()">Enregistrer la sortie</button>
          </form>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Historique des sorties</h3>
          </div>
          <div class="table-container">
            <table class="table" id="exits-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Article</th>
                  <th>Quantité</th>
                  <th>Motif</th>
                  <th>Notes</th>
                </tr>
              </thead>
              <tbody id="exits-table-body">
                <tr>
                  <td colspan="5" style="text-align: center; padding: var(--space-6);">
                    <div class="loading">
                      <div class="loading-spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let allExits = [];
    let allProducts = [];

    async function loadProducts() {
      try {
        const { data: products } = await db.from('erp_produits').select('*').eq('is_active', true).order('designation');
        allProducts = products || [];
        
        const select = document.getElementById('product-select');
        select.innerHTML = '<option value="">Sélectionner un article</option>';
        allProducts.forEach(p => {
          const stockLabel = p.quantite <= p.quantite_min ? ' (Stock faible)' : '';
          select.innerHTML += `<option value="${p.id}" data-stock="${p.quantite}">${p.code ? p.code + ' - ' : ''}${p.designation}${stockLabel}</option>`;
        });
      } catch (error) {
        console.error('Load products error:', error);
      }
    }

    async function loadExits() {
      try {
        const { data: exits } = await db
          .from('erp_stock_movements')
          .select('*, erp_produits(designation, code)')
          .eq('type', 'sortie')
          .order('created_at', { ascending: false });
        
        allExits = exits || [];
        renderExitsTable(allExits);
      } catch (error) {
        console.error('Load exits error:', error);
      }
    }

    function renderExitsTable(exits) {
      const tbody = document.getElementById('exits-table-body');
      
      if (!exits.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Aucune sortie</td></tr>';
        return;
      }

      tbody.innerHTML = exits.map(exit => {
        const product = exit.erp_produits || {};
        
        return `
          <tr>
            <td>${formatDate(exit.created_at)}</td>
            <td>${product.code ? product.code + ' - ' : ''}${product.designation || 'N/A'}</td>
            <td class="text-danger">-${exit.quantite}</td>
            <td>${exit.motif || '-'}</td>
            <td>${exit.notes || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    async function submitExit() {
      const form = document.getElementById('exit-form');
      const formData = new FormData(form);
      
      const productSelect = document.getElementById('product-select');
      const selectedOption = productSelect.options[productSelect.selectedIndex];
      const availableStock = parseInt(selectedOption.dataset.stock) || 0;
      
      const quantity = parseFloat(formData.get('quantite'));
      
      if (quantity > availableStock) {
        alert(`Stock insuffisant. Disponible: ${availableStock}`);
        return;
      }
      
      const exitData = {
        produit_id: formData.get('produit_id'),
        type: 'sortie',
        quantite: quantity,
        motif: formData.get('motif'),
        notes: formData.get('notes'),
        created_by: window.currentUser?.id
      };

      if (!exitData.produit_id || !exitData.quantite) {
        alert('Veuillez remplir les champs obligatoires');
        return;
      }

      try {
        await db.from('erp_stock_movements').insert(exitData);
        form.reset();
        await loadProducts();
        await loadExits();
        logActivity('Sortie stock', 'Stock', `Sortie de ${exitData.quantité} unités`);
      } catch (error) {
        console.error('Submit exit error:', error);
        alert('Erreur lors de l\'enregistrement');
      }
    }

    function exportExits() {
      const data = allExits.map(e => ({
        Date: formatDate(e.created_at),
        Article: e.erp_produits?.designation || 'N/A',
        Code: e.erp_produits?.code || '',
        Quantité: e.quantite,
        Motif: e.motif || '',
        Notes: e.notes || ''
      }));
      
      exportToExcel(data, 'sorties-stock', 'Sorties');
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    document.getElementById('exit-form').querySelector('input[name="date"]').valueAsDate = new Date();

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadProducts();
        loadExits();
      });
    });
  </script>
</body>
</html>
