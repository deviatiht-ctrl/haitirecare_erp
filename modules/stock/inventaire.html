<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventaire - HAITI REH-CARE ERP</title>
  <link rel="stylesheet" href="/assets/css/variables.css?v=9">
  <link rel="stylesheet" href="/assets/css/main.css?v=9">
  <link rel="stylesheet" href="/assets/css/layout.css?v=9">
  <link rel="stylesheet" href="/assets/css/components.css?v=9">
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=9">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/assets/js/supabase.js?v=10"></script>
  <script src="/assets/js/auth.js?v=11"></script>
  <script src="/assets/js/layout.js?v=10"></script>
  <script src="/assets/js/excel.js?v=10"></script>
  <style>
    .product-thumb {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--clr-border, #E2E8F0);
      flex-shrink: 0;
    }
    .product-thumb-empty {
      display: inline-grid;
      place-items: center;
      background: #F1F5F9;
      color: #94A3B8;
      border: 1px dashed var(--clr-border, #E2E8F0);
    }
    .product-thumb-empty i { width: 16px; height: 16px; }
    .product-photo-slot {
      width: 92px;
      height: 92px;
      border: 1.5px dashed var(--clr-border, #CBD5E1);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--clr-text-muted, #94A3B8);
      background: #F8FAFC;
      overflow: hidden;
      flex-shrink: 0;
    }
    .product-photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/img/logohaitirecare.png" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Inventaire</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" id="search-input" placeholder="Rechercher un article...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-secondary" onclick="exportInventory()">
              <i data-lucide="download"></i>
              Exporter
            </button>
            <button class="btn btn-primary" id="add-product-btn" onclick="openAddProductModal()">
              <i data-lucide="plus"></i>
              Ajouter un article
            </button>
          </div>
        </div>

        <div class="filters-bar">
          <input type="text" id="filter-category" class="form-input" placeholder="Catégorie">
          <input type="text" id="filter-supplier" class="form-input" placeholder="Fournisseur">
          <select id="filter-status" class="form-select form-input">
            <option value="">Tous les statuts</option>
            <option value="in-stock">En stock</option>
            <option value="low-stock">Stock faible</option>
            <option value="out-of-stock">Rupture</option>
          </select>
          <button class="btn btn-secondary" onclick="applyFilters()">Filtrer</button>
          <button class="btn btn-ghost" onclick="resetFilters()">Réinitialiser</button>
        </div>

        <div class="card">
          <div class="table-container">
            <table class="table" id="products-table">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Désignation</th>
                  <th>Catégorie</th>
                  <th>Qté en stock</th>
                  <th>Qté min</th>
                  <th>Prix unitaire</th>
                  <th>Valeur totale</th>
                  <th>Statut</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-table-body">
                <tr>
                  <td colspan="9" style="text-align: center; padding: var(--space-6);">
                    <div class="loading">
                      <div class="loading-spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Product Modal -->
  <div id="add-product-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Ajouter un article</h3>
        <button class="modal-close" onclick="closeAddProductModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="add-product-form" class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Code article</label>
            <input type="text" name="code" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Désignation</label>
            <input type="text" name="designation" class="form-input" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Catégorie</label>
            <input type="text" name="categorie" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Fournisseur</label>
            <input type="text" name="fournisseur" class="form-input">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Quantité initiale</label>
            <input type="number" name="quantite" class="form-input" value="0" min="0" required>
          </div>
          <div class="form-group">
            <label class="form-label">Quantité minimum</label>
            <input type="number" name="quantite_min" class="form-input" value="0" min="0" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Prix d'achat</label>
            <input type="number" name="prix_achat" class="form-input" value="0" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label class="form-label">Prix de vente</label>
            <input type="number" name="prix_vente" class="form-input" value="0" min="0" step="0.01">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Unité</label>
            <select name="unite" class="form-select form-input">
              <option value="pièce">Pièce</option>
              <option value="kg">Kg</option>
              <option value="litre">Litre</option>
              <option value="carton">Carton</option>
              <option value="ramette">Ramette</option>
              <option value="boîte">Boîte</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <input type="text" name="description" class="form-input">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Photo de l'article</label>
          <div style="display: flex; align-items: center; gap: 14px;">
            <div class="product-photo-slot" id="product-photo-preview">
              <i data-lucide="image"></i>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <input type="file" id="product-photo-input" accept="image/*" hidden>
              <button type="button" class="btn btn-secondary" style="padding: 8px 14px; font-size: 13px;" onclick="document.getElementById('product-photo-input').click()">
                <i data-lucide="upload"></i> Choisir une photo
              </button>
              <button type="button" class="btn btn-ghost hidden" id="product-photo-remove" style="padding: 8px 14px; font-size: 13px; color: #DC2626;" onclick="removeProductPhoto()">
                <i data-lucide="trash-2"></i> Retirer la photo
              </button>
            </div>
          </div>
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddProductModal()">Annuler</button>
        <button class="btn btn-primary" onclick="submitAddProduct()">Ajouter</button>
      </div>
    </div>
  </div>

  <!-- Movement Modal — Prélèvement (sortie) / Entrée rapide -->
  <div id="movement-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="movement-modal-title">Mouvement de stock</h3>
        <button class="modal-close" onclick="closeMovementModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="movement-form" class="modal-body">
        <div class="form-group">
          <label class="form-label">Article</label>
          <input type="text" id="movement-product-name" class="form-input" disabled>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Quantité *</label>
            <input type="number" name="quantite" class="form-input" min="1" step="any" required>
          </div>
          <div class="form-group">
            <label class="form-label">Motif *</label>
            <select name="motif" class="form-select form-input" id="movement-motif" required></select>
          </div>
        </div>
        <div class="form-group hidden" id="movement-dest-wrap">
          <label class="form-label">Annexe de destination *</label>
          <select name="dest_annexe" class="form-select form-input" id="movement-dest"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-input form-textarea" rows="2"
                    placeholder="Qui prend le matériel, pour quelle utilisation…"></textarea>
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeMovementModal()">Annuler</button>
        <button class="btn btn-primary" id="movement-submit-btn" onclick="submitMovement()">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];
    let canEdit = false;
    let currentEditId = null;
    let photoFile = null;
    let photoRemoved = false;

    async function loadProducts() {
      try {
        canEdit = Boolean(
          window.currentUser?.role === 'pdg' ||
          hasPermission('stock') ||
          hasPermission('materiel_orthopedique') ||
          hasPermission('catalogue')
        );

        const { data: products } = await db
          .from('erp_produits')
          .select('*')
          .eq('is_active', true)
          .order('code');
        
        allProducts = products || [];

        const urlParams = new URLSearchParams(window.location.search);
        const catParam = urlParams.get('cat');
        const modParam = urlParams.get('m');

        if (catParam || modParam === 'materiel_orthopedique') {
          const categoryName = catParam || 'Matériel Orthopédique';
          document.title = `${categoryName} - HAITI REH-CARE ERP`;
          const titleEl = document.querySelector('.topbar-title');
          if (titleEl) titleEl.textContent = categoryName;

          const hasMatchingCategory = catParam && allProducts.some(
            p => p.categorie?.toLowerCase().includes(catParam.toLowerCase())
          );
          const filterCatEl = document.getElementById('filter-category');
          if (filterCatEl && hasMatchingCategory) {
            filterCatEl.value = catParam;
            applyFilters();
          } else {
            if (filterCatEl) filterCatEl.value = '';
            renderProductsTable(allProducts);
          }
        } else {
          renderProductsTable(allProducts);
        }
        
        const addBtn = document.getElementById('add-product-btn');
        if (addBtn) {
          if (!canEdit) {
            addBtn.classList.add('hidden');
          } else {
            addBtn.classList.remove('hidden');
          }
        }
      } catch (error) {
        console.error('Load products error:', error);
      }
    }

    function renderProductsTable(products) {
      const tbody = document.getElementById('products-table-body');
      
      if (!products.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Aucun article</td></tr>';
        return;
      }

      tbody.innerHTML = products.map(product => {
        const status = getStockStatus(product.quantite, product.quantite_min);
        const totalValue = product.quantite * product.prix_vente;
        
        return `
          <tr>
            <td>${product.code || '-'}</td>
            <td>
              <div style="display: flex; align-items: center; gap: 10px;">
                ${product.image_url
                  ? `<img src="${product.image_url}" class="product-thumb" alt="">`
                  : `<span class="product-thumb product-thumb-empty"><i data-lucide="package"></i></span>`}
                <span>${product.designation}</span>
              </div>
            </td>
            <td>${product.categorie || '-'}</td>
            <td>${product.quantite}</td>
            <td>${product.quantite_min}</td>
            <td>${formatCurrency(product.prix_vente)}</td>
            <td>${formatCurrency(totalValue)}</td>
            <td><span class="badge badge-${status.class}">${status.label}</span></td>
            <td>
              <div class="table-actions">
                <button class="table-action-btn" title="Prélever (sortie de matériel)" onclick="openMovementModal('${product.id}','sortie')">
                  <i data-lucide="circle-minus"></i>
                </button>
                ${canEdit ? `
                  <button class="table-action-btn" title="Entrée de stock" onclick="openMovementModal('${product.id}','entree')">
                    <i data-lucide="circle-plus"></i>
                  </button>
                  <button class="table-action-btn" title="Modifier" onclick="editProduct('${product.id}')">
                    <i data-lucide="edit"></i>
                  </button>
                  <button class="table-action-btn danger" title="Supprimer" onclick="deleteProduct('${product.id}')">
                    <i data-lucide="trash-2"></i>
                  </button>
                ` : `
                  <button class="table-action-btn" title="Voir" onclick="viewProduct('${product.id}')">
                    <i data-lucide="eye"></i>
                  </button>
                `}
              </div>
            </td>
          </tr>
        `;
      }).join('');
      
      lucide.createIcons();
    }

    function getStockStatus(quantity, min) {
      if (quantity === 0) return { label: 'Rupture', class: 'danger' };
      if (quantity <= min) return { label: 'Stock faible', class: 'warning' };
      return { label: 'En stock', class: 'success' };
    }

    function openAddProductModal() {
      currentEditId = null;
      document.querySelector('#add-product-modal .modal-title').textContent = 'Ajouter un article';
      document.getElementById('add-product-form').reset();
      resetProductPhoto(null);
      document.getElementById('add-product-modal').classList.remove('hidden');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function closeAddProductModal() {
      currentEditId = null;
      document.getElementById('add-product-modal').classList.add('hidden');
      document.getElementById('add-product-form').reset();
      resetProductPhoto(null);
    }

    // Photo produit — bucket piblik 'erp-produits'
    function resetProductPhoto(url) {
      photoFile = null;
      photoRemoved = !url;
      const input = document.getElementById('product-photo-input');
      if (input) input.value = '';
      const preview = document.getElementById('product-photo-preview');
      if (preview) {
        preview.innerHTML = url
          ? `<img src="${url}" alt="">`
          : '<i data-lucide="image"></i>';
      }
      const rmBtn = document.getElementById('product-photo-remove');
      if (rmBtn) rmBtn.classList.toggle('hidden', !url);
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function removeProductPhoto() {
      photoFile = null;
      photoRemoved = true;
      const input = document.getElementById('product-photo-input');
      if (input) input.value = '';
      const preview = document.getElementById('product-photo-preview');
      if (preview) preview.innerHTML = '<i data-lucide="image"></i>';
      const rmBtn = document.getElementById('product-photo-remove');
      if (rmBtn) rmBtn.classList.add('hidden');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function uploadProductPhoto(file, productId) {
      const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg';
      const path = `produits/${productId || 'new'}-${Date.now()}.${ext}`;
      const { error } = await db.storage.from('erp-produits').upload(path, file, { upsert: true, contentType: file.type });
      if (error) throw error;
      const { data } = db.storage.from('erp-produits').getPublicUrl(path);
      return data.publicUrl;
    }

    function editProduct(productId) {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;
      currentEditId = productId;
      const form = document.getElementById('add-product-form');
      form.code.value = product.code || '';
      form.designation.value = product.designation || '';
      form.categorie.value = product.categorie || '';
      form.fournisseur.value = product.fournisseur || '';
      form.quantite.value = product.quantite || 0;
      form.quantite_min.value = product.quantite_min || 0;
      form.prix_achat.value = product.prix_achat || 0;
      form.prix_vente.value = product.prix_vente || 0;
      form.unite.value = product.unite || 'pièce';
      form.description.value = product.description || '';
      resetProductPhoto(product.image_url || null);

      document.querySelector('#add-product-modal .modal-title').textContent = 'Modifier l\'article';
      document.getElementById('add-product-modal').classList.remove('hidden');
    }

    function viewProduct(productId) {
      const p = allProducts.find(x => x.id === productId);
      if (!p) return;
      alert(`Article: ${p.designation}\nCode: ${p.code || '-'}\nCatégorie: ${p.categorie || '-'}\nStock: ${p.quantite}\nPrix vente: ${formatCurrency(p.prix_vente)}`);
    }

    async function submitAddProduct() {
      const form = document.getElementById('add-product-form');
      const formData = new FormData(form);
      
      const productData = {
        code: formData.get('code'),
        designation: formData.get('designation'),
        categorie: formData.get('categorie'),
        fournisseur: formData.get('fournisseur'),
        quantite: parseFloat(formData.get('quantite')) || 0,
        quantite_min: parseFloat(formData.get('quantite_min')) || 0,
        prix_achat: parseFloat(formData.get('prix_achat')) || 0,
        prix_vente: parseFloat(formData.get('prix_vente')) || 0,
        unite: formData.get('unite'),
        description: formData.get('description'),
        created_by: window.currentUser?.id
      };

      // Foto: nouvo upload > retire > kenbe ansyen an
      let imageUrl = null;
      if (currentEditId) {
        imageUrl = allProducts.find(p => p.id === currentEditId)?.image_url || null;
      }
      if (photoRemoved) imageUrl = null;
      if (photoFile) {
        try {
          imageUrl = await uploadProductPhoto(photoFile, currentEditId);
        } catch (pe) {
          console.warn('Photo upload:', pe);
          alert('La photo n\'a pas pu être enregistrée, l\'article sera sauvegardé sans photo.');
        }
      }
      productData.image_url = imageUrl;

      try {
        if (currentEditId) {
          await db.from('erp_produits').update(productData).eq('id', currentEditId);
          logActivity('Modification produit', 'Stock', `Produit ${productData.code} modifié`);
        } else {
          await db.from('erp_produits').insert(productData);
          logActivity('Création produit', 'Stock', `Produit ${productData.code} créé`);
        }
        closeAddProductModal();
        await loadProducts();
      } catch (error) {
        console.error('Submit product error:', error);
        alert('Erreur lors de l\'enregistrement');
      }
    }

    async function deleteProduct(productId) {
      if (!confirm('Êtes-vous sûr de vouloir supprimer cet article ?')) return;
      
      try {
        await db.from('erp_produits').update({ is_active: false }).eq('id', productId);
        await loadProducts();
        logActivity('Suppression produit', 'Stock', `Produit ${productId} supprimé`);
      } catch (error) {
        console.error('Delete product error:', error);
        alert('Erreur lors de la suppression');
      }
    }

    // ============================================================
    // MOUVMAN STOCK — Prélèvement (sortie) / Entrée rapid
    // Insert nan erp_stock_movements → trigger SQL mete quantite
    // ajou otomatikman. "Transfert d'annexe" pase pa RPC la
    // (li kreye mouvman sòti + antre nan destinasyon an).
    // ============================================================
    let allAnnexes = [];
    let movementProduct = null;
    let movementType = 'sortie';

    const MOTIFS_SORTIE = [
      ['vente', 'Vente'],
      ['usage_interne', 'Consommation interne'],
      ['casse_perime', 'Cassé / Périmé'],
      ['transfert_annexe', "Transfert d'annexe"],
      ['retour', 'Retour fournisseur'],
      ['autre', 'Autre']
    ];
    const MOTIFS_ENTREE = [
      ['achat', 'Achat fournisseur'],
      ['retour_client', 'Retour client'],
      ['ajustement', 'Ajustement inventaire'],
      ['autre', 'Autre']
    ];

    async function loadAnnexes() {
      try {
        const { data } = await db.from('erp_annexes')
          .select('id, code, nom').eq('is_active', true).order('code');
        allAnnexes = data || [];
      } catch (e) { allAnnexes = []; }
    }

    // Menm wòl yo ak RPC erp_transfer_stock la
    function canTransferStock() {
      return ['pdg', 'directrice', 'directeur', 'manager', 'responsable_stock']
        .includes(window.currentUser?.role)
        || (typeof isErpOwner === 'function' && isErpOwner(window.currentUser));
    }

    function openMovementModal(productId, type) {
      movementProduct = allProducts.find(p => p.id === productId);
      if (!movementProduct) return;
      movementType = type;

      const form = document.getElementById('movement-form');
      form.reset();

      let motifs = type === 'sortie' ? MOTIFS_SORTIE : MOTIFS_ENTREE;
      // "Transfert d'annexe" rezève (RPC erp_transfer_stock): direksyon,
      // manager ak responsable_stock sèlman
      if (!canTransferStock()) {
        motifs = motifs.filter(([v]) => v !== 'transfert_annexe');
      }
      document.getElementById('movement-motif').innerHTML =
        motifs.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');

      document.getElementById('movement-product-name').value =
        `${movementProduct.code ? movementProduct.code + ' - ' : ''}${movementProduct.designation} (stock: ${movementProduct.quantite})`;
      document.getElementById('movement-modal-title').textContent =
        type === 'sortie' ? 'Prélèvement (sortie de matériel)' : 'Entrée de stock';
      document.getElementById('movement-submit-btn').innerHTML =
        type === 'sortie' ? '<i data-lucide="circle-minus"></i> Enregistrer la sortie'
                          : '<i data-lucide="circle-plus"></i> Enregistrer l\'entrée';

      // Annex destinasyon (selman pou transfè) — retire annex aktyèl la
      const current = (typeof getInsertAnnexeId === 'function' ? getInsertAnnexeId() : null)
                      || movementProduct.annexe_id;
      document.getElementById('movement-dest').innerHTML =
        allAnnexes.filter(a => a.id !== current)
          .map(a => `<option value="${a.id}">${a.code} — ${a.nom}</option>`).join('');
      document.getElementById('movement-dest-wrap').classList.add('hidden');

      document.getElementById('movement-modal').classList.remove('hidden');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function closeMovementModal() {
      document.getElementById('movement-modal').classList.add('hidden');
      document.getElementById('movement-form').reset();
      movementProduct = null;
    }

    async function submitMovement() {
      if (!movementProduct) return;
      const fd = new FormData(document.getElementById('movement-form'));
      const quantite = parseFloat(fd.get('quantite'));
      const motif = fd.get('motif');

      if (!quantite || quantite <= 0) return alert('Quantité invalide');
      if (!motif) return alert('Le motif est obligatoire');
      if (movementType === 'sortie' && quantite > parseFloat(movementProduct.quantite || 0)) {
        return alert(`Stock insuffisant. Disponible: ${movementProduct.quantite}`);
      }

      const btn = document.getElementById('movement-submit-btn');
      btn.disabled = true;
      try {
        if (movementType === 'sortie' && motif === 'transfert_annexe') {
          const dest = fd.get('dest_annexe');
          if (!dest) { alert("Choisir l'annexe de destination"); btn.disabled = false; return; }
          const { error } = await db.rpc('erp_transfer_stock', {
            p_produit_id: movementProduct.id,
            p_quantite: quantite,
            p_dest_annexe_id: dest,
            p_motif: fd.get('notes') || 'Transfert entre annexes'
          });
          if (error) throw error;
        } else {
          const { error } = await db.from('erp_stock_movements').insert({
            produit_id: movementProduct.id,
            type: movementType,
            quantite,
            motif,
            notes: fd.get('notes') || null,
            created_by: window.currentUser?.id
          });
          if (error) throw error;
        }

        closeMovementModal();
        await loadProducts();
        logActivity(
          movementType === 'sortie' ? 'Sortie stock' : 'Entrée stock',
          'Stock',
          `${movementProduct.designation} — ${quantite} (${motif})`
        );
      } catch (error) {
        console.error('Submit movement error:', error);
        alert('Erreur: ' + (error.message || error));
      } finally {
        btn.disabled = false;
      }
    }

    function applyFilters() {
      const category = document.getElementById('filter-category').value.toLowerCase();
      const supplier = document.getElementById('filter-supplier').value.toLowerCase();
      const status = document.getElementById('filter-status').value;

      let filtered = allProducts;

      if (category) {
        filtered = filtered.filter(p => p.categorie?.toLowerCase().includes(category));
      }

      if (supplier) {
        filtered = filtered.filter(p => p.fournisseur?.toLowerCase().includes(supplier));
      }

      if (status) {
        filtered = filtered.filter(p => {
          const stockStatus = getStockStatus(p.quantite, p.quantite_min);
          if (status === 'in-stock') return stockStatus.label === 'En stock';
          if (status === 'low-stock') return stockStatus.label === 'Stock faible';
          if (status === 'out-of-stock') return stockStatus.label === 'Rupture';
          return true;
        });
      }

      renderProductsTable(filtered);
    }

    function resetFilters() {
      document.getElementById('filter-category').value = '';
      document.getElementById('filter-supplier').value = '';
      document.getElementById('filter-status').value = '';
      renderProductsTable(allProducts);
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allProducts.filter(p => 
        p.designation?.toLowerCase().includes(query) ||
        p.code?.toLowerCase().includes(query) ||
        p.categorie?.toLowerCase().includes(query)
      );
      renderProductsTable(filtered);
    });

    function exportInventory() {
      const data = allProducts.map(p => ({
        Code: p.code || '',
        Désignation: p.designation,
        Catégorie: p.categorie || '',
        'Qté en stock': p.quantite,
        'Qté min': p.quantite_min,
        'Prix achat': p.prix_achat,
        'Prix vente': p.prix_vente,
        Unité: p.unite,
        Fournisseur: p.fournisseur || '',
        'Valeur totale': p.quantite * p.prix_vente
      }));
      
      exportWithConfig(data, 'inventory');
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('fr-HT', { style: 'currency', currency: 'HTG' }).format(amount);
    }

    document.getElementById('product-photo-input').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      photoFile = file;
      photoRemoved = false;
      const reader = new FileReader();
      reader.onload = ev => {
        const preview = document.getElementById('product-photo-preview');
        if (preview) preview.innerHTML = `<img src="${ev.target.result}" alt="">`;
        document.getElementById('product-photo-remove')?.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    });

    // Montre chan "annexe destinasyon" selman pou motif Transfert
    document.getElementById('movement-motif').addEventListener('change', (e) => {
      const wrap = document.getElementById('movement-dest-wrap');
      const isTransfer = e.target.value === 'transfert_annexe' && movementType === 'sortie';
      wrap.classList.toggle('hidden', !isTransfer);
      const sel = document.getElementById('movement-dest');
      if (isTransfer && !sel.options.length) {
        alert('Aucune autre annexe active — créez-en une dans Paramètres → Annexes.');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadAnnexes();
        loadProducts();
      });
    });
  </script>
</body>
</html>
