<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employés - HAITI REH-CARE ERP</title>
  <link rel="stylesheet" href="/assets/css/variables.css?v=8">
  <link rel="stylesheet" href="/assets/css/main.css?v=8">
  <link rel="stylesheet" href="/assets/css/layout.css?v=8">
  <link rel="stylesheet" href="/assets/css/components.css?v=8">
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=8">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="/assets/js/supabase.js?v=9"></script>
  <script src="/assets/js/auth.js?v=9"></script>
  <script src="/assets/js/layout.js?v=9"></script>
  <script src="/assets/js/excel.js?v=9"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/img/logohaitirecare.png" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title">Employés</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <i data-lucide="search"></i>
            <input type="text" id="search-input" placeholder="Rechercher...">
          </div>
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area">
        <div class="page-header">
          <div class="page-actions">
            <button class="btn btn-secondary" onclick="exportEmployees()">
              <i data-lucide="download"></i>
              Exporter
            </button>
          </div>
        </div>

        <div class="user-cards-grid" id="employees-grid">
          <div class="loading">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let allEmployees = [];
    let annexesMap = {};

    async function loadEmployees() {
      try {
        // erp_employes pa gen FK dirèk sou erp_users (tou de refere
        // auth.users) → join PostgREST la echwe. 2 requete separe + fusion.
        const { data: employees } = await db
          .from('erp_users')
          .select('*, erp_postes(*)')
          .eq('is_active', true)
          .order('last_name');

        const { data: fiches } = await db.from('erp_employes').select('*');
        const ficheMap = {};
        (fiches || []).forEach(f => { ficheMap[f.id] = f; });

        const { data: annexes } = await db.from('erp_annexes').select('id, code, nom');
        annexesMap = {};
        (annexes || []).forEach(a => { annexesMap[a.id] = a; });

        allEmployees = (employees || []).map(e => ({ ...e, erp_employes: ficheMap[e.id] || null }));
        renderEmployeesGrid(allEmployees);
      } catch (error) {
        console.error('Load employees error:', error);
      }
    }

    function renderEmployeesGrid(employees) {
      const container = document.getElementById('employees-grid');
      
      if (!employees.length) {
        container.innerHTML = '<div class="empty-state"><p class="text-muted">Aucun employé</p></div>';
        return;
      }

      container.innerHTML = employees.map(emp => {
        const initials = `${emp.first_name?.[0] || ''}${emp.last_name?.[0] || ''}`.toUpperCase();
        
        return `
          <div class="user-card" onclick="viewEmployee('${emp.id}')">
            <div class="user-card-header">
              <div class="user-card-avatar">${initials}</div>
              <div class="user-card-info">
                <div class="user-card-name">${emp.first_name} ${emp.last_name}</div>
                <div class="user-card-role">${emp.erp_postes?.name || emp.role}</div>
              </div>
            </div>
            <div class="user-card-details">
              <div>
                <div class="user-card-detail-label">Email</div>
                <div class="user-card-detail-value">${emp.email || '-'}</div>
              </div>
              <div>
                <div class="user-card-detail-label">Téléphone</div>
                <div class="user-card-detail-value">${emp.phone || '-'}</div>
              </div>
              <div>
                <div class="user-card-detail-label">Département</div>
                <div class="user-card-detail-value">${emp.erp_postes?.department || '-'}</div>
              </div>
              <div>
                <div class="user-card-detail-label">Annexe</div>
                <div class="user-card-detail-value">${emp.annexe_id ? (annexesMap[emp.annexe_id]?.nom || '-') : '-'}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function viewEmployee(employeeId) {
      window.location.href = `/modules/users/profil.html?id=${employeeId}`;
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allEmployees.filter(e => 
        `${e.first_name} ${e.last_name}`.toLowerCase().includes(query) ||
        e.email?.toLowerCase().includes(query)
      );
      renderEmployeesGrid(filtered);
    });

    function exportEmployees() {
      const data = allEmployees.map(e => ({
        Prénom: e.first_name,
        Nom: e.last_name,
        Email: e.email,
        Téléphone: e.phone || '',
        Rôle: formatRole(e.role),
        Poste: e.erp_postes?.name || '',
        Département: e.erp_postes?.department || '',
        'Date embauche': e.erp_employes?.date_embauche ? formatDate(e.erp_employes.date_embauche) : '',
        'Type contrat': e.erp_employes?.type_contrat || ''
      }));
      
      exportWithConfig(data, 'employees');
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then(() => {
        loadEmployees();
      });
    });
  </script>
</body>
</html>
