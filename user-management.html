<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion Utilisateurs - ERP Entreprise</title>
  <link rel="stylesheet" href="assets/css/variables.css?v=7">
  <link rel="stylesheet" href="assets/css/main.css?v=7">
  <link rel="stylesheet" href="assets/css/components.css?v=7">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f172a;
      min-height: 100vh;
    }
    
    .management-container {
      display: flex;
      min-height: 100vh;
    }
    
    .management-sidebar {
      width: 280px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(59, 130, 246, 0.1);
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
      z-index: 160;
    }

    .management-main {
      flex: 1;
      margin-left: 280px;
      padding: 32px;
      overflow-y: auto;
    }
    
    .management-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    
    .management-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -1px;
    }
    
    .section-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }
    
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    
    .module-card {
      background: rgba(59, 130, 246, 0.05);
      border: 2px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .module-card:hover {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
    }
    
    .module-card.selected {
      border-color: #3b82f6;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(99, 102, 241, 0.1) 100%);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);
    }
    
    .module-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    
    .module-icon svg {
      width: 24px;
      height: 24px;
      color: white;
    }
    
    .module-name {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      margin-bottom: 8px;
    }
    
    .module-description {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    
    .permissions-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(59, 130, 246, 0.2);
    }
    
    .permission-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .permission-checkbox input {
      width: 18px;
      height: 18px;
      accent-color: #3b82f6;
    }
    
    .permission-checkbox label {
      font-size: 12px;
      color: #e2e8f0;
    }
    
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      display: block;
    }
    
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
      color: #1e293b;
      font-size: 14px;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }
    
    .form-select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
      color: #1e293b;
      font-size: 14px;
      cursor: pointer;
    }
    
    /* Mobile menu + overlay */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .sidebar-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .mobile-menu-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 200;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.45);
      cursor: pointer;
    }

    .mobile-menu-btn i {
      width: 24px;
      height: 24px;
    }

    @media (max-width: 1024px) {
      .management-sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .management-sidebar.open {
        transform: translateX(0);
        box-shadow: 20px 0 60px rgba(0, 0, 0, 0.5);
      }

      .management-main {
        margin-left: 0;
      }

      .mobile-menu-btn {
        display: flex;
      }

      .modules-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .management-main {
        padding: 76px 16px 96px;
      }

      .management-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .management-header h1 {
        font-size: 22px;
      }

      .management-header .btn {
        width: 100%;
        justify-content: center;
        min-height: 44px;
      }

      .section-card {
        padding: 18px;
      }

      .section-card > div[style*="grid-template-columns: 1fr 2fr"] {
        grid-template-columns: 1fr !important;
      }

      .modules-grid {
        grid-template-columns: 1fr;
      }

      .form-input,
      .form-select,
      input,
      select,
      textarea {
        font-size: 16px;
      }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js?v=7"></script>
  <script src="assets/js/user-management.js?v=7"></script>
</head>
<body>
  <div class="sidebar-overlay" id="mgmt-overlay"></div>
  <button class="mobile-menu-btn" id="mgmt-menu-btn" title="Menu">
    <i data-lucide="menu"></i>
  </button>

  <div class="management-container">
    <!-- Sidebar -->
    <div class="management-sidebar">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid rgba(59, 130, 246, 0.2);">
        <img src="assets/img/logo-placeholder.svg" alt="Logo" style="height: 40px;">
        <h2 style="font-size: 18px; font-weight: 700; color: #ffffff;">Gestion Users</h2>
      </div>
      
      <nav style="display: flex; flex-direction: column; gap: 8px;">
        <a href="#" class="nav-item" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: #94a3b8; text-decoration: none; transition: all 0.3s ease; font-weight: 500; font-size: 14px;">
          <i data-lucide="users"></i>
          Utilisateurs
        </a>
        <a href="#" class="nav-item" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: #94a3b8; text-decoration: none; transition: all 0.3s ease; font-weight: 500; font-size: 14px;">
          <i data-lucide="shield"></i>
          Rôles Personnalisés
        </a>
        <a href="#" class="nav-item" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: #94a3b8; text-decoration: none; transition: all 0.3s ease; font-weight: 500; font-size: 14px;">
          <i data-lucide="grid"></i>
          Modules
        </a>
        <a href="dashboard.html" class="nav-item" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: #94a3b8; text-decoration: none; transition: all 0.3s ease; font-weight: 500; font-size: 14px;">
          <i data-lucide="arrow-left"></i>
          Retour Dashboard
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="management-main">
      <div class="management-header">
        <h1>Gestion des Utilisateurs et Modules</h1>
        <button class="btn btn-primary" onclick="showCreateUserModal()">
          <i data-lucide="user-plus" style="width: 16px; height: 16px; margin-right: 8px; display: inline-block;"></i>
          Créer Utilisateur
        </button>
      </div>

      <!-- Create User with Custom Modules -->
      <div class="section-card">
        <div class="section-header">
          <h2 class="section-title">Créer Utilisateur avec Modules Personnalisés</h2>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px;">
          <!-- User Info -->
          <div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" id="user-email" class="form-input" placeholder="email@exemple.com">
            </div>
            
            <div class="form-group">
              <label class="form-label">Prénom</label>
              <input type="text" id="user-firstname" class="form-input" placeholder="Prénom">
            </div>
            
            <div class="form-group">
              <label class="form-label">Nom</label>
              <input type="text" id="user-lastname" class="form-input" placeholder="Nom">
            </div>
            
            <div class="form-group">
              <label class="form-label">Mot de passe</label>
              <input type="password" id="user-password" class="form-input" placeholder="Mot de passe">
            </div>
            
            <div class="form-group">
              <label class="form-label">Rôle de base</label>
              <select id="user-role" class="form-select">
                <option value="secretaire">Secrétaire</option>
                <option value="comptable">Comptable</option>
                <option value="responsable_stock">Responsable Stock</option>
                <option value="commercial">Commercial</option>
                <option value="rh">Responsable RH</option>
                <option value="community_manager">Community Manager</option>
                <option value="employe">Employé</option>
              </select>
            </div>
          </div>
          
          <!-- Module Selection -->
          <div>
            <label class="form-label">Modules et Permissions</label>
            <div class="modules-grid" id="modules-container">
              <!-- Modules will be loaded dynamically -->
            </div>
          </div>
        </div>
        
        <div style="margin-top: 24px; text-align: right;">
          <button class="btn btn-primary" onclick="createUserWithModules()">
            Créer Utilisateur
          </button>
        </div>
      </div>

      <!-- Existing Users -->
      <div class="section-card">
        <div class="section-header">
          <h2 class="section-title">Utilisateurs Existants</h2>
        </div>
        
        <div id="users-list">
          <!-- Users will be loaded dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    let selectedModules = {};

    // Load available modules
    async function loadModules() {
      try {
        const { data: enterpriseId } = await supabase.rpc('erp_get_user_enterprise');
        
        if (!enterpriseId) {
          console.error('No enterprise found');
          return;
        }

        const { data: modules, error } = await supabase.rpc('erp_get_enterprise_modules', {
          p_enterprise_id: enterpriseId
        });

        if (error) throw error;

        renderModules(modules);
      } catch (error) {
        console.error('Error loading modules:', error);
      }
    }

    // Render modules
    function renderModules(modules) {
      const container = document.getElementById('modules-container');
      if (!container) return;

      container.innerHTML = modules.map(module => `
        <div class="module-card" data-module="${module.module_code}" onclick="toggleModule('${module.module_code}')">
          <div class="module-icon">
            <i data-lucide="${module.icon || 'grid'}"></i>
          </div>
          <div class="module-name">${module.module_name}</div>
          <div class="module-description">${module.category}</div>
          
          <div class="permissions-section">
            <div class="permission-checkbox">
              <input type="checkbox" id="perm-view-${module.module_code}" checked>
              <label for="perm-view-${module.module_code}">Voir</label>
            </div>
            <div class="permission-checkbox">
              <input type="checkbox" id="perm-create-${module.module_code}">
              <label for="perm-create-${module.module_code}">Créer</label>
            </div>
            <div class="permission-checkbox">
              <input type="checkbox" id="perm-edit-${module.module_code}">
              <label for="perm-edit-${module.module_code}">Modifier</label>
            </div>
            <div class="permission-checkbox">
              <input type="checkbox" id="perm-delete-${module.module_code}">
              <label for="perm-delete-${module.module_code}">Supprimer</label>
            </div>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // Toggle module selection
    function toggleModule(moduleCode) {
      const card = document.querySelector(`[data-module="${moduleCode}"]`);
      card.classList.toggle('selected');
      
      if (selectedModules[moduleCode]) {
        delete selectedModules[moduleCode];
      } else {
        selectedModules[moduleCode] = {
          view: document.getElementById(`perm-view-${moduleCode}`).checked,
          create: document.getElementById(`perm-create-${moduleCode}`).checked,
          edit: document.getElementById(`perm-edit-${moduleCode}`).checked,
          delete: document.getElementById(`perm-delete-${moduleCode}`).checked
        };
      }
    }

    // Create user with custom modules
    async function createUserWithModules() {
      const email = document.getElementById('user-email').value;
      const firstName = document.getElementById('user-firstname').value;
      const lastName = document.getElementById('user-lastname').value;
      const password = document.getElementById('user-password').value;
      const role = document.getElementById('user-role').value;

      if (!email || !firstName || !lastName || !password) {
        alert('Veuillez remplir tous les champs obligatoires');
        return;
      }

      try {
        // Create auth user
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              first_name: firstName,
              last_name: lastName,
            }
          }
        });

        if (authError) throw authError;

        // Wait for user creation
        await new Promise(resolve => setTimeout(resolve, 1000));

        // Assign role
        const { data: roleResult, error: roleError } = await assignRoleToUser(email, firstName, lastName, role);
        
        if (roleError) throw roleError;

        // Assign custom modules
        if (Object.keys(selectedModules).length > 0) {
          const moduleAssignments = Object.entries(selectedModules).map(([code, perms]) => ({
            module_code: code,
            permissions: perms
          }));

          const { error: moduleError } = await supabase.rpc('erp_assign_modules_to_user', {
            p_user_id: authData.user.id,
            p_module_assignments: JSON.stringify(moduleAssignments)
          });

          if (moduleError) throw moduleError;
        }

        alert('Utilisateur créé avec succès!');
        loadUsers();
        
        // Clear form
        document.getElementById('user-email').value = '';
        document.getElementById('user-firstname').value = '';
        document.getElementById('user-lastname').value = '';
        document.getElementById('user-password').value = '';
        selectedModules = {};
        document.querySelectorAll('.module-card').forEach(card => card.classList.remove('selected'));

      } catch (error) {
        console.error('Error creating user:', error);
        alert('Erreur lors de la création: ' + error.message);
      }
    }

    // Load existing users
    async function loadUsers() {
      try {
        const { data: users, error } = await getEnterpriseUsers();
        
        if (error) throw error;

        renderUsers(users);
      } catch (error) {
        console.error('Error loading users:', error);
      }
    }

    // Render users
    function renderUsers(users) {
      const container = document.getElementById('users-list');
      if (!container) return;

      if (!users || users.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8; text-align: center;">Aucun utilisateur trouvé</p>';
        return;
      }

      container.innerHTML = users.map(user => `
        <div style="display: flex; align-items: center; gap: 16px; padding: 16px; border-bottom: 1px solid rgba(59, 130, 246, 0.1);">
          <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
            ${user.first_name ? user.first_name[0] : 'U'}${user.last_name ? user.last_name[0] : ''}
          </div>
          <div style="flex: 1;">
            <div style="font-weight: 600; color: #ffffff;">${user.first_name} ${user.last_name}</div>
            <div style="font-size: 12px; color: #94a3b8;">${user.email} • ${user.role}</div>
          </div>
          <button class="btn" style="padding: 8px 16px; background: rgba(59, 130, 246, 0.1); color: #3b82f6;" onclick="editUser('${user.id}')">
            Modifier
          </button>
        </div>
      `).join('');
    }

    // Edit user
    function editUser(userId) {
      alert('Fonctionnalité de modification à implémenter pour utilisateur: ' + userId);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadModules();
      loadUsers();

      // Menu mobile
      const sidebar = document.querySelector('.management-sidebar');
      const overlay = document.getElementById('mgmt-overlay');
      const menuBtn = document.getElementById('mgmt-menu-btn');
      const closeMenu = () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      };
      menuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      });
      overlay.addEventListener('click', closeMenu);
      sidebar.addEventListener('click', (e) => {
        if (e.target.closest('a') && window.innerWidth <= 1024) closeMenu();
      });
    });
  </script>
</body>
</html>
