<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module - HAITI REH-CARE ERP</title>
  <link rel="stylesheet" href="/assets/css/variables.css?v=9">
  <link rel="stylesheet" href="/assets/css/main.css?v=9">
  <link rel="stylesheet" href="/assets/css/layout.css?v=9">
  <link rel="stylesheet" href="/assets/css/components.css?v=9">
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=9">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js?v=10"></script>
  <script src="/assets/js/auth.js?v=11"></script>
  <script src="/assets/js/layout.js?v=10"></script>
  <script src="/assets/js/annexes.js?v=11"></script>
  <script src="/assets/js/patients.js?v=14"></script>
  <script src="/assets/js/branch.js?v=13"></script>
  <script src="/assets/js/clinique.js?v=12"></script>
  <script src="/assets/js/caisse_ops.js?v=12"></script>
  <script src="/assets/js/ops.js?v=12"></script>
  <script src="/assets/js/rapports_mensuels.js?v=12"></script>
</head>
<body>
  <!-- Page de module GENERIQUE.
       Elle rend n'importe quel module a la volee: /module.html?m=<code>
       Les metadonnees viennent de ERP_MODULE_REGISTRY + erp_modules,
       et les donnees de la table erp_<code> si elle existe. -->
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/img/logohaitirecare.png" alt="Logo" class="sidebar-logo">
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name"></div>
          <div class="sidebar-user-role"></div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-item" onclick="logout()">
          <i data-lucide="log-out"></i>
          <span>Déconnexion</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="topbar-title" id="module-title">Module</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-actions">
            <button class="topbar-btn">
              <i data-lucide="bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="topbar-user">
              <div class="topbar-user-avatar"></div>
              <span class="topbar-user-name"></span>
            </div>
          </div>
        </div>
      </header>
      <div class="content-area" id="module-content">
        <div class="loading">
          <div class="loading-spinner"></div>
          <div class="loading-text">Chargement du module...</div>
        </div>
        <div class="skeleton-card" style="margin-top: var(--space-6);">
          <div class="skeleton" style="height: 18px; width: 35%; margin-bottom: 22px;"></div>
          <div class="skeleton" style="height: 14px; margin-bottom: 14px;"></div>
          <div class="skeleton" style="height: 14px; margin-bottom: 14px;"></div>
          <div class="skeleton" style="height: 14px; margin-bottom: 14px;"></div>
          <div class="skeleton" style="height: 14px; width: 65%;"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Colonnes a ne jamais afficher/editer dans le rendu generique
    const SYSTEM_COLUMNS = ['id', 'created_at', 'updated_at', 'created_by', 'enterprise_id', 'user_id'];

    let moduleCode = null;
    let moduleMeta = null;
    let tableName = null;
    let tableColumns = [];

    function prettify(code) {
      return code.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    async function loadModuleMeta(code) {
      // 1. Registre local (assets/js/auth.js)
      if (typeof ERP_MODULE_REGISTRY !== 'undefined' && ERP_MODULE_REGISTRY[code]) {
        const r = ERP_MODULE_REGISTRY[code];
        return { code, name: r.label, icon: r.icon, category: r.section, description: '' };
      }
      // 2. Base de donnees (erp_modules — inclut les modules sectoriels)
      try {
        const { data } = await db.from('erp_modules').select('*').eq('code', code).maybeSingle();
        if (data) return data;
      } catch (e) {
        console.warn('erp_modules:', e);
      }
      // 3. Fallback: module genere a partir du code
      return { code, name: prettify(code), icon: 'layout-grid', category: 'Modules', description: '' };
    }

    async function loadModuleData(code) {
      // Convention: les donnees d'un module vivent dans erp_<code>
      tableName = `erp_${code}`;
      try {
        // Filtre annex otomatik sou tab "branch-scoped" (RLS la fè menm bagay sou sèvè a)
        const q = (typeof erpSelect === 'function')
          ? erpSelect(tableName, '*')
          : db.from(tableName).select('*');
        const { data, error } = await q.order('created_at', { ascending: false }).limit(50);
        if (error) return { supported: false, rows: [] };
        return { supported: true, rows: data || [] };
      } catch (e) {
        return { supported: false, rows: [] };
      }
    }

    // Champs du formulaire quand la table est encore vide (cf. sql/13_modules_complets.sql)
    const MODULE_FIELDS = {
      pharmacie:           ['medicament', 'forme', 'dosage', 'quantite', 'prix_unitaire', 'date_expiration', 'lot', 'fournisseur'],
      fournisseurs:        ['nom', 'contact', 'phone', 'email', 'adresse', 'categorie', 'notes'],
      factures:            ['client_nom', 'numero', 'date_facture', 'montant', 'devise', 'statut', 'notes'],
      facturation_medical: ['patient_nom', 'service', 'date_facture', 'montant', 'devise', 'mode_paiement', 'statut', 'notes'],
      ordonnances:         ['patient_nom', 'medecin', 'date_ordonnance', 'prescription', 'posologie', 'duree', 'notes'],
      agenda:              ['titre', 'date_event', 'heure_debut', 'heure_fin', 'lieu', 'description'],
      ventes:              ['designation', 'client_nom', 'quantite', 'prix_unitaire', 'total', 'statut'],
      patients:            ['nom', 'prenom', 'date_naissance', 'sexe', 'phone', 'email', 'adresse', 'diagnostic'],
      services:            ['name', 'category', 'price', 'devise', 'duration_min', 'description'],
      rdv:                 ['patient_nom', 'patient_prenom', 'patient_phone', 'date_rdv', 'heure_rdv', 'motif', 'notes'],
      seances:             ['date_seance', 'heure', 'duree_min', 'type_seance', 'observations'],
      protheses:           ['type_prothese', 'membre', 'etape', 'cout', 'notes'],
      ortheses:            ['type_orthese', 'zone', 'etape', 'cout', 'notes']
    };

    function inferColumns(rows) {
      if (rows.length) {
        return Object.keys(rows[0]).filter(c => !SYSTEM_COLUMNS.includes(c));
      }
      return MODULE_FIELDS[moduleCode] || ['nom', 'description'];
    }

    function inputType(c) {
      if (/^(date|date_)/.test(c)) return 'date';
      if (/^heure/.test(c)) return 'time';
      if (/^(prix|price|montant|quantite|total|cout|seuil|duree_min|duration_min)/.test(c)) return 'number';
      if (c === 'email') return 'email';
      return 'text';
    }

    function renderTable(rows, columns) {
      if (!rows.length) {
        return `<div style="text-align: center; padding: var(--space-8, 32px); color: var(--clr-text-muted, #94a3b8);">Aucune donnée enregistrée.</div>`;
      }
      return `
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>${columns.map(c => `<th>${prettify(c)}</th>`).join('')}</tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>${columns.map(c => `<td>${formatCell(row[c])}</td>`).join('')}</tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function formatCell(v) {
      if (v === null || v === undefined) return '-';
      if (typeof v === 'boolean') return v ? 'Oui' : 'Non';
      if (typeof v === 'object') return JSON.stringify(v);
      return String(v);
    }

    function renderAddForm(columns) {
      const editable = columns.filter(c => !SYSTEM_COLUMNS.includes(c)).slice(0, 8);
      if (!editable.length) return '';
      return `
        <div class="card" style="margin-top: var(--space-6);">
          <div class="card-header"><h3 class="card-title">Nouvel élément</h3></div>
          <div class="card-body" style="padding: var(--space-5);">
            <form id="module-add-form">
              <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;">
                ${editable.map(c => `
                  <div class="form-group">
                    <label class="form-label">${prettify(c)}</label>
                    <input type="${inputType(c)}" name="${c}" class="form-input"${inputType(c) === 'number' ? ' step="any"' : ''}>
                  </div>
                `).join('')}
              </div>
              <button type="submit" class="btn btn-primary" style="margin-top: 16px;">
                <i data-lucide="plus"></i> Ajouter
              </button>
            </form>
          </div>
        </div>
      `;
    }

    async function renderModule() {
      const container = document.getElementById('module-content');
      const titleEl = document.getElementById('module-title');

      moduleCode = new URLSearchParams(window.location.search).get('m');
      if (!moduleCode) {
        titleEl.textContent = 'Module';
        container.innerHTML = '<div class="card" style="padding: 32px; text-align: center;">Aucun module spécifié.</div>';
        return;
      }

      moduleMeta = await loadModuleMeta(moduleCode);
      titleEl.textContent = moduleMeta.name;
      document.title = `${moduleMeta.name} - HAITI REH-CARE ERP`;

      // Modil ki gen renderer dedye (dosye pasyan konplè, jestion annex)
      const CUSTOM = {
        patients:          typeof renderPatientsModule === 'function' ? renderPatientsModule : null,
        annexes:           typeof renderAnnexesModule === 'function' ? renderAnnexesModule : null,
        rdv:               typeof renderRdvModule === 'function' ? renderRdvModule : null,
        consultations:     typeof renderConsultationsModule === 'function' ? renderConsultationsModule : null,
        seances:           typeof renderSeancesModule === 'function' ? renderSeancesModule : null,
        atelier:           typeof renderAtelierModule === 'function' ? renderAtelierModule : null,
        encaissements:     typeof renderEncaissementsModule === 'function' ? renderEncaissementsModule : null,
        service_client:    typeof renderServiceClientModule === 'function' ? renderServiceClientModule : null,
        achats:            typeof renderAchatsModule === 'function' ? renderAchatsModule : null,
        audit:             typeof renderAuditModule === 'function' ? renderAuditModule : null,
        rapports_mensuels: typeof renderRapportsMensuelsModule === 'function' ? renderRapportsMensuelsModule : null
      };
      if (CUSTOM[moduleCode]) {
        await CUSTOM[moduleCode](container, moduleMeta);
        if (typeof lucide !== 'undefined') lucide.createIcons();
        return;
      }

      const { supported, rows } = await loadModuleData(moduleCode);
      tableColumns = inferColumns(rows);

      const headerCard = `
        <div class="card" style="margin-bottom: var(--space-6);">
          <div style="display: flex; align-items: center; gap: 16px; padding: var(--space-5);">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #6366f1); display: flex; align-items: center; justify-content: center; color: white;">
              <i data-lucide="${moduleMeta.icon || 'layout-grid'}"></i>
            </div>
            <div>
              <h2 style="margin: 0; font-size: 20px;">${moduleMeta.name}</h2>
              <p style="margin: 4px 0 0; color: var(--clr-text-muted, #94a3b8); font-size: 13px;">
                ${moduleMeta.description || `Module ${moduleMeta.category || 'métier'} — interface générée automatiquement.`}
              </p>
            </div>
          </div>
        </div>
      `;

      if (supported) {
        container.innerHTML = headerCard + `
          <div class="card">
            <div class="card-header"><h3 class="card-title">Données — ${moduleMeta.name}</h3></div>
            ${renderTable(rows, tableColumns)}
          </div>
          ${renderAddForm(tableColumns)}
        `;

        const form = document.getElementById('module-add-form');
        if (form) {
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            const record = {};
            tableColumns.forEach(c => {
              const v = fd.get(c);
              if (v !== null && v !== '') record[c] = v;
            });
            if (!Object.keys(record).length) return;
            // Stamp annex sou insert — selman si tab la gen kolòn nan
            // (RLS/trigger sèvè verifye; tab san annexe_id pa dwe resevwa li)
            const scoped = typeof tableHasBranch === 'function' && tableHasBranch(tableName);
            const payload = (scoped && typeof withBranch === 'function') ? withBranch(record) : record;
            const { error } = await db.from(tableName).insert(payload);
            if (error) {
              alert('Erreur: ' + error.message);
            } else {
              if (typeof logActivity === 'function') logActivity('Création', moduleMeta.name, `Nouvel élément dans ${tableName}`);
              renderModule();
            }
          });
        }
      } else {
        container.innerHTML = headerCard + `
          <div class="card" style="padding: 40px; text-align: center;">
            <i data-lucide="puzzle" style="width: 40px; height: 40px; color: #3b82f6; margin-bottom: 16px;"></i>
            <h3 style="margin: 0 0 8px;">Module actif</h3>
            <p style="color: var(--clr-text-muted, #94a3b8); max-width: 480px; margin: 0 auto;">
              Ce module est activé pour votre centre. Son interface dédiée sera
              configurée par l'administration de HAITI REH-CARE.
            </p>
            ${isErpOwner(window.currentUser) ? `
              <p style="color: var(--clr-text-muted, #94a3b8); max-width: 480px; margin: 12px auto 0; font-size: 13px;">
                Table <code>${tableName}</code> introuvable dans la base de données —
                exécutez <code>sql/13_modules_complets.sql</code> dans Supabase.
              </p>` : ''}
            <a href="/dashboard.html" class="btn btn-secondary" style="display: inline-flex; margin-top: 24px; text-decoration: none;">
              <i data-lucide="arrow-left"></i> Retour au tableau de bord
            </a>
          </div>
        `;
      }

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().then((user) => {
        if (user) renderModule();
      });
    });
  </script>
</body>
</html>
