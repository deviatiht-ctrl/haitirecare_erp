<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ERP Entreprise</title>
  <link rel="stylesheet" href="assets/css/variables.css?v=7">
  <link rel="stylesheet" href="assets/css/main.css?v=7">
  <link rel="stylesheet" href="assets/css/components.css?v=7">
  <style>
    /* ===== Layout ===== */
    .dashboard-container {
      display: flex;
      min-height: 100vh;
    }

    .dashboard-main {
      flex: 1;
      margin-left: 272px;
      padding: 28px 32px 48px;
      min-height: 100vh;
    }

    /* ===== Sidebar (toujours sombre pour le contraste) ===== */
    .dashboard-sidebar {
      width: 272px;
      background: var(--clr-bg-sidebar);
      padding: 22px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
      z-index: 160;
      overflow: hidden;
    }

    .dash-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 18px;
    }

    .dash-brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }

    .dash-brand-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dash-brand-type {
      font-size: 11px;
      color: #8b9bb4;
    }

    .dash-nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .dash-nav-section {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 14px 0 6px 10px;
    }

    .dash-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }

    .dash-nav-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
    }

    .dash-nav-item.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .dash-nav-item.admin {
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.12);
      font-weight: 600;
      margin-top: 4px;
    }

    .dash-nav-item i {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .dash-sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: auto;
    }

    .dash-user-chip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .dash-user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 14px;
      flex-shrink: 0;
    }

    .dash-user-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dash-user-role {
      font-size: 11px;
      color: #8b9bb4;
    }

    .dash-logout {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.22);
      color: #f87171;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .dash-logout:hover {
      background: rgba(239, 68, 68, 0.18);
    }

    .dash-logout i {
      width: 16px;
      height: 16px;
    }

    /* ===== Header ===== */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .dash-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .dashboard-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--clr-text);
      letter-spacing: -0.5px;
      margin: 0;
    }

    .dash-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--clr-primary-light);
      color: var(--clr-primary);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .dash-type-badge i {
      width: 13px;
      height: 13px;
    }

    .dash-subtitle {
      color: var(--clr-text-secondary);
      font-size: 14px;
      margin: 0;
    }

    .dash-subtitle strong {
      color: var(--clr-text);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: all var(--transition-fast);
    }

    .header-btn i {
      width: 15px;
      height: 15px;
    }

    .header-btn-primary {
      background: var(--clr-primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .header-btn-primary:hover {
      background: var(--clr-primary-dark);
      transform: translateY(-1px);
    }

    .header-btn-ghost {
      background: var(--clr-card);
      border-color: var(--clr-border);
      color: var(--clr-text-secondary);
    }

    .header-btn-ghost:hover {
      color: var(--clr-text);
      border-color: var(--clr-text-muted);
    }

    .header-btn-admin {
      background: var(--clr-primary-light);
      color: var(--clr-primary);
    }

    .header-btn-admin:hover {
      background: var(--clr-primary);
      color: #fff;
    }

    .theme-toggle.header-btn {
      padding: 10px;
    }

    /* ===== Stats ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--clr-card);
      border: 1px solid var(--clr-border);
      border-radius: 16px;
      padding: 20px;
      transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: color-mix(in srgb, var(--accent, var(--clr-primary)) 40%, var(--clr-border));
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent, var(--clr-primary)) 12%, transparent);
      color: var(--accent, var(--clr-primary));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-icon i {
      width: 22px;
      height: 22px;
    }

    .stat-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent, var(--clr-primary));
      background: color-mix(in srgb, var(--accent, var(--clr-primary)) 10%, transparent);
      padding: 4px 9px;
      border-radius: 999px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--clr-text);
      letter-spacing: -0.5px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--clr-text-secondary);
      font-weight: 500;
      margin-top: 2px;
    }

    /* ===== Quick Actions ===== */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .quick-action-card {
      background: var(--clr-card);
      border: 1px solid var(--clr-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-base);
    }

    .quick-action-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: color-mix(in srgb, var(--accent, var(--clr-primary)) 45%, var(--clr-border));
    }

    .quick-action-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent, var(--clr-primary)), color-mix(in srgb, var(--accent, var(--clr-primary)) 72%, #000));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .quick-action-icon i {
      width: 22px;
      height: 22px;
    }

    .quick-action-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--clr-text);
    }

    .quick-action-desc {
      font-size: 12px;
      color: var(--clr-text-muted);
      margin-top: 3px;
    }

    /* ===== Content Sections ===== */
    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-card {
      background: var(--clr-card);
      border: 1px solid var(--clr-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .section-card.full {
      grid-column: 1 / -1;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--clr-text);
      margin: 0;
    }

    .section-link {
      font-size: 13px;
      color: var(--clr-primary);
      text-decoration: none;
      font-weight: 600;
    }

    .section-link:hover {
      text-decoration: underline;
    }

    .dash-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .dash-table th {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--clr-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--clr-border);
    }

    .dash-table td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--clr-border);
      color: var(--clr-text);
    }

    .dash-table tbody tr:last-child td {
      border-bottom: none;
    }

    .dash-table tbody tr:hover {
      background: var(--clr-bg-soft);
    }

    .td-accent {
      font-weight: 600;
      color: var(--clr-primary);
    }

    .td-success {
      font-weight: 600;
      color: var(--clr-success);
    }

    .td-muted {
      color: var(--clr-text-secondary);
    }

    .dash-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .dash-badge-success {
      background: var(--clr-success-light);
      color: var(--clr-success-dark);
    }

    [data-theme="dark"] .dash-badge-success {
      color: var(--clr-success);
    }

    .dash-badge-primary {
      background: var(--clr-primary-light);
      color: var(--clr-primary);
    }

    .dash-list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      margin: 0 -14px;
      border-radius: 10px;
      border-bottom: 1px solid var(--clr-border);
      transition: background-color var(--transition-fast);
    }

    .dash-list-row:last-child {
      border-bottom: none;
    }

    .dash-list-row:hover {
      background: var(--clr-bg-soft);
    }

    .dash-list-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .dash-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--clr-primary-light);
      color: var(--clr-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    .dash-row-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--clr-text);
    }

    .dash-row-sub {
      font-size: 12px;
      color: var(--clr-text-muted);
    }

    .dash-empty {
      text-align: center;
      padding: 36px;
      color: var(--clr-text-muted);
      font-size: 13px;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }

    .module-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 22px 14px;
      background: var(--clr-bg-soft);
      border: 1px solid var(--clr-border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--clr-text);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      transition: all var(--transition-fast);
    }

    .module-tile:hover {
      border-color: var(--clr-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .module-tile i {
      width: 24px;
      height: 24px;
      color: var(--clr-primary);
    }

    /* ===== Page Loader ===== */
    .erp-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--clr-bg);
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .erp-loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .erp-loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .erp-loader-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
      animation: loader-pulse 1.8s ease-in-out infinite;
    }

    .erp-loader-bar {
      width: 190px;
      height: 5px;
      border-radius: 999px;
      background: var(--clr-border);
      overflow: hidden;
      position: relative;
    }

    .erp-loader-bar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      animation: loader-slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .erp-loader-text {
      font-size: 13px;
      color: var(--clr-text-muted);
      font-weight: 500;
    }

    @keyframes loader-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
      }
      50% {
        transform: scale(1.07);
        box-shadow: 0 16px 40px rgba(99, 102, 241, 0.55);
      }
    }

    @keyframes loader-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(430%); }
    }

    /* Skeleton sombre (dans la sidebar) */
    .skeleton-dark {
      background: rgba(255, 255, 255, 0.07);
    }

    .skeleton-dark::after {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
    }

    /* ===== Mobile: menu + overlay ===== */
    .mobile-menu-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 200;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .mobile-menu-btn:active {
      transform: scale(0.94);
    }

    .mobile-menu-btn i {
      width: 24px;
      height: 24px;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(2px);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--transition-base), visibility var(--transition-base);
    }

    .sidebar-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* ===== Responsive ===== */
    @media (max-width: 1400px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .quick-actions {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 1024px) {
      .dashboard-sidebar {
        transform: translateX(-100%);
        transition: transform var(--transition-slow);
        box-shadow: none;
      }

      .dashboard-sidebar.open {
        transform: translateX(0);
        box-shadow: 20px 0 60px rgba(0, 0, 0, 0.35);
      }

      .dashboard-main {
        margin-left: 0;
      }

      .mobile-menu-btn {
        display: flex;
      }
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .quick-actions {
        grid-template-columns: 1fr;
      }

      .dashboard-main {
        padding: 76px 16px 96px;
      }

      .dashboard-header {
        flex-direction: column;
      }

      .dashboard-header h1 {
        font-size: 22px;
      }

      .header-actions {
        width: 100%;
        flex-wrap: wrap;
      }

      .header-btn {
        flex: 1;
        justify-content: center;
        min-height: 44px;
      }

      .theme-toggle.header-btn {
        flex: 0 0 auto;
      }

      .stat-card,
      .section-card,
      .quick-action-card {
        border-radius: 14px;
      }

      .dash-table {
        font-size: 12px;
      }

      .dash-table th,
      .dash-table td {
        padding: 10px;
      }
    }

    @media (max-width: 480px) {
      .quick-action-card {
        display: flex;
        align-items: center;
        text-align: left;
        gap: 14px;
        padding: 14px 16px;
      }

      .quick-action-icon {
        margin: 0;
        flex-shrink: 0;
      }

      .quick-action-desc {
        margin-top: 2px;
      }

      .dash-list-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js?v=7"></script>
  <script src="assets/js/auth.js?v=7"></script>
  <script src="assets/js/modular-dashboard.js?v=7"></script>
</head>
<body>
  <!-- Overlay + bouton menu mobile -->
  <div class="sidebar-overlay" id="dash-overlay"></div>
  <button class="mobile-menu-btn" id="dash-menu-btn" title="Menu">
    <i data-lucide="menu"></i>
  </button>

  <!-- Loader plein ecran — retire par modular-dashboard.js une fois rendu -->
  <div class="erp-loader" id="erp-loader">
    <div class="erp-loader-inner">
      <div class="erp-loader-logo">E</div>
      <div class="erp-loader-bar"></div>
      <div class="erp-loader-text">Chargement de votre espace...</div>
    </div>
  </div>

  <!-- Tout le contenu est genere dynamiquement par modular-dashboard.js
       selon les modules actives de l'entreprise (erp_enterprise_types)
       et les permissions de l'utilisateur. -->
  <div class="dashboard-container">
    <!-- Sidebar Dynamique -->
    <div class="dashboard-sidebar" id="dynamic-sidebar">
      <div class="skeleton skeleton-dark" style="height: 44px; border-radius: 12px; margin-bottom: 20px;"></div>
      <div class="skeleton skeleton-dark" style="height: 12px; width: 90px; margin: 0 0 14px 10px;"></div>
      <div class="skeleton skeleton-dark" style="height: 40px; border-radius: 10px; margin-bottom: 8px;"></div>
      <div class="skeleton skeleton-dark" style="height: 40px; border-radius: 10px; margin-bottom: 8px;"></div>
      <div class="skeleton skeleton-dark" style="height: 40px; border-radius: 10px; margin-bottom: 8px;"></div>
      <div class="skeleton skeleton-dark" style="height: 40px; border-radius: 10px;"></div>
    </div>

    <!-- Main Content -->
    <div class="dashboard-main">
