<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rendez-vous - HAITI REH-CARE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0d9488;
      --teal-dark: #0f766e;
      --teal-soft: #ccfbf1;
      --navy: #0f172a;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(700px 320px at 90% -5%, rgba(13, 148, 136, 0.10), transparent 60%),
        radial-gradient(500px 260px at 0% 100%, rgba(14, 165, 233, 0.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 24px;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--teal-dark); }
    .back-link svg { width: 15px; height: 15px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.06);
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--teal), #0ea5e9);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 8px 18px rgba(13, 148, 136, 0.3);
    }

    .card-icon svg { width: 24px; height: 24px; }

    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .card-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 26px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 7px;
    }

    label .req { color: var(--danger); }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .service-preview {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding: 12px 14px;
      background: #f0fdfa;
      border: 1px solid var(--teal-soft);
      border-radius: 12px;
    }

    .service-preview.show { display: flex; }
    .service-preview .sp-price {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 17px;
      color: var(--teal-dark);
      white-space: nowrap;
    }
    .service-preview .sp-dur {
      font-size: 12px;
      color: var(--muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      color: #fff;
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.3);
    }

    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(13, 148, 136, 0.4); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn svg { width: 16px; height: 16px; }

    .form-note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .form-error {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
    }

    .form-error.show { display: flex; }
    .form-error svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ===== Succes ===== */
    .success {
      text-align: center;
      padding: 16px 0;
    }

    .success-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--teal-soft);
      color: var(--teal);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .success-icon svg { width: 34px; height: 34px; }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success h2 {
      font-family: 'Manrope', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .success p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .recap {
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .recap-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
    }

    .recap-row:last-child { border-bottom: none; }
    .recap-row .k { color: var(--muted); }
    .recap-row .v { font-weight: 600; color: var(--navy); text-align: right; }

    .btn-outline {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .btn-outline:hover { border-color: var(--teal); color: var(--teal-dark); }

    /* ===== Loading / erreur ===== */
    .state { text-align: center; padding: 60px 20px; }

    .loader-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 25%, var(--teal) 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      animation: spin 0.8s cubic-bezier(0.5, 0.15, 0.5, 0.85) infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .card { padding: 24px 18px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js?v=7"></script>
</head>
<body>
  <div class="page">
    <a class="back-link" id="back-link" href="#">
      <i data-lucide="arrow-left"></i> Retour au catalogue
    </a>

    <div class="card" id="app">
      <div class="state" id="state-loading">
        <div class="loader-ring"></div>
        <div style="font-size: 14px; color: var(--muted); font-weight: 500;">Chargement...</div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const enterpriseId = params.get('e');
    const preServiceId = params.get('s');

    let company = null;
    let services = [];

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function money(v, devise) {
      return `${Number(v || 0).toLocaleString('fr-FR')} ${esc(devise || 'HTG')}`;
    }

    function renderError(title, msg) {
      document.getElementById('app').innerHTML = `
        <div class="state">
          <h2 style="font-family:'Manrope';color:var(--navy);margin-bottom:8px;">${esc(title)}</h2>
          <p style="color:var(--muted);font-size:14px;">${esc(msg)}</p>
        </div>`;
    }

    async function init() {
      if (!enterpriseId) {
        renderError('Lien incomplet', 'Ce lien de réservation est incomplet. Demandez au centre de vous envoyer le lien complet.');
        return;
      }

      const { data, error } = await db.rpc('erp_public_catalog', { p_enterprise_id: enterpriseId });
      if (error || !data) {
        console.error(error);
        renderError('Service indisponible', 'Impossible de charger le formulaire pour le moment. Réessayez plus tard.');
        return;
      }

      company = data.company || {};
      services = data.services || [];
      document.title = `Rendez-vous — ${company.name || ''}`;
      document.getElementById('back-link').href = `catalogue.html?e=${enterpriseId}`;
      renderForm();
    }

    function renderForm() {
      const today = new Date().toISOString().split('T')[0];

      document.getElementById('app').innerHTML = `
        <div class="card-head">
          <div class="card-icon"><i data-lucide="calendar-plus"></i></div>
          <div>
            <h1>Prendre rendez-vous</h1>
            <div style="font-size:13px;color:var(--muted);">${esc(company.name || '')}</div>
          </div>
        </div>
        <p class="card-sub">Remplissez le formulaire — l'équipe vous confirmera votre rendez-vous.</p>

        <div class="form-error" id="form-error">
          <i data-lucide="alert-circle"></i><span id="form-error-text"></span>
        </div>

        <form id="rdv-form" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label>Nom <span class="req">*</span></label>
              <input type="text" name="patient_nom" required placeholder="Ex: JEAN">
            </div>
            <div class="form-group">
              <label>Prénom</label>
              <input type="text" name="patient_prenom" placeholder="Ex: Marie">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Téléphone <span class="req">*</span></label>
              <input type="tel" name="patient_phone" required placeholder="+509 XX XX XXXX">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" name="patient_email" placeholder="vous@exemple.com">
            </div>
          </div>

          <div class="form-group">
            <label>Service souhaité <span class="req">*</span></label>
            <select name="service_id" id="service-select" required>
              <option value="">— Choisir un service —</option>
              ${services.map(s => `
                <option value="${s.id}" data-price="${s.price}" data-devise="${esc(s.devise)}" data-dur="${s.duration_min || ''}" ${s.id === preServiceId ? 'selected' : ''}>
                  ${esc(s.name)} — ${Number(s.price || 0).toLocaleString('fr-FR')} ${esc(s.devise || 'HTG')}
                </option>
              `).join('')}
            </select>
            <div class="service-preview" id="service-preview">
              <span class="sp-dur" id="sp-dur"></span>
              <span class="sp-price" id="sp-price"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Date souhaitée <span class="req">*</span></label>
              <input type="date" name="date_rdv" required min="${today}">
            </div>
            <div class="form-group">
              <label>Heure souhaitée</label>
              <input type="time" name="heure_rdv">
            </div>
          </div>

          <div class="form-group">
            <label>Motif / Notes</label>
            <textarea name="motif" rows="3" placeholder="Décrivez brièvement votre besoin (douleur, blessure, suivi...)"></textarea>
          </div>

          <button type="submit" class="btn btn-primary" id="submit-btn">
            <i data-lucide="calendar-check"></i> Confirmer la demande
          </button>
          <p class="form-note">Vos informations restent confidentielles et ne servent qu'à organiser votre rendez-vous.</p>
        </form>
      `;

      lucide.createIcons();

      const select = document.getElementById('service-select');
      const preview = document.getElementById('service-preview');
      const updatePreview = () => {
        const opt = select.selectedOptions[0];
        if (!opt || !opt.value) { preview.classList.remove('show'); return; }
        document.getElementById('sp-price').textContent = money(opt.dataset.price, opt.dataset.devise);
        document.getElementById('sp-dur').textContent = opt.dataset.dur ? `${opt.dataset.dur} min` : '';
        preview.classList.add('show');
      };
      select.addEventListener('change', updatePreview);
      updatePreview();

      document.getElementById('rdv-form').addEventListener('submit', submitForm);
    }

    async function submitForm(e) {
      e.preventDefault();
      const form = e.target;
      const errBox = document.getElementById('form-error');
      const errText = document.getElementById('form-error-text');
      const btn = document.getElementById('submit-btn');
      errBox.classList.remove('show');

      const fd = new FormData(form);
      const payload = {
        enterprise_id: enterpriseId,
        patient_nom: (fd.get('patient_nom') || '').trim(),
        patient_prenom: (fd.get('patient_prenom') || '').trim() || null,
        patient_phone: (fd.get('patient_phone') || '').trim() || null,
        patient_email: (fd.get('patient_email') || '').trim() || null,
        service_id: fd.get('service_id') || null,
        date_rdv: fd.get('date_rdv') || null,
        heure_rdv: fd.get('heure_rdv') || null,
        motif: (fd.get('motif') || '').trim() || null,
        statut: 'en_attente'
      };

      if (!payload.patient_nom || !payload.patient_phone || !payload.service_id || !payload.date_rdv) {
        errText.textContent = 'Veuillez remplir tous les champs obligatoires (*).';
        errBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2"></i> Envoi en cours...';
      lucide.createIcons();

      const { error } = await db.from('erp_rdv').insert(payload);

      if (error) {
        console.error(error);
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="calendar-check"></i> Confirmer la demande';
        lucide.createIcons();
        errText.textContent = 'Une erreur est survenue. Veuillez réessayer ou contacter le centre directement.';
        errBox.classList.add('show');
        return;
      }

      const svc = services.find(s => s.id === payload.service_id);
      renderSuccess(payload, svc);
    }

    function renderSuccess(p, svc) {
      const dateFr = new Date(p.date_rdv + 'T00:00:00').toLocaleDateString('fr-FR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });

      document.getElementById('app').innerHTML = `
        <div class="success">
          <div class="success-icon"><i data-lucide="check"></i></div>
          <h2>Demande envoyée !</h2>
          <p>Votre demande de rendez-vous a bien été transmise à <strong>${esc(company.name || 'notre centre')}</strong>.<br>Nous vous contacterons pour confirmer.</p>

          <div class="recap">
            <div class="recap-row"><span class="k">Patient</span><span class="v">${esc(p.patient_nom)} ${esc(p.patient_prenom || '')}</span></div>
            <div class="recap-row"><span class="k">Service</span><span class="v">${esc(svc?.name || '—')}</span></div>
            <div class="recap-row"><span class="k">Date</span><span class="v">${esc(dateFr)}</span></div>
            ${p.heure_rdv ? `<div class="recap-row"><span class="k">Heure</span><span class="v">${esc(p.heure_rdv)}</span></div>` : ''}
            ${svc ? `<div class="recap-row"><span class="k">Tarif</span><span class="v">${money(svc.price, svc.devise)}</span></div>` : ''}
          </div>

          <a class="btn btn-outline" href="catalogue.html?e=${enterpriseId}">
            <i data-lucide="arrow-left"></i> Retour au catalogue
          </a>
        </div>
      `;
      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    init();
  </script>
</body>
</html>
